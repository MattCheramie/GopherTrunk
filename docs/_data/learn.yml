  - id: building-ai
    label: "Building AI Into Software"
    title: "Building AI Into Your Software — from your first API call to a feature you ship"
    tagline: "Go from using AI tools to building AI-powered features into your own software — model APIs, prompts in code, structured output, tools, retrieval, agents, evaluation, and shipping responsibly."
    start_slug: building-vs-using-ai
    workload: "PT7H"
    intro: >
      The AI in Software Dev path taught you to *use* AI to write code. This one
      teaches you to *build* AI into the software you ship — to call a model from
      your own program and turn it into a feature. Start with what changes when a
      language model becomes a component in your architecture, make your first API
      call, and learn to treat the model as a powerful but unreliable dependency.
      From there you'll write prompts as code, get reliable structured output, give
      the model tools, ground it in your own data with retrieval (RAG), let it act
      as an agent, and — crucially — evaluate, secure, and operate all of it in
      production. Examples lean on real software, including AI features you might
      add to a project like GopherTrunk. Pairs with the AI in Software Dev path; no
      AI background beyond it required.
    units:
      - id: foundations
        label: "Unit 1 — From Using AI to Building With It"
        blurb: "The shift from chatting with AI to calling it from your own code: what an AI feature is, the model as a component, how the API works, your first call, and the cost it carries."
        lessons:
          - slug: building-vs-using-ai
            title: What it means to build AI into software
            summary: The jump from using an AI tool to shipping an AI feature — what changes when the model runs inside your program instead of a chat window.
            minutes: 8
            level: beginner
            status: full
          - slug: llm-as-a-component
            title: The model as a probabilistic component
            summary: Designing around a dependency that is powerful, non-deterministic, and occasionally wrong — the mindset shift everything else builds on.
            minutes: 9
            level: beginner
            status: full
          - slug: how-a-model-api-works
            title: How a model API call works
            summary: Messages, roles, tokens, and the request/response cycle — what actually goes over the wire when your code talks to a model.
            minutes: 10
            level: beginner
            status: full
          - slug: your-first-api-call
            title: Your first API call
            summary: API keys, SDKs, and a first request in code — the smallest end-to-end example of software calling a model.
            minutes: 9
            level: beginner
            status: full
          - slug: cost-latency-and-limits
            title: Cost, latency & rate limits by design
            summary: Every call costs tokens and time — why cost, latency, and rate limits are design constraints you plan for, not afterthoughts.
            minutes: 9
            level: intermediate
            status: full

      - id: prompting-in-code
        label: "Unit 2 — Prompting in Code"
        blurb: "Turning prompts from throwaway chat messages into reliable, versioned parts of your program that produce output consistent enough to build on."
        lessons:
          - slug: prompts-as-code
            title: Prompts as code — system prompts & templates
            summary: Treating prompts as first-class, version-controlled artifacts — system vs. user roles, templating, and separating instructions from data.
            minutes: 9
            level: intermediate
            status: full
          - slug: context-and-user-input
            title: Feeding the model context & user input
            summary: Assembling the right context safely — injecting your data and user input into a prompt without letting it hijack your instructions.
            minutes: 9
            level: intermediate
            status: full
