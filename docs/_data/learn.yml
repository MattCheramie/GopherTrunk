  - id: digital-trunking
    label: "Digital & Trunked Radio"
    title: "Learn Digital & Trunked Radio — from analog roots to decoding every system"
    tagline: "How land-mobile radio went digital and learned to share channels — the history, the end-to-end signal chain, and every trunking system GopherTrunk follows."
    start_slug: why-radio-went-digital
    workload: "PT7H"
    intro: >
      Public-safety and commercial radio quietly went through two revolutions:
      trunking, which lets a whole fleet share a handful of frequencies, and the
      jump from analog to digital voice. This path tells that story from the
      start, then walks the digital signal end to end — vocoder, modulation,
      framing, control channel — before taking each trunking system in turn:
      P25, DMR, TETRA, NXDN, Motorola, EDACS, LTR, MPT-1327 and friends. You
      finish able to recognise a system on the waterfall and follow it in
      GopherTrunk. New to radio? Skim the RF & SDR path first; this one assumes
      only the basics.
    modules:
      - id: history
        label: "Module 1 — A Brief History of Trunked & Digital Radio"
        blurb: "How we got here: from one-frequency-per-fleet, to shared trunked channels, to the digital standards that run public safety today."
        lessons:
          - slug: why-radio-went-digital
            title: Why radio went digital
            summary: The analog two-way era, the problems it ran into — congestion, privacy, capacity — and the pressures that pushed radio toward digital.
            minutes: 8
            level: beginner
            status: full
          - slug: birth-of-trunking
            title: "The birth of trunking: sharing channels"
            summary: How automatic channel-sharing replaced fixed frequencies, and why one control channel changed everything about scanning.
            minutes: 9
            level: beginner
            status: full
          - slug: analog-trunking-era
            title: "The analog trunking era: SmartNet, EDACS, LTR & MPT-1327"
            summary: The first big trunked systems were analog voice with digital control — the architectures that still shape digital trunking today.
            minutes: 9
            level: intermediate
            status: full
          - slug: the-digital-leap
            title: "The digital leap: P25, TETRA & DMR are born"
            summary: How three regions answered the same question differently, giving us the digital trunking standards in use across the world.
            minutes: 9
            level: intermediate
            status: full
          - slug: standards-and-bodies
            title: "Standards & who sets them: APCO, ETSI, TIA & the DMRA"
            summary: Why open standards matter for interoperability, who writes them, and how to read a spec number when you meet one.
            minutes: 7
            level: beginner
            status: full

      - id: digital-radio
        label: "Module 2 — Digital Radio End-to-End"
        blurb: "The complete digital chain: turning a voice into bits, putting bits on a carrier, protecting them from errors, and packing many calls onto one channel."
        lessons:
          - slug: analog-vs-digital-voice
            title: Analog vs. digital voice
            summary: What actually changes when voice goes digital — the trade of graceful static for a clean signal that drops off a cliff.
            minutes: 8
            level: intermediate
            status: full
          - slug: voice-to-bits-vocoders
            title: "From voice to bits: vocoders"
            summary: How IMBE and AMBE+2 squeeze speech into a few kbps, why every digital system needs one, and what that means for decoding.
            minutes: 9
            level: advanced
            status: full
          - slug: digital-modulation-for-trunking
            title: "Digital modulation for trunking: C4FM, π/4-DQPSK & CQPSK"
            summary: The handful of modulations digital trunking actually uses, how to spot each on a constellation, and why P25 picked two of them.
            minutes: 10
            level: intermediate
            status: full
          - slug: framing-fec-interleaving
            title: "Framing, error correction & interleaving"
            summary: Why raw bits are never sent bare — how frames, FEC, and interleaving let a decoder rebuild a message through fading and noise.
            minutes: 9
            level: advanced
            status: full
          - slug: tdma-vs-fdma
            title: "TDMA vs. FDMA: fitting more calls on a channel"
            summary: Time slots vs. separate frequencies — the capacity trick behind P25 Phase 2 and DMR, and how it changes what you decode.
            minutes: 8
            level: intermediate
            status: full
          - slug: the-control-channel
            title: "The control channel: the system's heartbeat"
            summary: A frequency that carries only data — what it broadcasts, why it never stops, and why decoding it is the whole game.
            minutes: 9
            level: intermediate
            status: full

      - id: how-trunking-works
        label: "Module 3 — How Trunking Works"
        blurb: "The mechanics every trunked system shares: talkgroups, affiliation, the request-grant-release dance, multi-site coverage, and encryption."
        lessons:
          - slug: conventional-vs-trunked
            title: Conventional vs. trunked radio
            summary: Fixed frequencies vs. channels assigned on demand — the core difference, and why a trunked system can't be scanned the old way.
            minutes: 8
            level: beginner
            status: full
          - slug: talkgroups-ids-affiliation
            title: "Talkgroups, radio IDs & affiliation"
            summary: The virtual channels you actually follow, the unit IDs behind them, and how radios register with the system over the air.
            minutes: 9
            level: intermediate
            status: full
          - slug: anatomy-of-a-call
            title: "Anatomy of a trunked call: request, grant, release"
            summary: One call from keyup to hang-time, step by step — the exact sequence a control-channel decoder watches unfold.
            minutes: 9
            level: intermediate
            status: full
          - slug: control-channel-signaling
            title: "Control-channel signaling: what the data says"
            summary: Inside the message stream — grants, updates, registrations, and system parameters — and how a tracker turns it into a live map.
            minutes: 10
            level: advanced
            status: full
          - slug: trunking-flavors
            title: "Trunking flavors: dedicated vs. distributed, message vs. transmission"
            summary: The design choices that distinguish systems — where the control data lives and how long a channel stays assigned.
            minutes: 9
            level: intermediate
            status: full
          - slug: sites-simulcast-roaming
            title: "Sites, simulcast & roaming: multi-site systems"
            summary: How a system covers a whole region with many sites, what simulcast is, and why both matter when you pick a control channel.
            minutes: 9
            level: advanced
            status: full
          - slug: encryption-and-authentication
            title: Encryption & authentication
            summary: Why some talkgroups go silent, how encryption is signaled, what GopherTrunk can and can't do, and how radios prove who they are.
            minutes: 8
            level: intermediate
            status: full

      - id: p25-dmr
        label: "Module 4 — P25 & DMR: The Dominant Systems"
        blurb: "The two digital trunking standards you'll meet most — examined in depth, from frame structure to the way GopherTrunk follows them."
        lessons:
          - slug: p25-phase-1
            title: P25 Phase 1
            summary: The North American public-safety standard — C4FM, 9600 bps, IMBE voice, and the control-channel messages that drive it.
            minutes: 12
            level: intermediate
            status: full
          - slug: p25-phase-2
            title: "P25 Phase 2: TDMA"
            summary: Doubling capacity with two-slot TDMA and the AMBE+2 vocoder — how Phase 2 differs from Phase 1 on the air and in the decoder.
            minutes: 10
            level: advanced
            status: full
          - slug: dmr-tier-2-3
            title: "DMR: Tier II & Tier III"
            summary: The ETSI two-slot TDMA standard — conventional repeaters vs. full Tier III trunking, and what GopherTrunk reads from each.
            minutes: 11
            level: intermediate
            status: full

      - id: other-systems
        label: "Module 5 — Other Digital Systems You'll Meet"
        blurb: "The rest of the landscape GopherTrunk decodes — from European TETRA to legacy LTR, and the amateur digital voice modes in between."
        lessons:
          - slug: tetra
            title: TETRA
            summary: Europe's public-safety standard — four-slot TDMA, π/4-DQPSK, and why it sounds and looks unlike anything in North America.
            minutes: 9
            level: intermediate
            status: full
          - slug: nxdn
            title: NXDN
            summary: The narrow 4FSK system from Icom and Kenwood — NXDN48/96, its control channel, and where you'll run into it.
            minutes: 8
            level: intermediate
            status: full
          - slug: motorola-smartnet
            title: "Motorola SmartNet / SmartZone & Type II"
            summary: The analog-trunking giant — Type II fleet/subfleet IDs, SmartZone multi-site, and why so much of it is still on the air.
            minutes: 9
            level: intermediate
            status: full
          - slug: edacs-ltr-mpt1327
            title: "EDACS, LTR & MPT-1327"
            summary: Three legacy trunking families — sub-audible LTR, GE/Ericsson EDACS, and the British MPT-1327 standard — and how to recognise them.
            minutes: 9
            level: intermediate
            status: full
          - slug: dpmr-dstar-ysf
            title: "dPMR, D-STAR & System Fusion"
            summary: The lighter digital modes — dPMR's NXDN cousin, plus the amateur-radio voice standards D-STAR and Yaesu System Fusion.
            minutes: 7
            level: beginner
            status: full

      - id: gophertrunk
        label: "Module 6 — Decoding Digital Trunking with GopherTrunk"
        blurb: "Everything applied: spot a system on the waterfall, find its control channel, follow every call, and fix it when the lock won't hold."
        lessons:
          - slug: identifying-the-system
            title: Identifying what you're hearing
            summary: Reading bandwidth, symbol rate, and the waterfall to tell P25 from DMR from NXDN — before you ever decode a bit.
            minutes: 9
            level: intermediate
            status: full
          - slug: finding-the-control-channel
            title: Finding the control channel
            summary: Using Hunt, online databases, and the data burst's telltale signature to lock the one frequency that maps the whole system.
            minutes: 9
            level: intermediate
            status: full
          - slug: following-a-system-end-to-end
            title: Following a system end to end
            summary: The full GopherTrunk path for a trunked call — control channel in, talkgroup grant, voice channel tuned, audio out.
            minutes: 10
            level: intermediate
            status: full
          - slug: multisite-and-simulcast-in-practice
            title: Multi-site & simulcast in practice
            summary: Choosing the right site, surviving simulcast distortion, and what to do when the system spans more than you can hear.
            minutes: 9
            level: advanced
            status: full
          - slug: troubleshooting-a-decode
            title: Troubleshooting a digital decode
            summary: A checklist for the usual culprits — gain, PPM, the wrong control channel, encryption, simulcast — when a system won't decode.
            minutes: 9
            level: advanced
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of digital & trunked radio terms
      summary: Plain-language definitions for every term in the learning path, cross-linked to the lessons.
      minutes: 12
      level: beginner
      status: full

  - id: intro-hardware
    label: "Intro to Hardware"
    title: "Intro to Hardware — from the cloud to the microcontroller"
    tagline: "The hardware a developer actually chooses between — servers, PCs, phones, single-board computers, and microcontrollers — what each is for, what runs on it, and how to pick."
    start_slug: what-is-hardware
    workload: "PT6H"
    intro: >
      Every project runs on something. This path is a guided tour of the hardware
      a developer chooses between — from a few dollars of shared web hosting up
      through VPSes, dedicated and home servers, the desktops and laptops you
      build on, the phones and tablets you ship to, and down to single-board
      computers and the tiny microcontrollers like the Arduino and ESP32. For
      each one you'll learn what it's for, the programming languages it runs, and
      its real strengths and drawbacks. The final module turns all of that into a
      practical way to decide which platform — often several working together —
      is right for your project. Examples lean on GopherTrunk, the kind of
      software-defined-radio software that can live on anything from a laptop to a
      Raspberry Pi by the antenna.
    modules:
      - id: foundations
        label: "Module 1 — Hardware Foundations"
        blurb: "The ideas every later module leans on: what hardware is, the parts inside every computer, the spectrum from cloud to microcontroller, and the trade-offs that drive every choice."
        lessons:
          - slug: what-is-hardware
            title: What is computer hardware?
            summary: Hardware vs. software, what counts as a computer, and why the same job can run on a server or a chip the size of a stamp — the one idea everything else builds on.
            minutes: 8
            level: beginner
            status: full
          - slug: building-blocks
            title: CPU, memory, storage & I/O
            summary: The four building blocks inside every computer, from a data center to a microcontroller, and how their size and speed define what a device can do.
            minutes: 9
            level: beginner
            status: full
          - slug: hardware-spectrum
            title: The hardware spectrum — cloud to microcontroller
            summary: A single map of every platform in this path, ordered by power, cost, and how much of it you control, so the rest of the path has a frame to hang on.
            minutes: 8
            level: beginner
            status: full
          - slug: languages-and-hardware
            title: Programming languages & where they run
            summary: Why a web host runs PHP and Python while a microcontroller runs C — how hardware shapes which languages are practical, and what "runs on" really means.
            minutes: 9
            level: beginner
            status: full
          - slug: cost-power-performance
            title: Cost, power & performance trade-offs
            summary: The handful of trade-offs — money, electricity, performance, control, and effort — that recur in every hardware decision you'll make.
            minutes: 8
            level: beginner
            status: full

      - id: servers
        label: "Module 2 — Servers & Hosting"
        blurb: "Where software runs for other people: the ladder from cheap shared web hosting, through VPSes and dedicated servers, to a server humming in your own home."
        lessons:
          - slug: web-hosting
            title: Web & shared hosting
            summary: The cheapest way to put something online — what shared hosting gives you, what it hides, the languages it runs, and where it stops being enough.
            minutes: 9
            level: beginner
            status: full
          - slug: vps
            title: Virtual private servers (VPS)
            summary: Your own slice of a server with root access — how virtualization carves one machine into many, what you can run, and the responsibility that comes with it.
            minutes: 9
            level: intermediate
            status: full
          - slug: dedicated-servers
            title: Dedicated servers
            summary: A whole physical machine that's yours alone — when raw, uncontended performance is worth the price, and what changes when nothing is shared.
            minutes: 8
            level: intermediate
            status: full
          - slug: home-servers
            title: Home servers & self-hosting
            summary: Running your own server on your own internet — the freedom, the costs nobody mentions, and why a Raspberry Pi or old PC can be a perfect first server.
            minutes: 9
            level: intermediate
            status: full

      - id: personal-computers
        label: "Module 3 — Personal Computers"
        blurb: "The machines you build software on: the trade between a fixed, powerful desktop and a portable laptop, and how to choose the one you'll work on every day."
        lessons:
          - slug: desktop-computers
            title: Desktop computers
            summary: The most power per dollar, endlessly upgradable, and going nowhere — what desktops are for, what they run, and where they shine for a developer.
            minutes: 8
            level: beginner
            status: full
          - slug: laptops
            title: Laptops
            summary: A whole computer you can carry — the portability-for-power trade, battery and thermal limits, and why most developers work on one anyway.
            minutes: 8
            level: beginner
            status: full
          - slug: choosing-a-dev-machine
            title: Choosing your development machine
            summary: Desktop, laptop, or both — matching your machine to how and where you work, and the specs that actually matter for writing software.
            minutes: 8
            level: intermediate
            status: full

      - id: mobile
        label: "Module 4 — Mobile Devices"
        blurb: "The computers in everyone's pocket and bag: what smartphones and tablets are good at, what they're not, and what it takes to build software for them."
        lessons:
          - slug: smartphones
            title: Smartphones
            summary: The most widespread computer on earth — its sensors and constraints, the platforms and languages behind apps, and why it's a target, not a dev machine.
            minutes: 8
            level: beginner
            status: full
          - slug: tablets
            title: Tablets
            summary: The big-screen cousin of the phone — where the extra size pays off, where tablets sit between phone and laptop, and what runs on them.
            minutes: 7
            level: beginner
            status: full
          - slug: developing-for-mobile
            title: Developing for mobile devices
            summary: Native, cross-platform, or web — the ways to build a mobile app, the languages and toolchains each uses, and the trade-offs between them.
            minutes: 10
            level: intermediate
            status: full

      - id: single-board-computers
        label: "Module 5 — Single-Board Computers"
        blurb: "A complete computer on one small board: what an SBC like the Raspberry Pi is, what it's brilliant at, how you program it, and where its limits begin."
        lessons:
          - slug: what-is-an-sbc
            title: What is a single-board computer?
            summary: A real, Linux-running computer the size of a credit card — how an SBC differs from both a PC and a microcontroller, and why GPIO pins change everything.
            minutes: 8
            level: beginner
            status: full
          - slug: raspberry-pi-and-family
            title: The Raspberry Pi & its alternatives
            summary: The board that defined the category, plus the rivals worth knowing — Pi Zero to Pi 5, Jetson, Rock, and BeagleBone — and how to tell them apart.
            minutes: 9
            level: beginner
            status: full
          - slug: programming-an-sbc
            title: Programming & running software on an SBC
            summary: It's just Linux — Python, C, Go, and the same tools you use on a PC, plus talking to the physical world through the GPIO header.
            minutes: 9
            level: intermediate
            status: full
          - slug: sbc-use-cases-and-limits
            title: SBC use cases, strengths & drawbacks
            summary: Home labs, media servers, robots, and edge sensors — where SBCs win, and the heat, power, storage, and reliability limits that decide when to reach for something else.
            minutes: 8
            level: intermediate
            status: full

      - id: microcontrollers
        label: "Module 6 — Microcontrollers"
        blurb: "The tiny chips that run the physical world: what a microcontroller is, the Arduino that made them approachable, the wireless ESP32, and how you program them."
        lessons:
          - slug: what-is-a-microcontroller
            title: What is a microcontroller?
            summary: A whole computer on one cheap, low-power chip with no operating system — how it differs from an SBC, and why it boots in milliseconds and runs for years.
            minutes: 9
            level: beginner
            status: full
          - slug: arduino
            title: Arduino & the maker ecosystem
            summary: The board and language that made microcontrollers approachable — what Arduino is, the sketch model, and the enormous ecosystem that grew around it.
            minutes: 9
            level: beginner
            status: full
          - slug: esp32
            title: ESP32 & wireless microcontrollers
            summary: A microcontroller with Wi-Fi and Bluetooth built in for a couple of dollars — why it powers most DIY smart-home gadgets and the Internet of Things.
            minutes: 9
            level: intermediate
            status: full
          - slug: mcu-programming-and-tradeoffs
            title: "Programming microcontrollers: languages, use cases & limits"
            summary: C/C++, MicroPython, and Rust on bare metal — the use cases microcontrollers own, and the tight memory, power, and tooling limits you design around.
            minutes: 9
            level: intermediate
            status: full

      - id: choosing-hardware
        label: "Module 7 — Choosing the Right Hardware"
        blurb: "Everything applied: turn a project's needs into the platform — or, more often, the combination of platforms — that fits it best, with a repeatable framework and worked examples."
        lessons:
          - slug: start-with-requirements
            title: Start with your requirements
            summary: Before you pick a board or a host, pin down what the project actually needs — performance, connectivity, power, budget, and where it has to live.
            minutes: 8
            level: beginner
            status: full
          - slug: matching-hardware-to-project
            title: Matching hardware to the project type
            summary: Websites, apps, data crunching, automation, sensors, and robots — the platforms each kind of project tends to reach for, and why.
            minutes: 9
            level: intermediate
            status: full
          - slug: combining-tiers
            title: "Combining tiers: device, server & cloud"
            summary: Real systems rarely live on one platform — how a microcontroller, an SBC, and a server team up, and where to draw the line between them.
            minutes: 9
            level: intermediate
            status: full
          - slug: decision-framework
            title: A practical decision framework
            summary: A repeatable checklist for turning requirements into a hardware choice, including the questions that quickly rule platforms in or out.
            minutes: 10
            level: advanced
            status: full
          - slug: worked-examples
            title: "Worked examples: picking hardware for real projects"
            summary: The framework applied end to end to several projects — a blog, a smart-home sensor, a home media server, and a GopherTrunk scanner — to make it concrete.
            minutes: 10
            level: advanced
            status: full

