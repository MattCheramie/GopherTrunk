  - id: ai-software-dev
    label: "AI in Software Dev"
    title: "Intro to Using AI in Software Development — from how models work to shipping with them"
    tagline: "How AI coding tools actually work, the providers and models, the ways to use them, and how to choose your stack and start today."
    start_slug: what-is-ai-for-coding
    workload: "PT5H"
    intro: >
      AI has gone from novelty to a daily tool for writing software, and this
      path is a guided, hype-free tour of how to use it well. Start under the
      hood — how large language models are trained, how they actually decide what
      to write next, and how the context window that feeds them really works —
      then map the landscape: which providers and models are used for coding,
      their strengths and trade-offs, the interfaces you reach them through, and
      how usage limits and cost work. From there you'll compare the ways people
      code with AI — the provider's app, an IDE integration, an agentic CLI, or a
      blend — and the whole spectrum from line-by-line completion to full "vibe
      coding". You'll learn to steer a model with prompts, skills, and AI config
      files, and to weigh one model against a combination of several. The path
      ends by helping you choose your own model, provider, and method and put AI
      to work in a real project. No coding background required, though the
      Intro to Software Development path pairs well; examples lean on real
      software, including the kind of signal-crunching code behind GopherTrunk.
    units:
      - id: how-models-work
        label: "Unit 1 — How AI Models Actually Work"
        blurb: "Under the hood before the hype: what an AI model is, how it's trained, how it decides what to write, how context works, and which kinds of models write code."
        lessons:
          - slug: what-is-ai-for-coding
            title: What is AI, for a developer?
            summary: LLMs, "narrow" vs "general", and why today's coding AI is next-token prediction rather than understanding — the one idea everything else builds on.
            minutes: 9
            level: beginner
            status: full
          - slug: how-models-are-trained
            title: How AI models are trained
            summary: Pretraining on oceans of text, fine-tuning, and RLHF — and why training explains knowledge cutoffs, bias, and the confident wrong answer.
            minutes: 10
            level: beginner
            status: full
          - slug: how-models-decide
            title: "How a model decides: tokens & prediction"
            summary: Tokenization, next-token prediction, temperature and sampling, and why the same prompt can give different code — and sometimes invents an API that doesn't exist.
            minutes: 10
            level: beginner
            status: full
          - slug: context-windows
            title: The context window, in detail
            summary: What "context" really is, why it's measured in tokens, the window's hard limits, attention and "lost in the middle", and why context is both your biggest lever and a cost driver.
            minutes: 11
            level: intermediate
            status: full
          - slug: types-of-models
            title: The types of AI models
            summary: LLMs, reasoning models, embeddings, multimodal, image and speech models — which ones write and plan code, and which power the embedded-AI features a later path will build on.
            minutes: 10
            level: intermediate
            status: full

      - id: providers-and-cost
        label: "Unit 2 — Providers, Models & What They Cost"
        blurb: "The market you're choosing from: the major providers and models for coding, their strengths and weaknesses, the interfaces you reach them through, and how limits and cost work."
        lessons:
          - slug: the-provider-landscape
            title: The provider & model landscape
            summary: The major AI providers, proprietary vs open-weight models, and a durable way to think about a field that ships a new leading model every few months.
            minutes: 9
            level: beginner
            status: full
          - slug: coding-models-compared
            title: Coding models compared
            summary: The strengths and weaknesses that actually distinguish coding models — capability, context size, speed, autonomy, and cost — framed to outlive this month's leaderboard.
            minutes: 11
            level: intermediate
            status: full
          - slug: interfaces-and-access
            title: "Interfaces: app, API, CLI & IDE"
            summary: The handful of ways a model reaches you — web chat, raw API, command-line tools, and editor plugins — and what each interface is and isn't for.
            minutes: 9
            level: beginner
            status: full
          - slug: usage-limits-and-tiers
            title: Usage limits & tiers
            summary: How rate limits and caps actually work — messages, tokens per minute, usage tiers — the difference between subscription and API metering, and how to design around them.
            minutes: 9
            level: intermediate
            status: full
          - slug: understanding-cost
            title: Understanding the cost
            summary: Token pricing for input and output, subscriptions vs pay-as-you-go, prompt caching, the real cost drivers, and how to estimate what a workflow will spend.
            minutes: 10
            level: intermediate
            status: full

      - id: ways-to-use
        label: "Unit 3 — Ways to Use AI in Your Workflow"
        blurb: "Where the AI actually lives while you work: the provider's app, your IDE, an agent in the terminal, or a deliberate blend — with the honest pluses and drawbacks of each."
        lessons:
          - slug: the-provider-app
            title: Using the provider's app
            summary: The chat window in your browser — the simplest on-ramp, what it's great at, and the copy-paste friction that eventually pushes people elsewhere.
            minutes: 8
            level: beginner
            status: full
          - slug: ide-integration
            title: AI inside your editor
            summary: Autocomplete plugins and AI-native editors that see your code as you type — the productivity jump, and the new failure modes that come with it.
            minutes: 9
            level: beginner
            status: full
          - slug: agentic-cli-tools
            title: Agentic & command-line tools
            summary: Tools that read your repo, run commands, and edit files on their own — what an agent can do, and the guardrails you need before you let it.
            minutes: 10
            level: intermediate
            status: full
          - slug: local-and-open-models
            title: Running local & open models
            summary: Open-weight models on your own hardware — Ollama, llama.cpp, and GPU limits — when running a model locally makes sense for coding and when it doesn't.
            minutes: 9
            level: intermediate
            status: full
          - slug: app-vs-ide-vs-both
            title: App, IDE, agent — or all three?
            summary: There's no single right answer — how to match the integration method to the task, and why most people end up using more than one.
            minutes: 8
            level: intermediate
            status: full

      - id: coding-modes
        label: "Unit 4 — Modes of AI-Assisted Coding"
        blurb: "The full spectrum, from a model finishing your line to a model building a feature unattended — what each mode is good for, and where it bites."
        lessons:
          - slug: code-completion
            title: Code & "sentence" completion
            summary: The inline grey-text suggestions that finish your line or block — how they work, where they shine, and why they rarely lead you far astray.
            minutes: 8
            level: beginner
            status: full
          - slug: chat-assisted-coding
            title: Chat-assisted coding
            summary: Conversation as the interface — generate, explain, refactor, and debug with a human in the loop reviewing every step.
            minutes: 9
            level: beginner
            status: full
          - slug: agentic-and-vibe-coding
            title: Agentic coding & "vibe coding"
            summary: Handing the model the wheel — autonomous plan-and-act loops and full "vibe coding", the productivity ceiling they raise, and the risks of trusting output you never read.
            minutes: 11
            level: intermediate
            status: full
          - slug: the-spectrum
            title: Choosing where on the spectrum to work
            summary: Completion, chat, agent, vibe — a single spectrum of how much you delegate, how to pick per task, and why every mode still ends in verification.
            minutes: 9
            level: intermediate
            status: full

      - id: directing-behavior
        label: "Unit 5 — Directing How the Model Writes Code"
        blurb: "Going from random results to reliable ones: prompting well, steering behavior with skills and config files, feeding the right context, and deciding between one model and many."
        lessons:
          - slug: prompting-for-code
            title: Prompting for code
            summary: What separates a vague request from one that gets the code you wanted — context, constraints, examples, and iterating instead of restarting.
            minutes: 9
            level: beginner
            status: full
          - slug: skills-and-config-files
            title: "Skills & AI config files"
            summary: Standing instructions that steer a model every time — skills, rules, and config files like CLAUDE.md and AGENTS.md — so you stop repeating yourself and get consistent code.
            minutes: 10
            level: intermediate
            status: full
          - slug: providing-context
            title: Feeding the model the right context
            summary: The model only knows what it can see — open files, repo retrieval and RAG, and tool/MCP connections — and how managing context decides the quality of the answer.
            minutes: 10
            level: intermediate
            status: full
          - slug: one-model-vs-many
            title: One model, or a combination?
            summary: Standardizing on a single model versus routing each task to the best tool — the case for each, and how multi-model setups actually work in practice.
            minutes: 9
            level: intermediate
            status: full

      - id: putting-it-together
        label: "Unit 6 — Putting AI to Work in Your Projects"
        blurb: "Everything applied: choose your model and provider, pick your method, keep the output trustworthy and safe, and start using AI in a real project today."
        lessons:
          - slug: choosing-model-and-provider
            title: Choosing your model & provider
            summary: A repeatable framework for picking a model and provider — or a deliberate combination — driven by your work, budget, and constraints rather than the hype cycle.
            minutes: 10
            level: intermediate
            status: full
          - slug: choosing-your-method
            title: Choosing your method
            summary: App, IDE, agent, or a blend — matching how you reach the model to how you actually work, and assembling a setup you'll stick with.
            minutes: 9
            level: intermediate
            status: full
          - slug: verification-and-trust
            title: Verifying AI-written code
            summary: AI writes plausible code, not always correct code — reviewing it, leaning on tests, catching hallucinations, and the discipline that keeps speed from costing you quality.
            minutes: 10
            level: intermediate
            status: full
          - slug: security-privacy-ethics
            title: Security, privacy & ethics
            summary: Where your code and prompts go, the licensing and IP questions, leaking secrets, the security of AI-written code, and using these tools responsibly.
            minutes: 9
            level: intermediate
            status: full
          - slug: getting-started-today
            title: Getting started today
            summary: Turning the whole path into action — concrete first steps for a real project, a worked example, and a look ahead to building AI into the software you ship.
            minutes: 10
            level: advanced
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of AI-for-development terms
      summary: Plain-language definitions for every term in the learning path — token, context window, RLHF, embedding, RAG, MCP, agent, vibe coding, and more — cross-linked to the lessons.
      minutes: 12
      level: beginner
      status: full

  - id: building-ai
    label: "Building AI Into Software"
    title: "Building AI Into Your Software — from your first API call to a feature you ship"
    tagline: "Go from using AI tools to building AI-powered features into your own software — model APIs, prompts in code, structured output, tools, retrieval, agents, evaluation, and shipping responsibly."
    start_slug: building-vs-using-ai
    workload: "PT7H"
    intro: >
      The AI in Software Dev path taught you to *use* AI to write code. This one
      teaches you to *build* AI into the software you ship — to call a model from
      your own program and turn it into a feature. Start with what changes when a
      language model becomes a component in your architecture, make your first API
      call, and learn to treat the model as a powerful but unreliable dependency.
      From there you'll write prompts as code, get reliable structured output, give
      the model tools, ground it in your own data with retrieval (RAG), let it act
      as an agent, and — crucially — evaluate, secure, and operate all of it in
      production. Examples lean on real software, including AI features you might
      add to a project like GopherTrunk. Pairs with the AI in Software Dev path; no
      AI background beyond it required.
    units:
      - id: foundations
        label: "Unit 1 — From Using AI to Building With It"
        blurb: "The shift from chatting with AI to calling it from your own code: what an AI feature is, the model as a component, how the API works, your first call, and the cost it carries."
        lessons:
          - slug: building-vs-using-ai
            title: What it means to build AI into software
            summary: The jump from using an AI tool to shipping an AI feature — what changes when the model runs inside your program instead of a chat window.
            minutes: 8
            level: beginner
            status: full
          - slug: llm-as-a-component
            title: The model as a probabilistic component
            summary: Designing around a dependency that is powerful, non-deterministic, and occasionally wrong — the mindset shift everything else builds on.
            minutes: 9
            level: beginner
            status: full
          - slug: how-a-model-api-works
            title: How a model API call works
            summary: Messages, roles, tokens, and the request/response cycle — what actually goes over the wire when your code talks to a model.
            minutes: 10
            level: beginner
            status: full
          - slug: your-first-api-call
            title: Your first API call
            summary: API keys, SDKs, and a first request in code — the smallest end-to-end example of software calling a model.
            minutes: 9
            level: beginner
            status: full
          - slug: cost-latency-and-limits
            title: Cost, latency & rate limits by design
            summary: Every call costs tokens and time — why cost, latency, and rate limits are design constraints you plan for, not afterthoughts.
            minutes: 9
            level: intermediate
            status: full

      - id: prompting-in-code
        label: "Unit 2 — Prompting in Code"
        blurb: "Turning prompts from throwaway chat messages into reliable, versioned parts of your program that produce output consistent enough to build on."
        lessons:
          - slug: prompts-as-code
            title: Prompts as code — system prompts & templates
            summary: Treating prompts as first-class, version-controlled artifacts — system vs. user roles, templating, and separating instructions from data.
            minutes: 9
            level: intermediate
            status: full
          - slug: context-and-user-input
            title: Feeding the model context & user input
            summary: Assembling the right context safely — injecting your data and user input into a prompt without letting it hijack your instructions.
            minutes: 9
            level: intermediate
            status: full
          - slug: few-shot-and-steering
            title: Few-shot examples & steering output
            summary: Showing the model what "good" looks like — examples, constraints, and the levers that make output consistent enough to rely on.
            minutes: 9
            level: intermediate
            status: full
          - slug: parsing-and-validating-output
            title: Getting usable output back
            summary: The model returns text — parsing, validating, and retrying it so your program gets data it can actually trust.
            minutes: 9
            level: intermediate
            status: full

      - id: structured-tools-streaming
        label: "Unit 3 — Structured Output, Tools & Streaming"
        blurb: "The features that turn a text generator into a programmable component: JSON output, tool and function calling, streaming, and multimodal inputs."
        lessons:
          - slug: structured-output
            title: Structured output & JSON
            summary: Getting the model to return machine-readable JSON that matches a schema — the key to wiring a model into the rest of your code.
            minutes: 10
            level: intermediate
            status: full
          - slug: tool-use-and-function-calling
            title: Tool use & function calling
            summary: Letting the model call your functions — how tool use works, and how a model that can't do math or fetch live data suddenly can.
            minutes: 11
            level: intermediate
            status: full
          - slug: streaming
            title: Streaming responses
            summary: Showing output token-by-token as it's generated — why streaming matters for user experience and how it changes your code.
            minutes: 8
            level: intermediate
            status: full
          - slug: multimodal-inputs
            title: Multimodal — images, audio & documents
            summary: Models that read more than text — sending images, audio, and documents, and the feature ideas that opens up.
            minutes: 9
            level: intermediate
            status: full

      - id: rag
        label: "Unit 4 — Retrieval-Augmented Generation (RAG)"
        blurb: "Grounding the model in your own data so it answers from your documents and facts instead of only its training — the most common way to build a genuinely useful AI feature."
        lessons:
          - slug: grounding-and-retrieval
            title: Why retrieval — grounding the model in your data
            summary: The model only knows its training data — retrieval feeds it your facts at query time, cutting hallucination and keeping answers current.
            minutes: 9
            level: intermediate
            status: full
          - slug: embeddings-and-vector-search
            title: Embeddings & vector search
            summary: Turning text into vectors so you can search by meaning, not keywords — the engine underneath retrieval.
            minutes: 10
            level: intermediate
            status: full
          - slug: building-a-rag-pipeline
            title: Building a RAG pipeline
            summary: The end-to-end shape — ingest, chunk, embed, store, retrieve, and augment the prompt — assembled into a working feature.
            minutes: 11
            level: advanced
            status: full
          - slug: chunking-and-retrieval-quality
            title: Chunking & retrieval quality
            summary: RAG lives or dies on retrieval — chunking, metadata, re-ranking, and how to tell when retrieval is the thing that's broken.
            minutes: 10
            level: advanced
            status: full
          - slug: rag-vs-long-context-vs-finetuning
            title: RAG vs. long context vs. fine-tuning
            summary: Three ways to give a model knowledge it didn't ship with — what each is for, what each costs, and how to choose.
            minutes: 10
            level: advanced
            status: full

      - id: agents-eval-safety
        label: "Unit 5 — Agents, Evaluation & Safety"
        blurb: "Letting the model act, then making sure it acts well: agent loops and tools, evaluating a probabilistic feature, handling failure, and defending against prompt injection."
        lessons:
          - slug: what-is-an-ai-agent
            title: Agents — letting the model act in a loop
            summary: From one-shot calls to a plan-act-observe loop — what an agent is, what it can do, and where the risk goes up.
            minutes: 10
            level: advanced
            status: full
          - slug: giving-agents-tools-and-mcp
            title: Giving agents tools (and MCP)
            summary: Tools are how an agent affects the world — designing safe tools and the Model Context Protocol (MCP) that standardizes them.
            minutes: 10
            level: advanced
            status: full
          - slug: evaluating-ai-features
            title: Evaluating AI features
            summary: You can't unit-test a probabilistic feature the old way — evals, test sets, LLM-as-judge, and measuring quality before and after a change.
            minutes: 11
            level: advanced
            status: full
          - slug: handling-hallucinations-and-failure
            title: Handling hallucinations & failure
            summary: The model will be confidently wrong, slow, or unavailable — grounding, guardrails, fallbacks, and failing safe when it does.
            minutes: 10
            level: intermediate
            status: full
          - slug: prompt-injection-and-security
            title: Prompt injection & data safety
            summary: Untrusted text can hijack your prompt — prompt injection, data exfiltration, the "lethal trifecta", and how to design against them.
            minutes: 11
            level: advanced
            status: full

      - id: shipping
        label: "Unit 6 — Shipping & Operating AI Features"
        blurb: "Everything applied: choose a model, control cost and latency, protect user data, watch it in production, and ship your first AI feature end to end."
        lessons:
          - slug: choosing-a-model-for-a-feature
            title: Choosing a model for a feature
            summary: Matching model to job — capability, context, speed, cost, and privacy — and why most products end up using more than one.
            minutes: 9
            level: intermediate
            status: full
          - slug: optimizing-cost-and-latency
            title: Optimizing cost & latency
            summary: Prompt caching, smaller models, batching, and streaming — the practical levers that make an AI feature affordable and fast.
            minutes: 10
            level: advanced
            status: full
          - slug: privacy-data-and-compliance
            title: Privacy, data & compliance
            summary: Where prompts and user data go, what providers do with them, and the privacy, retention, and compliance questions to settle before you ship.
            minutes: 9
            level: intermediate
            status: full
          - slug: observability-and-monitoring
            title: Observability & monitoring
            summary: You can't fix what you can't see — logging prompts and outputs, tracing, cost and latency metrics, and catching quality drift in production.
            minutes: 9
            level: advanced
            status: full
          - slug: shipping-your-first-ai-feature
            title: Shipping your first AI feature
            summary: Putting it all together — an end-to-end worked example that adds a real AI feature to a project like GopherTrunk, and how to keep improving it.
            minutes: 10
            level: intermediate
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of AI-engineering terms
      summary: Plain-language definitions for every term in the path — API, token, system prompt, structured output, tool use, embedding, RAG, agent, MCP, eval, prompt injection, and more — cross-linked to the lessons.
