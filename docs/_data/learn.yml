      a server to configure, a Raspberry Pi to set up, a build to run, a tool with
      no buttons. This path makes that window feel like home. Start with what Linux
      even is and why the command line is worth learning, then build up one small,
      safe command at a time — moving around the filesystem, managing files,
      permissions, and processes, and installing software. From there you'll learn
      the real superpower of the shell — pipes and text tools that snap together
      into custom commands — write your first scripts to automate the boring parts,
      and finish able to run and maintain your own services over SSH, including
      GopherTrunk itself on a Linux box or an SBC. No prior command-line experience
      required; examples use Linux (with notes for macOS and Windows/WSL).
