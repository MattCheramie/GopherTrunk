  - id: networking
    label: "Networking & the Internet"
    title: "Networking & the Internet — from your first packet to a service on the open web"
    tagline: "How data actually moves — packets, IP, DNS, TCP, HTTP, and TLS — plus firewalls, VPNs, the command-line tools to debug it all, and how to put your own service safely on the network."
    start_slug: what-is-a-network
    workload: "PT7H"
    intro: >
      Every program that talks to another machine — a browser, an app, a server,
      a scanner streaming audio across the house — leans on the same handful of
      networking ideas. This path demystifies them. Start with what a network even
      is and follow one web request end to end, then learn the addressing that
      makes it work — IP, DNS, and ports — and the protocols that carry it — TCP,
      UDP, HTTP, and TLS. From there you'll cover the pieces that connect and
      protect real systems (firewalls, NAT, VPNs, proxies), pick up the
      command-line tools to inspect and debug a connection, and finish able to put
      your own service on the network safely, including reaching GopherTrunk across
      your home network or the internet. No prior networking knowledge required;
      the Linux & the Command Line path pairs well for the hands-on parts.
    units:
      - id: how-it-works
        label: "Unit 1 — How Networks & the Internet Work"
        blurb: "The big picture: what a network is, how data is chopped into packets and routed, the layered model behind it, and one web request traced end to end."
        lessons:
          - slug: what-is-a-network
            title: What is a network?
            summary: Nodes, links, and the leap from a home LAN to the internet — a network of networks — the one idea everything else builds on.
            minutes: 8
            level: beginner
            status: full
          - slug: packets-and-switching
            title: Packets & switching
            summary: Why data is chopped into packets, how switches and routers pass them along, and what "best-effort" delivery really means.
            minutes: 9
            level: beginner
            status: full
          - slug: protocols-and-layers
            title: Protocols & layers
            summary: The layered model — link, internet, transport, application — and why splitting networking into layers makes the whole thing work.
            minutes: 10
            level: beginner
            status: full
          - slug: clients-and-servers
            title: Clients, servers & peers
            summary: The request-response model most of the internet runs on, and the peer-to-peer alternative — who asks and who answers.
            minutes: 8
            level: beginner
            status: full
          - slug: how-a-web-request-works
            title: How a web request works, end to end
            summary: Type a URL and press Enter — DNS, TCP, TLS, HTTP, and back — the whole journey in one trace that the rest of the path unpacks.
            minutes: 10
            level: beginner
            status: full

      - id: addressing
        label: "Unit 2 — Addressing: IP, DNS & Ports"
        blurb: "How machines find each other: IP addresses and subnets, the DNS name system, ports and sockets, and how home networks share one public address."
        lessons:
          - slug: ip-addresses
            title: IP addresses & subnets
            summary: IPv4 and IPv6, public vs. private addresses, and what a subnet (and CIDR /24) actually means — gently.
            minutes: 10
            level: intermediate
            status: full
          - slug: dns
            title: DNS — names to addresses
            summary: How a name like example.com becomes an IP address — resolvers, records (A, AAAA, CNAME, MX, TXT), and caching.
            minutes: 10
            level: beginner
            status: full
          - slug: ports-and-sockets
            title: Ports & sockets
            summary: How one machine runs many services at once — ports, well-known port numbers, and the socket that ties an address to a program.
            minutes: 9
            level: intermediate
            status: full
          - slug: nat-and-private-networks
            title: NAT & private networks
            summary: Why every device in your home shares one public IP — network address translation, private ranges, and what it hides.
            minutes: 9
            level: intermediate
            status: full
          - slug: dhcp-and-local-networks
            title: DHCP & joining a local network
            summary: How a device gets an address the moment it connects — DHCP, the default gateway, and what your router is doing.
            minutes: 8
            level: beginner
            status: full

      - id: transport-and-web
        label: "Unit 3 — The Transport & Web Protocols"
        blurb: "The protocols you'll actually build on: TCP vs. UDP, HTTP and its methods and status codes, TLS/HTTPS, web APIs, and real-time connections."
        lessons:
          - slug: tcp-and-udp
            title: TCP vs. UDP
            summary: Reliable-and-ordered vs. fast-and-lossy — the handshake, what each is for, and why voice and video often pick UDP.
            minutes: 10
            level: intermediate
            status: full
          - slug: http
            title: HTTP — the web's protocol
            summary: Requests and responses, methods (GET/POST/…), status codes, and headers — the language nearly every API and site speaks.
            minutes: 10
            level: intermediate
            status: full
          - slug: tls-and-https
            title: TLS & HTTPS
            summary: How HTTPS encrypts traffic and proves a server is who it claims — certificates, the handshake, and why the padlock matters.
            minutes: 10
            level: intermediate
            status: full
          - slug: web-apis-and-rest
            title: Web APIs & REST
            summary: Programs talking over HTTP — REST, JSON, endpoints, and how an app, a server, and a browser exchange data.
            minutes: 9
            level: intermediate
            status: full
          - slug: websockets-and-realtime
            title: WebSockets & real-time connections
            summary: When request-response isn't enough — long-lived, two-way connections for live updates, streaming, and push.
            minutes: 9
            level: advanced
            status: full

      - id: connecting-securing
        label: "Unit 4 — Connecting & Securing Networks"
        blurb: "The infrastructure that connects and protects real systems: firewalls, port forwarding, VPNs, proxies and load balancers, and the security basics."
        lessons:
          - slug: firewalls
            title: Firewalls & controlling access
            summary: Deciding what traffic is allowed — default-deny, open vs. closed ports, and where a firewall sits in the path.
            minutes: 9
            level: intermediate
            status: full
          - slug: port-forwarding-and-dynamic-dns
            title: Port forwarding & dynamic DNS
            summary: Reaching a service behind your home router from outside — port forwarding, dynamic DNS, and the risks of opening a door.
            minutes: 9
            level: intermediate
            status: full
          - slug: vpns
            title: VPNs & tunnels
            summary: What a VPN actually does — an encrypted tunnel — what it hides and what it doesn't, and when to reach for one.
            minutes: 9
            level: intermediate
            status: full
          - slug: proxies-and-load-balancers
            title: Proxies, reverse proxies & load balancers
            summary: The middlemen of the web — forward and reverse proxies, load balancers, and CDNs — and what each is for.
            minutes: 9
            level: advanced
            status: full
          - slug: network-security-basics
            title: Network security basics
            summary: The everyday threats — interception, spoofing, and floods — and the defenses that counter them, from encryption to least exposure.
            minutes: 10
            level: intermediate
            status: full

      - id: cli-tools
        label: "Unit 5 — Networking from the Command Line"
        blurb: "The tools that turn 'it won't connect' into an answer: inspecting your own network, testing connectivity, making requests, tunneling, and capturing packets."
        lessons:
          - slug: inspecting-your-network
            title: Inspecting your network
            summary: What's my address and what's listening — ip, ss, and friends for seeing your own machine's network state.
            minutes: 9
            level: intermediate
            status: full
          - slug: testing-connectivity
            title: Testing connectivity
            summary: A repeatable way to diagnose "it won't connect" — ping, traceroute, and dig, from the machine outward.
            minutes: 9
            level: intermediate
            status: full
          - slug: curl-and-http-tools
            title: Making requests with curl
            summary: curl and wget — sending HTTP requests, reading headers and status codes, and testing an API or a site from the shell.
            minutes: 9
            level: intermediate
            status: full
          - slug: ssh-tunnels-and-transfers
            title: SSH tunnels & transfers
            summary: Reaching a remote service securely — SSH port forwarding (local and remote tunnels) and copying files with scp and rsync.
            minutes: 10
            level: advanced
            status: full
          - slug: packet-capture-basics
            title: Packet capture basics
            summary: Watching the actual traffic — tcpdump and Wireshark — to see what's really on the wire when something misbehaves.
            minutes: 10
            level: advanced
            status: full

      - id: your-service
        label: "Unit 6 — Putting a Service on the Network"
        blurb: "Everything applied: run a server and understand what it's bound to, expose it safely, self-host on a home network, and reach GopherTrunk across the network."
        lessons:
          - slug: running-a-server
            title: Running a server — binding & reachability
            summary: localhost vs. 0.0.0.0, binding to a port, and the difference between a service running and a service you can actually reach.
            minutes: 9
            level: intermediate
            status: full
          - slug: exposing-a-service-safely
            title: Exposing a service safely
            summary: Putting a service online without regret — a reverse proxy, TLS, a firewall, and authentication in front of it.
            minutes: 10
            level: advanced
            status: full
          - slug: self-hosting-at-home
            title: Self-hosting on a home network
            summary: Running your own services on your own connection — the practical setup, the pitfalls, and when to keep it on the LAN.
            minutes: 9
            level: intermediate
            status: full
          - slug: gophertrunk-on-the-network
            title: GopherTrunk on the network
            summary: Putting it together — reaching GopherTrunk's web interface across your LAN or the internet, and streaming to other tools, securely.
            minutes: 9
            level: intermediate
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of networking terms
      summary: Plain-language definitions for every term in the path — packet, protocol, IP, subnet, DNS, port, NAT, TCP, UDP, HTTP, TLS, firewall, VPN, proxy, and more — cross-linked to the lessons.
      minutes: 12
      level: beginner
      status: full

  - id: cybersecurity
    label: "Cybersecurity Fundamentals"
    title: "Cybersecurity Fundamentals — from threats and crypto to defending real systems"
    tagline: "How attacks work and how to stop them — the CIA triad, cryptography, authentication, common attacks, hardening, secure coding, and the ethics of it all, including the RF-monitoring side a scanner like GopherTrunk lives in."
    start_slug: what-is-cybersecurity
    workload: "PT7H"
    intro: >
      Security isn't a bolt-on; it's a way of thinking about every system you
      build or run. This path teaches that mindset from the ground up, entirely
      from the defender's side. Start with the core goals — confidentiality,
      integrity, availability — and the vocabulary of threats, vulnerabilities,
      and risk, then build a working understanding of the cryptography that
      underpins modern security. From there you'll cover identity and access,
      the common attacks every developer should recognise (explained so you can
      defend against them, not carry them out), and the layered defenses that
      stop them — hardening systems, writing secure code, and protecting data. The
      path closes with security in practice, including personal safety online and
      the wireless-and-RF security world a scanner like GopherTrunk lives in,
      where the law and ethics matter as much as the technology. No security
      background required; the Linux and Networking paths pair well.
    units:
      - id: foundations
        label: "Unit 1 — Security Foundations"
        blurb: "The mindset and vocabulary of security: what it protects, the goals it aims for, how threats and risk are described, who attacks, and how a defender thinks."
        lessons:
          - slug: what-is-cybersecurity
            title: What is cybersecurity?
            summary: What security actually protects, why every system needs it, and the defender's job — the one idea everything else builds on.
            minutes: 8
            level: beginner
            status: full
          - slug: cia-triad
            title: The CIA triad
            summary: Confidentiality, integrity, and availability — the three goals that define what "secure" even means.
            minutes: 9
            level: beginner
            status: full
          - slug: threats-vulnerabilities-risk
            title: Threats, vulnerabilities & risk
            summary: The words security people actually use — threat, vulnerability, exploit, risk, and attack surface — and how they fit together.
            minutes: 9
            level: beginner
            status: full
          - slug: threat-actors
            title: Who attacks, and why
            summary: From opportunists and criminals to insiders and nation-states — the actors, their motives, and what that means for your defenses.
            minutes: 8
            level: beginner
            status: full
          - slug: security-mindset
            title: The security mindset
            summary: Thinking like an attacker to defend like a pro — assume breach, least privilege, and defense in depth as habits, not slogans.
            minutes: 9
            level: intermediate
            status: full

      - id: crypto
        label: "Unit 2 — Cryptography Essentials"
        blurb: "The math-free version of the cryptography that underpins everything secure: encryption, keys, hashing, signatures, and where each shows up in real life."
        lessons:
          - slug: what-is-cryptography
            title: What is cryptography?
            summary: Plaintext, ciphertext, and keys — what encryption does, what it doesn't, and why you never roll your own.
            minutes: 9
            level: beginner
            status: full
          - slug: symmetric-and-asymmetric
            title: Symmetric & public-key encryption
            summary: One shared secret versus a public/private key pair — the two families of encryption and what each is good for.
            minutes: 10
            level: intermediate
            status: full
          - slug: hashing-and-integrity
            title: Hashing & integrity
            summary: One-way hashes, checksums, and how they detect tampering and store passwords safely — and why hashing isn't encryption.
            minutes: 9
            level: intermediate
            status: full
          - slug: signatures-and-certificates
            title: Digital signatures & certificates
            summary: Proving who sent something and that it wasn't changed — signatures, public-key infrastructure, and the certificates behind HTTPS.
            minutes: 10
            level: intermediate
            status: full
          - slug: crypto-in-practice
            title: Cryptography in practice
            summary: Where the theory shows up — TLS, SSH, disk and end-to-end encryption — and how the encryption on a radio system fits the same ideas.
            minutes: 9
            level: intermediate
            status: full

      - id: identity-access
        label: "Unit 3 — Identity, Authentication & Access"
        blurb: "Proving who you are and controlling what you can do: authentication, passwords and MFA, authorization, managing secrets, and the human layer attackers love."
        lessons:
          - slug: authentication-basics
            title: Authentication basics
            summary: The three factors — something you know, have, and are — and how a system decides you are who you claim to be.
            minutes: 8
            level: beginner
            status: full
          - slug: passwords-and-mfa
            title: Passwords, MFA & passkeys
            summary: Why passwords fail, how they should be stored, and how multi-factor authentication and passkeys close the gap.
            minutes: 9
            level: beginner
            status: full
          - slug: authorization-and-access
            title: Authorization & access control
            summary: The difference between who you are and what you're allowed to do — least privilege, roles, and access models.
            minutes: 9
            level: intermediate
            status: full
          - slug: secrets-management
            title: Managing secrets & keys
            summary: API keys, tokens, and passwords in software — keeping them out of code, rotating them, and using a secrets manager.
            minutes: 9
            level: intermediate
            status: full
          - slug: social-engineering
            title: Social engineering & the human layer
            summary: Phishing, pretexting, and why the easiest way past strong technology is often a person — and how to defend against it.
            minutes: 9
            level: beginner
            status: full

      - id: attacks-defenses
        label: "Unit 4 — Attacks & Defenses"
        blurb: "The attacks every developer should recognise — explained so you can defend against them — and the layered defenses that stop them."
        lessons:
          - slug: common-attacks
            title: Common attacks, in plain terms
            summary: A field guide to the attacks you'll hear about — malware, phishing, credential attacks, and denial of service — and what each targets.
            minutes: 9
            level: beginner
            status: full
          - slug: web-application-attacks
            title: Web application attacks
            summary: How injection, cross-site scripting, and CSRF work at a high level, why they happen, and the coding habits that prevent them.
            minutes: 10
            level: advanced
            status: full
          - slug: network-attacks
            title: Network attacks
            summary: Interception, spoofing, and floods — the network-layer attacks from the networking path, seen through a defender's eyes.
