            minutes: 8
            level: beginner
            status: full
          - slug: the-shell
            title: The shell explained
            summary: What the shell actually is, the prompt, and the command-arguments-options pattern behind everything you'll type.
            minutes: 9
            level: beginner
            status: full
          - slug: getting-a-shell
            title: Getting a shell
            summary: Opening a terminal on Linux, macOS, and Windows (WSL), plus reaching one on a server or a Raspberry Pi.
            minutes: 8
            level: beginner
            status: full
          - slug: first-commands
