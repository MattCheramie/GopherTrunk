            minutes: 10
            level: advanced
            status: full
          - slug: scheduling-with-cron
            title: Scheduling with cron & timers
            summary: Running a job every night or every minute — cron syntax, systemd timers, and where scheduled output goes.
            minutes: 9
            level: intermediate
            status: full

      - id: living-on-linux
        label: "Unit 6 — Living on Linux: Servers, SBCs & GopherTrunk"
        blurb: "Everything applied: reach a machine over SSH, run software as a managed service, watch its health, and put GopherTrunk on a Linux box."
