            level: advanced
            status: full
          - slug: privacy-data-and-compliance
            title: Privacy, data & compliance
            summary: Where prompts and user data go, what providers do with them, and the privacy, retention, and compliance questions to settle before you ship.
            minutes: 9
            level: intermediate
            status: full
          - slug: observability-and-monitoring
            title: Observability & monitoring
            summary: You can't fix what you can't see — logging prompts and outputs, tracing, cost and latency metrics, and catching quality drift in production.
            minutes: 9
            level: advanced
            status: full
          - slug: shipping-your-first-ai-feature
            title: Shipping your first AI feature
            summary: Putting it all together — an end-to-end worked example that adds a real AI feature to a project like GopherTrunk, and how to keep improving it.
            minutes: 10
            level: intermediate
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of AI-engineering terms
