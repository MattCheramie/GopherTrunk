# GopherTrunk learning content — single source of truth.
#
# This file drives several things at once, so they never drift apart:
#   1. The /learn/ chooser page          (docs/learn/index.md + learn-index.html)
#   2. Each Learning Path guide page      (docs/learn/paths/<id>/index.md + learn-path.html)
#   3. Each module's hub landing grid     (docs/learn/<id>/index.md + learn-hub.html)
#   4. The in-lesson unit list and prev/next nav (lesson.html)
#   5. The llms.txt export                (docs/llms.txt)
#
# Four-level hierarchy:
#
#   Learning Path   optional, guidance-only domain track (RF Software Development,
#                   RF Hardware, …). A curated, ordered *reading list of modules*
#                   toward competence in a domain. NOT required to take any module.
#     Learning Module   one self-contained curriculum (RF & SDR, Git & GitHub, …)
#                       with its own URL space /learn/<id>/.
#       Unit            an ordered group of lessons inside a module (display only;
#                       does not appear in URLs).
#         Lesson        one page at /learn/<module-id>/<slug>/.
#
# Two top-level lists: `learning_paths:` (the guidance layer) and `modules:` (the
# curricula). Learning Paths reference modules by id, so a module can appear in
# several paths. Progress is saved per (module-id, lesson-slug) — see store.js and
# the Supabase learn_progress table — so every `id` below is APPEND-ONLY: renaming
# one breaks lesson URLs and orphans saved progress. Path progress is derived from
# the referenced modules' completions; it needs no storage of its own.
#
# Per learning_path (guidance only):
#   id          URL segment -> /learn/paths/<id>/  (append-only)
#   label       Short display name shown on the chooser and path card
#   title       Full guide <h1> / page title
#   tagline     One-line description for the chooser card
#   intro       Folded blurb shown on the guide hero
#   modules     Ordered list of module references: { id, note? }
#                 id    an existing module id (see `modules:` below)
#                 note  optional one-line "why this module / what you'll get"
#
# Per module (was "path"):
#   id          URL segment -> /learn/<id>/ and /learn/<id>/<slug>/  (append-only)
#   label       Short display name shown on the chooser and in breadcrumbs
#   title       Full hub <h1> / page title
#   tagline     One-line description for the chooser card
#   start_slug  Slug of lesson 1 (drives the hub "Start lesson 1" CTA)
#   workload    ISO-8601 duration estimate for Course schema (e.g. PT6H)
#   intro       Folded blurb shown on the hub hero
#   units       Ordered list of units (see below)
#   glossary    Optional standalone reference (no prev/next slot); keep slug: glossary
#
# Per unit (was "module"):
#   id          Anchor id used on the hub (/learn/<module>/#<id>)
#   label       Unit heading (e.g. "Unit 1 — Foundations")
#   blurb       One-line unit summary
#   lessons     Ordered list of lessons
#
# Per lesson:
#   slug        URL slug -> /learn/<module>/<slug>/  (append-only; renaming breaks links)
#   title       Lesson title (also the card heading)
#   summary     One-line description for cards, sidebar, and llms.txt
#   minutes     Estimated reading time (integer; shown on cards)
#   level       beginner | intermediate | advanced  (badge + filtering)
#   status      full | stub   (stub = outline published, body still being written)
#
# Lesson files live at docs/learn/<module-id>/<slug>.md. The matching `learn`
# defaults scopes in _config.yml give them the lesson layout, nav_group, and the
# `learn_module` key automatically, so individual lessons only declare slug/title/
# description. Each hub overrides layout back to `learn-hub`; the chooser
# (learn/index.md) overrides to `learn-index`.

# ---------------------------------------------------------------------------
# Learning Paths — optional guidance. Each is an ordered recommendation of which
# modules to work through to become competent in a broad domain. No module here
# is required; a path only points the way.
# ---------------------------------------------------------------------------
learning_paths:
  - id: rf-software-dev
    label: "RF Software Development"
    title: "Learning Path — RF Software Development"
    tagline: "Write the software that turns raw radio into decoded data — the GopherTrunk skill set."
    intro: >
      Guidance only — nothing here is required. Work these modules in order to
      build real competence developing SDR/RF software: understand the signal,
      learn to build and ship software, then bring the two together to decode
      digital trunked voice like GopherTrunk does.
    modules:
      - id: rf-sdr
        note: "Start here — the RF and SDR fundamentals every signal path leans on."
      - id: dsp
        note: "How those signals become code — filters, FFTs, mixing, and clock recovery."
      - id: intro-software-dev
        note: "How software is designed, built, tested, and shipped."
      - id: programming-go
        note: "Learn Go, the language GopherTrunk itself is written in."
      - id: linux-cli
        note: "The command line where SDR tooling and servers live."
      - id: git
        note: "Version control — the backbone of any real codebase."
      - id: digital-trunking
        note: "Apply it: how trunked systems work and how software follows them."
      - id: scanning
        note: "Operate it — find, follow, and monitor real systems with your decoder."
      - id: deployment
        note: "Ship it — package and run your decoder as a real service."
      - id: ai-software-dev
        note: "Optional — use AI tools to accelerate your development workflow."
  - id: rf-hardware
    label: "RF Hardware"
    title: "Learning Path — RF Hardware"
    tagline: "Understand the radios, antennas, and front-ends that put signals in front of your software."
    intro: >
      Guidance only. For the hardware side of RF: what a signal is, the physical
      devices that capture and move it, and how RF links are engineered.
    modules:
      - id: rf-sdr
        note: "The physics of signals — waves, power, antennas, propagation."
      - id: dsp
        note: "The signal processing that turns captured samples into usable data."
      - id: intro-hardware
        note: "Computers and devices from the ground up, including SDR front-ends."
      - id: embedded
        note: "The small computers that run RF gear in the field — SBCs, GPIO, and 24/7 builds."
      - id: networking
        note: "How RF ultimately carries data across links and networks."
  - id: software-engineering
    label: "Software Engineering Foundations"
    title: "Learning Path — Software Engineering Foundations"
    tagline: "Become a well-rounded developer, from first program to shipping and licensing."
    intro: >
      Guidance only. A broad grounding in building software: the craft, the tools,
      the systems it runs on, and the rules for releasing it.
    modules:
      - id: intro-software-dev
        note: "The craft of building software."
      - id: programming-go
        note: "A real language, end to end — Go, from first program to concurrency."
      - id: testing
        note: "Keep it correct — unit tests, regression discipline, CI, and debugging."
      - id: git
        note: "Version control and collaboration."
      - id: linux-cli
        note: "The command line every developer lives in."
      - id: networking
        note: "How software talks across machines."
      - id: databases
        note: "Where your application's data lives — SQL, NoSQL, and vector stores."
      - id: web-dev
        note: "The web layer most software meets its users through."
      - id: apis
        note: "How your software talks to other software — REST, real-time events, and gRPC."
      - id: deployment
        note: "Containers, CI/CD, and getting your software running in production."
      - id: software-licensing
        note: "The legal side of shipping and reusing code."
  - id: ai-development
    label: "AI Software Development"
    title: "Learning Path — AI Software Development"
    tagline: "Build software with — and powered by — modern AI."
    intro: >
      Guidance only. From general software skills to building AI-assisted and
      AI-powered applications.
    modules:
      - id: intro-software-dev
        note: "The software foundations AI work builds on."
      - id: programming-go
        note: "A concrete language to build in — Go, from basics to concurrency."
      - id: git
        note: "Version control for any real project."
      - id: databases
        note: "Store your data — including the vector search that powers RAG features."
      - id: web-dev
        note: "Deliver AI features to users through a web app."
      - id: ai-software-dev
        note: "Use AI tools to write and ship software faster."
      - id: building-ai
        note: "Build applications powered by AI."
      - id: deployment
        note: "Ship your AI feature — containers, config, and CI/CD."
  - id: security
    label: "Cybersecurity"
    title: "Learning Path — Cybersecurity"
    tagline: "Understand systems well enough to defend them."
    intro: >
      Guidance only. The systems knowledge that security rests on, then the
      security discipline itself.
    modules:
      - id: linux-cli
        note: "The environment most security work happens in."
      - id: networking
        note: "You can't secure what you don't understand — start with the network."
      - id: cybersecurity
        note: "Threats, defenses, and the security mindset."
      - id: deployment
        note: "Where software actually runs — containers, secrets, and hardening the deploy."
      - id: git
        note: "Track changes and collaborate safely."
  - id: trunked-radio
    label: "Digital Trunking & Scanning"
    title: "Learning Path — Digital Trunking & Scanning"
    tagline: "Go from first radio wave to following live trunked voice systems."
    intro: >
      Guidance only. The fastest route to understanding and operating digital
      trunked radio the way GopherTrunk decodes it.
    modules:
      - id: rf-sdr
        note: "Signals, SDR, and how digital voice is carried."
      - id: dsp
        note: "The signal processing that recovers bits from a noisy channel."
      - id: digital-trunking
        note: "How trunked control channels and voice calls work."
      - id: scanning
        note: "Apply it — build a station and follow live systems in the field."
      - id: intro-hardware
        note: "The SDR hardware that feeds a scanner."
      - id: embedded
        note: "Turn it into an appliance — a single-board computer that scans 24/7."

# ---------------------------------------------------------------------------
# Learning Modules — the self-contained curricula. Each owns /learn/<id>/.
# ---------------------------------------------------------------------------
modules:
  - id: rf-sdr
    label: "RF & SDR"
    title: "Learn RF & SDR — from newbie to expert"
    tagline: "Radio and software-defined-radio fundamentals — from your first wave to decoding digital trunked voice."
    start_slug: radio-waves
    workload: "PT6H"
    intro: >
      A guided path from complete newcomer to confident GopherTrunk operator. Start
      with what a radio wave actually is, learn how software-defined radios turn the
      airwaves into numbers, then follow the signal all the way to decoded digital
      voice — and put it to work in GopherTrunk.
    units:
      - id: rf-fundamentals
        label: "Unit 1 — RF Fundamentals"
        blurb: "The physics every operator leans on: waves, frequency, power, antennas, and how signals travel."
        lessons:
          - slug: radio-waves
            title: What is a radio wave?
            summary: Frequency, wavelength, amplitude, and the electromagnetic spectrum — the one idea everything else builds on.
            minutes: 9
            level: beginner
            status: full
          - slug: frequency-and-spectrum
            title: Frequency, bands & the spectrum
            summary: Hz to GHz, the HF/VHF/UHF bands, and how spectrum is carved up into band plans.
            minutes: 8
            level: beginner
            status: full
          - slug: decibels
            title: Decibels & signal power
            summary: dB, dBm, and dBFS demystified — gain, path loss, the noise floor, and why radio lives in logarithms.
            minutes: 10
            level: beginner
            status: full
          - slug: noise-and-snr
            title: Noise, SNR & sensitivity
            summary: The noise floor, signal-to-noise ratio, and receiver sensitivity — why SNR, not raw signal strength, decides whether a signal decodes.
            minutes: 9
            level: intermediate
            status: full
          - slug: antennas
            title: Antennas 101
            summary: Resonance, polarization, gain, SWR, and the connectors that join your antenna to your SDR.
            minutes: 9
            level: beginner
            status: full
          - slug: propagation
            title: How signals travel
            summary: Line of sight, multipath, fading, and why where you put the antenna matters more than the radio.
            minutes: 8
            level: beginner
            status: full

      - id: signals-modulation
        label: "Unit 2 — Signals & Modulation"
        blurb: How information rides on a carrier — from analog AM/FM to the digital constellations GopherTrunk decodes.
        lessons:
          - slug: signal-anatomy
            title: Anatomy of a signal
            summary: Carrier, bandwidth, and the difference between a spectrum view and a waterfall.
            minutes: 7
            level: beginner
            status: full
          - slug: analog-modulation
            title: Analog modulation — AM, FM, SSB
            summary: The three classic ways to put a voice on a carrier, and where you still hear them today.
            minutes: 8
            level: beginner
            status: full
          - slug: digital-modulation
            title: Digital modulation & constellations
            summary: FSK, PSK, QAM, and C4FM — how bits become symbols, and how to read a constellation and eye diagram.
            minutes: 12
            level: intermediate
            status: full
          - slug: symbols-and-baud
            title: Symbols, baud & bitrate
            summary: Why a 4800-baud C4FM signal carries 9600 bits per second, and what that means for capture.
            minutes: 7
            level: intermediate
            status: full

      - id: sdr
        label: "Unit 3 — Software-Defined Radio"
        blurb: What an SDR actually is, how it samples the air into IQ data, and how to set it up without overloading it.
        lessons:
          - slug: what-is-sdr
            title: What is software-defined radio?
            summary: The core idea — move the radio into software — and why one cheap dongle can decode dozens of systems.
            minutes: 9
            level: beginner
            status: full
          - slug: sdr-receiver
            title: How an SDR receiver works
            summary: Antenna to tuner to ADC — the signal chain that turns radio waves into a stream of samples.
            minutes: 9
            level: intermediate
            status: full
          - slug: iq-data
            title: IQ data & complex signals
            summary: Why SDRs output pairs of numbers, what "I" and "Q" mean, and how they capture both amplitude and phase.
            minutes: 9
            level: intermediate
            status: full
          - slug: sample-rate-nyquist
            title: Sample rate, bandwidth & Nyquist
            summary: How much spectrum you can see at once, the Nyquist limit, and the bandwidth/CPU trade-off.
            minutes: 8
            level: intermediate
            status: full
          - slug: gain-and-agc
            title: Gain, AGC & avoiding overload
            summary: Set gain too low and you lose weak signals; too high and you drown in distortion. Finding the sweet spot.
            minutes: 8
            level: intermediate
            status: full
          - slug: front-end-and-overload
            title: Front-end filters, LNAs & overload
            summary: Preselector filters, low-noise amplifiers, and how out-of-band signals overload the front end — the intermod and reciprocal-mixing traps behind a noisy decode.
            minutes: 10
            level: advanced
            status: full
          - slug: sdr-hardware
            title: SDR hardware — RTL-SDR, HackRF, Airspy
            summary: Picking a dongle for the job and how each one maps to GopherTrunk's supported hardware.
            minutes: 9
            level: beginner
            status: full

      - id: dsp
        label: "Unit 4 — DSP Essentials"
        blurb: The digital signal processing that lives between IQ samples and decoded bits — explained without the heavy math.
        lessons:
          - slug: fft-and-waterfall
            title: The FFT & reading a waterfall
            summary: How the Fourier transform turns samples into a spectrum, and how to read GopherTrunk's waterfall.
            minutes: 9
            level: intermediate
            status: full
          - slug: filtering-decimation
            title: Filtering & decimation
            summary: Zooming in on one channel, throwing away the rest, and keeping the CPU happy.
            minutes: 8
            level: intermediate
            status: full
          - slug: demodulation-pipeline
            title: The demodulation pipeline
            summary: "The stages every signal passes through: tune, filter, demodulate, recover symbols, decode."
            minutes: 9
            level: advanced
            status: full
          - slug: clock-recovery
            title: Clock recovery & symbol timing
            summary: How a receiver finds the beat of a digital signal so it samples each symbol at the right instant.
            minutes: 8
            level: advanced
            status: full

      - id: digital-voice-trunking
        label: "Unit 5 — Digital Voice & Trunked Radio"
        blurb: From vocoded voice to control channels — the systems GopherTrunk was built to follow.
        lessons:
          - slug: digital-voice
            title: Analog vs. digital voice
            summary: Why public-safety radio went digital, and what a vocoder gives up to fit a voice in a few kbps.
            minutes: 8
            level: intermediate
            status: full
          - slug: vocoders
            title: Vocoders — IMBE & AMBE+2
            summary: The speech codecs behind P25 and DMR, and how GopherTrunk turns their frames back into audio.
            minutes: 8
            level: advanced
            status: full
          - slug: what-is-trunking
            title: What is trunked radio?
            summary: Control channels, voice channels, and affiliation — how a fleet shares a handful of frequencies.
            minutes: 11
            level: intermediate
            status: full
          - slug: protocol-landscape
            title: The digital protocol landscape
            summary: P25, DMR, NXDN, TETRA, Motorola, EDACS, and friends — who uses what, and how to tell them apart.
            minutes: 10
            level: intermediate
            status: full
          - slug: encryption
            title: Encryption & what you can decode
            summary: Why some talkgroups are silent, what GopherTrunk can and can't do, and how to spot encryption.
            minutes: 7
            level: intermediate
            status: full
          - slug: other-signals
            title: Other signals you'll meet
            summary: Paging, AIS, ADS-B, and APRS — the non-trunked signals GopherTrunk can also decode.
            minutes: 8
            level: beginner
            status: full

      - id: gophertrunk
        label: "Unit 6 — Putting It Together with GopherTrunk"
        blurb: "Everything you've learned, applied: from a bare antenna to decoded calls, and how to fix it when it won't lock."
        lessons:
          - slug: antenna-to-audio
            title: From antenna to audio
            summary: The complete GopherTrunk signal path, tracing one call from RF in the air to a WAV on disk.
            minutes: 11
            level: intermediate
            status: full
          - slug: finding-systems
            title: Finding & identifying systems
            summary: Using Hunt and online databases to discover what's on the air near you and add it to GopherTrunk.
            minutes: 9
            level: intermediate
            status: full
          - slug: tuning-with-scopes
            title: Tuning for a clean lock
            summary: Reading the constellation, eye diagram, and symbol scope to dial in a marginal signal.
            minutes: 9
            level: advanced
            status: full
          - slug: calibration-troubleshooting
            title: Calibration & troubleshooting
            summary: PPM and voice calibration, plus a checklist for the usual reasons a control channel won't decode.
            minutes: 9
            level: advanced
            status: full
          - slug: legal-ethical
            title: Legal & ethical monitoring
            summary: Knowing what's legal to receive where you live, and the etiquette of the scanner hobby.
            minutes: 6
            level: beginner
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of RF & SDR terms
      summary: Plain-language definitions for every term in the learning path, cross-linked to the lessons.
      minutes: 12
      level: beginner
      status: full

  - id: git
    label: "Git & GitHub"
    title: "Learn Git & GitHub — from first commit to advanced workflows"
    tagline: "Version control from the ground up — branching, collaboration, and the GitHub features teams rely on every day."
    start_slug: what-is-version-control
    workload: "PT5H"
    intro: >
      A guided path from your very first commit to the advanced Git and GitHub
      workflows professional teams use. Start with what version control actually
      is, build a rock-solid mental model of how Git stores your work, then learn
      branching, collaboration on GitHub, and the power tools — rebase, bisect,
      Actions — that separate confident users from the rest.
    units:
      - id: git-foundations
        label: "Unit 1 — Version Control Foundations"
        blurb: "Why version control exists, how Git thinks, and the core loop — edit, stage, commit — you'll use every day."
        lessons:
          - slug: what-is-version-control
            title: Why version control?
            summary: What a version control system is, the problems it solves, and why Git won — the one idea everything else builds on.
            minutes: 8
            level: beginner
            status: full
          - slug: installing-git
            title: Installing & configuring Git
            summary: Getting Git on Linux, macOS, and Windows, then setting your name, email, editor, and a few sane defaults.
            minutes: 7
            level: beginner
            status: full
          - slug: git-mental-model
            title: "How Git thinks: snapshots, not diffs"
            summary: Commits, trees, blobs, and the SHA — the object model that makes Git fast, safe, and a little magic.
            minutes: 10
            level: beginner
            status: full
          - slug: first-repository
            title: Your first repository
            summary: init vs. clone, the working tree, and what actually lives inside the .git directory.
            minutes: 8
            level: beginner
            status: full
          - slug: staging-and-commits
            title: The staging area & commits
            summary: add, the index, and commit — how to compose a clean, deliberate snapshot instead of dumping everything.
            minutes: 9
            level: beginner
            status: full

      - id: everyday-git
        label: "Unit 2 — Everyday Git"
        blurb: The handful of commands you'll run dozens of times a day — reading state, history, and safely undoing mistakes.
        lessons:
          - slug: status-and-diffs
            title: Reading status & diffs
            summary: status, diff, and diff --staged — knowing exactly what has changed and what's about to be committed.
            minutes: 8
            level: beginner
            status: full
          - slug: viewing-history
            title: Viewing history with log & show
            summary: log, show, and blame — navigating the past, formatting output, and finding who changed what and why.
            minutes: 8
            level: beginner
            status: full
          - slug: gitignore
            title: .gitignore & tracking the right files
            summary: Keeping secrets, build artifacts, and noise out of your repo — patterns, precedence, and global ignores.
            minutes: 7
            level: beginner
            status: full
          - slug: undoing-changes
            title: "Undoing changes: restore, reset & revert"
            summary: The three ways to go back — and how to tell which one you need without losing work or rewriting shared history.
            minutes: 10
            level: intermediate
            status: full

      - id: branching-merging
        label: "Unit 3 — Branching & Merging"
        blurb: Git's superpower — cheap branches — and how to bring lines of work back together cleanly.
        lessons:
          - slug: branches
            title: Branches explained
            summary: What a branch really is (a movable pointer), creating and switching them, and HEAD demystified.
            minutes: 9
            level: intermediate
            status: full
          - slug: merging
            title: Merging & fast-forwards
            summary: Fast-forward vs. three-way merges, merge commits, and when each one happens.
            minutes: 8
            level: intermediate
            status: full
          - slug: merge-conflicts
            title: Resolving merge conflicts
            summary: Why conflicts happen, how to read the markers, and a calm, repeatable process for resolving them.
            minutes: 9
            level: intermediate
            status: full
          - slug: rebasing
            title: Rebasing & a linear history
            summary: Replaying commits onto a new base for a clean history — and the golden rule of never rebasing shared work.
            minutes: 10
            level: advanced
            status: full
          - slug: stashing
            title: Stashing work in progress
            summary: Parking uncommitted changes to switch context fast, then bringing them back without losing anything.
            minutes: 6
            level: intermediate
            status: full

      - id: remotes-github
        label: "Unit 4 — Remotes & GitHub"
        blurb: Taking Git online — pushing to GitHub, authenticating securely, and the fork-and-pull-request workflow.
        lessons:
          - slug: what-is-github
            title: What is GitHub?
            summary: GitHub vs. Git, what a remote-hosting platform adds, and the alternatives (GitLab, Bitbucket, Codeberg).
            minutes: 8
            level: beginner
            status: full
          - slug: remotes
            title: "Remotes: clone, fetch, pull & push"
            summary: origin, tracking branches, and the difference between fetch, pull, and push — the sync model in full.
            minutes: 9
            level: intermediate
            status: full
          - slug: authentication
            title: "Authentication: SSH keys & tokens"
            summary: Why HTTPS passwords are gone — setting up SSH keys or a personal access token so pushes just work.
            minutes: 9
            level: intermediate
            status: full
          - slug: forking
            title: Forking & the fork workflow
            summary: Forks vs. clones, keeping a fork in sync with upstream, and how open-source contribution actually flows.
            minutes: 8
            level: intermediate
            status: full
          - slug: pull-requests
            title: Pull requests & code review
            summary: Opening a PR, writing a good description, requesting review, and turning feedback into merged code.
            minutes: 10
            level: intermediate
            status: full

      - id: github-features
        label: "Unit 5 — Collaboration & GitHub Features"
        blurb: The platform features that turn a code host into a place teams plan, automate, ship, and protect their work.
        lessons:
          - slug: issues-and-projects
            title: Issues, labels & Projects
            summary: Tracking work with issues, organizing it with labels and milestones, and planning on Projects boards.
            minutes: 9
            level: beginner
            status: full
          - slug: github-actions
            title: CI/CD with GitHub Actions
            summary: Workflows, jobs, and steps — automating tests, builds, and deploys that run on every push and PR.
            minutes: 11
            level: advanced
            status: full
          - slug: releases-and-tags
            title: Tags, releases & semantic versioning
            summary: Marking versions with tags, publishing Releases with notes and binaries, and what SemVer numbers mean.
            minutes: 9
            level: intermediate
            status: full
          - slug: github-pages-and-more
            title: Pages, Gists, Discussions & wikis
            summary: The extras worth knowing — free static hosting, shareable snippets, community Q&A, and project wikis.
            minutes: 8
            level: beginner
            status: full
          - slug: branch-protection
            title: Branch protection, reviews & CODEOWNERS
            summary: Required reviews, status checks, and CODEOWNERS — the guardrails that keep a shared main branch healthy.
            minutes: 8
            level: advanced
            status: full
          - slug: cli-lfs-and-security
            title: The GitHub CLI, Git LFS & repo security
            summary: Three power features worth knowing — the gh command-line tool, Git LFS for large files, and GitHub's security features (Dependabot, secret scanning, advisories).
            minutes: 9
            level: intermediate
            status: full

      - id: advanced-git
        label: "Unit 6 — Advanced Git & Best Practices"
        blurb: The power tools and habits that mark a confident operator — history surgery, debugging, and clean workflows.
        lessons:
          - slug: interactive-rebase
            title: Rewriting history with interactive rebase
