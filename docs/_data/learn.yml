  - id: software-licensing
    label: "Software Licensing"
    title: "Software Licensing & Agreements — from open source to selling your own"
    tagline: "Every software license from open source to proprietary, using open source in what you sell, how to read any agreement, and choosing the right license and user agreements for your own software."
    start_slug: what-is-a-software-license
    workload: "PT7H"
    intro: >
      Licensing is where software meets the law, and it decides what you and your
      users are actually allowed to do with code. This path is a plain-language,
      end-to-end tour — start with what a license is and how copyright makes
      software ownable, then work through every open-source license in detail
      (MIT, BSD, Apache, the GPL family, the weak-copyleft licenses, and public
      domain) with the real strengths, weaknesses, and trade-offs of each. From
      there you'll learn to choose and combine open-source licenses, how
      proprietary and commercial licensing works, how to write a custom license
      to sell software, and how to use open-source libraries inside a product you
      sell without breaking the rules. The back half teaches you to read any
      software agreement and understand it before you sign, covers the other
      agreements software needs — EULAs, terms of service, privacy policies,
      DPAs, SLAs, and NDAs — and ends by walking you through choosing the right
      license and the right set of agreements for your own software. Concepts are
      taught with US law as the reference point and the major differences in other
      jurisdictions flagged throughout, so you get the complete picture. This is
      educational material, not legal advice. No legal background required;
      examples lean on real software, including GopherTrunk's own Apache-2.0
      license and dependency notices.
    units:
      - id: foundations
        label: "Unit 1 — Licensing & IP Foundations"
        blurb: "What a software license actually is, how copyright and other IP make code ownable, license versus contract, the full spectrum of license types, and how the law differs around the world."
        lessons:
          - slug: what-is-a-software-license
            title: What is a software license?
            summary: A license is permission to use code you don't own — why software defaults to "all rights reserved", what a license grants, and why every project needs one.
            minutes: 9
            level: beginner
            status: full
          - slug: copyright-and-software-ownership
            title: Copyright & software ownership
            summary: How copyright attaches to code automatically, what it does and doesn't protect, and who actually owns software written by employees, contractors, and you.
            minutes: 10
            level: beginner
            status: full
          - slug: other-ip-in-software
            title: Patents, trademarks & trade secrets
            summary: Copyright isn't the only IP in software — how patents, trademarks, and trade secrets each touch your code, your name, and your competitive edge.
            minutes: 10
            level: beginner
            status: full
          - slug: license-vs-contract
            title: License vs contract
            summary: A license grants permission; a contract is a deal with obligations on both sides — why the difference matters, and how click-wrap and browse-wrap agreements bind users.
            minutes: 9
            level: intermediate
            status: full
          - slug: the-licensing-spectrum
            title: The licensing spectrum
            summary: From locked-down proprietary to source-available to open source to public domain — the full map of how software can be licensed, and where each model fits.
            minutes: 9
            level: beginner
            status: full
          - slug: licensing-across-jurisdictions
            title: Licensing across jurisdictions
            summary: US copyright is the reference point, but moral rights, enforceability, warranty disclaimers, and data law differ worldwide — the complete cross-border picture.
            minutes: 11
            level: intermediate
            status: full

      - id: open-source-in-depth
        label: "Unit 2 — Open Source Licenses in Depth"
        blurb: "What 'open source' really means, the permissive-versus-copyleft divide, and a detailed look at every common license — MIT, BSD, Apache, GPL, AGPL, the weak-copyleft licenses, and public domain — with the real strengths and weaknesses of each."
        lessons:
          - slug: what-is-open-source
            title: What open source really means
            summary: The OSI Open Source Definition, the FSF's four freedoms, "free vs open", and why source-available is not the same as open source.
            minutes: 10
            level: beginner
            status: full
          - slug: permissive-vs-copyleft
            title: Permissive vs copyleft
            summary: The single divide that organizes every open-source license — do nothing back, or share alike — and what "copyleft" really obligates.
            minutes: 9
            level: beginner
            status: full
          - slug: mit-and-bsd-licenses
            title: "MIT & BSD: minimal permissive"
            summary: The short, do-almost-anything licenses behind most of the ecosystem — what MIT and the BSD variants say, where they shine, and their few real weaknesses.
            minutes: 9
            level: beginner
            status: full
          - slug: apache-license
            title: "Apache 2.0: permissive with a patent grant"
            summary: Permissive freedom plus an explicit patent grant and NOTICE requirement — why Apache 2.0 is the corporate default, and why GopherTrunk uses it.
            minutes: 10
            level: intermediate
            status: full
          - slug: gpl-strong-copyleft
            title: "The GPL: strong copyleft"
            summary: The license that started copyleft — what triggers GPLv2/v3 obligations, the source-code requirement, and the strengths and costs of "share alike".
            minutes: 11
            level: intermediate
            status: full
          - slug: agpl-network-copyleft
            title: "The AGPL: copyleft over the network"
            summary: How the AGPL closes the SaaS "loophole" by triggering on network use, why it protects user freedom, and why so many companies ban it outright.
            minutes: 9
            level: intermediate
            status: full
          - slug: weak-copyleft-licenses
            title: "Weak copyleft: LGPL, MPL, EPL"
            summary: The middle ground — file- and library-level copyleft that lets you link from proprietary code while keeping the open parts open; strengths and traps of each.
            minutes: 10
            level: intermediate
            status: full
          - slug: public-domain-and-cc0
            title: Public domain, Unlicense & CC0
            summary: Giving up all rights — public-domain dedications, the Unlicense, CC0, and 0BSD — plus why "no license at all" is a trap, not a gift.
            minutes: 8
            level: beginner
            status: full

      - id: choosing-and-combining
        label: "Unit 3 — Choosing & Combining Open Source"
        blurb: "Putting the licenses to work: how they combine and where they conflict, how to pick one for your own project, contributor agreements, dual licensing, and the long-term risks of depending on open source."
        lessons:
          - slug: license-compatibility
            title: License compatibility
            summary: When code under different licenses can legally be combined, why GPL compatibility runs one way, and a mental model for the compatibility matrix.
            minutes: 10
            level: intermediate
            status: full
          - slug: choosing-an-oss-license
            title: Choosing an open-source license
            summary: Turning strengths and weaknesses into a decision — match your goals to a license, and the tools (choosealicense.com and friends) that help.
            minutes: 9
            level: intermediate
            status: full
          - slug: contributor-agreements
            title: "Contributor agreements: CLAs & DCO"
            summary: How projects take in outside contributions cleanly — CLAs, the DCO, and "inbound=outbound" — and what every contributor should understand before signing.
            minutes: 9
            level: intermediate
            status: full
          - slug: dual-licensing-and-relicensing
            title: Dual licensing & relicensing
            summary: Offering the same code as both open source and a paid license, what makes it possible (owning the copyright), and the constraints on changing a license later.
            minutes: 9
            level: advanced
            status: full
          - slug: open-source-risks
            title: The risks of depending on open source
            summary: License changes and "rug pulls", abandonment, supply-chain and provenance risk, and the audit and legal exposure that come with every dependency.
            minutes: 10
            level: intermediate
            status: full

      - id: proprietary-and-commercial
        label: "Unit 4 — Proprietary & Commercial Licensing"
        blurb: "The paid side of the spectrum: how proprietary licensing works, the commercial pricing models, source-available licenses, and how to write and price a custom license to sell your own software — plus where to get real help."
        lessons:
          - slug: proprietary-licensing
            title: Proprietary & closed-source licensing
            summary: What a proprietary license restricts and why, from "all rights reserved" to reverse-engineering and redistribution clauses — the opposite end of open source.
            minutes: 9
            level: beginner
            status: full
          - slug: commercial-license-models
            title: Commercial license models
            summary: Perpetual vs subscription, per-seat, per-core, usage-based, site and enterprise licenses, and OEM — the pricing structures behind software you pay for.
            minutes: 10
            level: intermediate
            status: full
          - slug: source-available-licenses
            title: Source-available & "fair source"
            summary: BSL, SSPL, the Elastic License and "fair source" — why companies adopt them, what they actually allow, and why they are not open source.
            minutes: 9
            level: intermediate
            status: full
          - slug: writing-a-commercial-license
            title: Writing a license to sell software
            summary: Building a custom commercial license — the grant, scope, structure, and the decisions you must make first before any clause goes on the page.
            minutes: 11
            level: advanced
            status: full
          - slug: key-commercial-clauses
            title: Key clauses in a commercial license
            summary: Warranty, limitation of liability, indemnity, IP ownership, termination, governing law, and audit rights — the clauses that decide who carries the risk.
            minutes: 11
            level: advanced
            status: full
          - slug: where-to-get-licensing-help
            title: Where to get licensing help
            summary: When you genuinely need a lawyer, the reputable template and contract sources, the standards bodies, and the generators — where to find more information.
            minutes: 8
            level: beginner
            status: full

      - id: oss-in-products
        label: "Unit 5 — Using Open Source in Software You Sell"
        blurb: "You can absolutely build a paid product on open source — if you follow the rules. Meeting permissive obligations, handling copyleft and the 'viral' question, and auditing your dependencies so compliance is continuous, not a fire drill."
        lessons:
          - slug: using-oss-in-products
            title: Can you sell software built on open source?
            summary: Yes — and here are the rules that make it legal. The obligations that come with every dependency, and the myths that scare people away from open source.
            minutes: 9
            level: beginner
            status: full
          - slug: permissive-compliance
            title: Meeting permissive obligations
            summary: The attribution, license-text, and NOTICE requirements behind MIT, BSD, and Apache — modeled on GopherTrunk's own THIRD_PARTY_LICENSES.md.
            minutes: 9
            level: intermediate
            status: full
          - slug: copyleft-in-products
            title: "Copyleft in products: the viral question"
            summary: What actually triggers GPL, AGPL, and LGPL obligations in a product, where the linking and distribution boundaries fall, and the patterns that keep you safe.
            minutes: 11
            level: advanced
            status: full
          - slug: auditing-dependencies
            title: Auditing dependencies & SBOMs
            summary: Knowing every license you ship — dependency scanning, SBOMs, SPDX, the tooling (FOSSA, ScanCode, and friends), and building an ongoing compliance process.
            minutes: 10
            level: intermediate
            status: full

      - id: reading-agreements
        label: "Unit 6 — Reading Agreements & Other User Agreements"
        blurb: "How to actually read a software agreement and understand it before you sign — the main clauses, the risk clauses, and the red flags — then a tour of the other agreements software needs: EULAs, terms of service, privacy policies, DPAs, SLAs, and NDAs."
        lessons:
          - slug: how-to-read-an-agreement
            title: How to read a software agreement
            summary: A repeatable method for reading any license or agreement — following defined terms, mapping the structure, and extracting what actually matters to you.
            minutes: 10
            level: beginner
            status: full
          - slug: main-clauses-decoded
            title: The main clauses, decoded
            summary: The clauses in nearly every software agreement — grant, scope, fees, term, confidentiality, IP — and what each one really means in plain language.
            minutes: 10
            level: intermediate
            status: full
          - slug: risk-clauses
            title: "The risk clauses: who pays when it breaks"
            summary: Warranty disclaimers, limitation of liability, indemnification, and "as-is" — the quiet clauses that decide who is on the hook when software fails.
            minutes: 10
            level: intermediate
            status: full
          - slug: before-you-agree
            title: What to check before you agree
            summary: A pre-signature checklist and the red flags — auto-renewal, price changes, data use, assignment, audit rights, and termination — to catch before you click "I agree".
            minutes: 10
            level: intermediate
            status: full
          - slug: eula-and-tos
            title: EULAs & terms of service
            summary: The agreements your users accept — end-user license agreements and terms of service — what they cover, how they bind users, and the terms that matter most.
            minutes: 9
            level: beginner
            status: full
          - slug: privacy-and-data-agreements
            title: Privacy policies & data agreements
            summary: Privacy policies, data processing agreements, GDPR and CCPA basics, and sub-processors — the data-side agreements most modern software is required to have.
            minutes: 10
            level: intermediate
            status: full
          - slug: sla-and-support-agreements
            title: SLAs & support agreements
            summary: Service level agreements, uptime guarantees and credits, and support and maintenance terms — read from both the buyer's and the seller's side.
            minutes: 9
            level: intermediate
            status: full
          - slug: nda-and-other-agreements
            title: NDAs & the rest of the landscape
            summary: NDAs, master service agreements, acceptable-use policies, and beta/evaluation agreements — the remaining agreements software businesses run on.
            minutes: 9
            level: beginner
            status: full

      - id: putting-it-together
        label: "Unit 7 — Choosing Your License & Agreements"
        blurb: "Everything applied: a repeatable framework that turns your goals into a license choice, a step-by-step walkthrough to pick yours, a way to determine which other agreements your software needs, and a full worked example end to end."
        lessons:
          - slug: the-decision-framework
            title: A framework for choosing
            summary: A repeatable decision framework — goals, business model, dependencies, and risk tolerance map to a license and a set of agreements, not the other way around.
            minutes: 10
            level: intermediate
            status: full
          - slug: choose-your-license
            title: Choosing your license, step by step
            summary: A guided walkthrough to land on your license — open source, proprietary, source-available, or dual — with the questions that decide each fork.
            minutes: 10
            level: intermediate
            status: full
          - slug: which-agreements-do-you-need
            title: Which agreements does your software need?
            summary: Determining the full set — EULA or ToS, privacy policy, DPA, SLA — from how your software is delivered, who uses it, and what data it touches.
            minutes: 10
            level: intermediate
            status: full
          - slug: putting-it-all-together
            title: Putting it all together
            summary: An end-to-end worked example — choosing a license and the full agreement set for a GopherTrunk-like product — plus where to go next and how to stay compliant.
            minutes: 11
            level: advanced
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
      title: Glossary of software-licensing terms
      summary: Plain-language definitions for every term in the path — copyright, copyleft, permissive, GPL/AGPL/LGPL, dual licensing, EULA, ToS, SLA, DPA, SBOM, SPDX, indemnity, and more — cross-linked to the lessons.
      minutes: 12
      level: beginner
      status: full

  - id: programming-go
    label: "Programming in Go"
    title: "Learn Go — from your first program to reading real code"
    tagline: "The language GopherTrunk is written in — from hello world to goroutines, interfaces, and reading a real Go codebase."
    start_slug: why-go
    workload: "PT9H"
    intro: >
      A hands-on path into Go, the language GopherTrunk itself is built in. Start
      with why Go exists and your first compiled program, learn the type system,
      interfaces, and the concurrency model that makes Go shine, then finish by
      reading real code from a working SDR engine. No prior Go — or compiled
      language — experience assumed.
    units:
      - id: meeting-go
        label: "Unit 1 — Meeting Go"
        blurb: "What Go is, why it exists, and the toolchain you run every day."
        lessons:
          - slug: why-go
            title: Why Go?
            summary: Where Go came from, the problems it was built to solve, and why a fast, simple, compiled language is a great fit for systems like GopherTrunk.
            minutes: 8
            level: beginner
            status: full
          - slug: hello-go
            title: Your first Go program
            summary: Install Go, write hello world, and understand the difference between go run and go build — from source to a single static binary.
            minutes: 9
            level: beginner
            status: full
          - slug: the-go-toolchain
            title: The Go toolchain
            summary: go build, run, test, fmt, and vet — the batteries-included tools that format, check, and build your code with zero configuration.
            minutes: 9
            level: beginner
            status: full
      - id: language-fundamentals
        label: "Unit 2 — Language Fundamentals"
        blurb: "Values, control flow, functions, errors, pointers, structs, and interfaces — the core of Go."
        lessons:
          - slug: values-and-types
            title: Values, variables & types
            summary: Go's built-in types, declarations, zero values, and static typing — why a small, strict type set makes programs easier to reason about.
            minutes: 9
            level: beginner
            status: full
          - slug: control-flow
            title: Control flow
            summary: if, for, and switch — Go's deliberately small set of control structures, including the one loop keyword that does everything.
            minutes: 9
            level: beginner
            status: full
          - slug: functions-and-errors
            title: Functions & error handling
            summary: Multiple return values, the error interface, and why Go returns errors instead of throwing exceptions — the pattern you'll see on every line.
            minutes: 10
            level: beginner
            status: full
          - slug: pointers
            title: Pointers
            summary: What a pointer is, why Go has them without pointer arithmetic, and how they let functions modify values and avoid copying big structs.
            minutes: 9
            level: intermediate
            status: full
          - slug: structs-and-methods
            title: Structs & methods
            summary: Group data with structs, attach behaviour with methods, and understand pointer vs value receivers — Go's answer to objects.
            minutes: 10
            level: intermediate
            status: full
          - slug: interfaces
            title: Interfaces & composition
            summary: Small interfaces, implicit satisfaction, and composition over inheritance — the idea that makes Go code flexible without class hierarchies.
            minutes: 10
            level: intermediate
            status: full
      - id: data-and-text
        label: "Unit 3 — Data & Text"
        blurb: "The collections, text, files, and encodings real programs are built from."
        lessons:
          - slug: slices-maps-generics
            title: Slices, maps & generics
            summary: Go's core collections — slices and maps — how they grow and alias, plus type parameters (generics) for reusable, type-safe code.
            minutes: 10
            level: intermediate
            status: full
          - slug: strings-and-runes
            title: Strings, bytes & runes
            summary: How Go handles text — immutable strings, byte slices, and runes — and why Unicode means a character isn't always one byte.
            minutes: 9
            level: intermediate
            status: full
          - slug: json-and-serialization
            title: JSON & serialization
            summary: Turning Go structs into JSON and back with encoding/json, struct tags, and the marshal/unmarshal pattern behind most APIs and config.
            minutes: 9
            level: intermediate
            status: full
          - slug: working-with-files
            title: Working with files & I/O
            summary: Reading and writing files and streams with os, io, and bufio — and the reader/writer interfaces that make it all composable.
            minutes: 9
            level: intermediate
            status: full
      - id: concurrency
        label: "Unit 4 — Concurrency"
        blurb: "Goroutines, channels, coordination, and the patterns that put them to work."
        lessons:
          - slug: goroutines
            title: Goroutines
            summary: Lightweight concurrency you launch with one keyword — what a goroutine is, how it differs from a thread, and why GopherTrunk runs thousands.
            minutes: 9
            level: intermediate
            status: full
          - slug: channels
            title: Channels
            summary: Typed pipes that let goroutines communicate safely — sending, receiving, buffering, and closing — Go's "share memory by communicating" model.
            minutes: 10
            level: intermediate
            status: full
          - slug: select-and-sync
            title: select & synchronization
            summary: Coordinate multiple channels with select, and use the sync package — mutexes, WaitGroups — when channels are not the right tool.
            minutes: 10
            level: advanced
            status: full
          - slug: context-and-cancellation
            title: Context & cancellation
            summary: The context package — how a single cancel signal or timeout propagates through every goroutine in a call tree to shut work down cleanly.
            minutes: 9
            level: advanced
            status: full
          - slug: concurrency-patterns
            title: Concurrency patterns
            summary: Worker pools, pipelines, and fan-out/fan-in — the reusable shapes for structuring concurrent work, the way a real sample pipeline does.
            minutes: 10
            level: advanced
            status: full
      - id: packages-and-quality
        label: "Unit 5 — Packages & Quality"
        blurb: "Organizing, depending on, testing, measuring, and debugging real code."
        lessons:
          - slug: packages-and-modules
            title: Packages & modules
            summary: How Go organizes code into packages and modules, how imports and go.mod work, and how visibility is controlled by capitalization.
            minutes: 9
            level: intermediate
            status: full
          - slug: dependency-management
            title: Dependency management
            summary: How go.mod and go.sum pin versions, how go get and go mod tidy manage dependencies, and why reproducible builds and few dependencies matter.
            minutes: 9
            level: intermediate
            status: full
          - slug: error-handling-patterns
            title: Error-handling patterns
            summary: Beyond if err != nil — wrapping errors with %w, sentinel errors, errors.Is and errors.As, and custom error types for real programs.
            minutes: 10
            level: advanced
            status: full
          - slug: testing-in-go
            title: Testing in Go
            summary: The built-in testing package, table-driven tests, and why testing is a first-class part of the language, not an add-on.
            minutes: 9
            level: intermediate
            status: full
          - slug: benchmarking-and-profiling
            title: Benchmarking & profiling
            summary: Measuring performance with benchmarks and pprof — finding the hot path before optimizing it, the way real-time DSP code demands.
            minutes: 10
            level: advanced
            status: full
          - slug: debugging-go
            title: Debugging Go
            summary: Finding bugs with print debugging, the delve debugger, the race detector, and static analysis — the toolkit for when a test goes red.
            minutes: 9
            level: intermediate
            status: full
          - slug: the-standard-library
            title: The standard library
            summary: A tour of the batteries Go ships with — io, bytes, encoding, net, and more — and why you reach for a dependency far less often than elsewhere.
            minutes: 9
            level: intermediate
            status: full
      - id: go-in-the-wild
        label: "Unit 6 — Go in the Wild"
        blurb: "Logging, project layout, idioms, and reading real code — then your next steps."
        lessons:
          - slug: logging-and-slog
            title: Logging with slog
            summary: Structured logging with the standard log/slog package — levels, fields, and why a running service logs in structured form, not just printed lines.
            minutes: 8
            level: intermediate
            status: full
          - slug: project-structure
            title: Structuring a Go project
            summary: The cmd, internal, and package conventions that shape real Go repositories — where code goes and why, using GopherTrunk's layout as the map.
            minutes: 9
            level: intermediate
            status: full
          - slug: idiomatic-go
            title: Writing idiomatic Go
            summary: The conventions that make Go code look and read the same everywhere — naming, accepting interfaces, handling errors, and avoiding cleverness.
            minutes: 9
            level: intermediate
            status: full
          - slug: reading-real-go
            title: Reading a real Go codebase
            summary: A guided tour of how a working SDR engine like GopherTrunk is structured in Go — packages, interfaces, and goroutines you can now recognize.
            minutes: 11
            level: advanced
            status: full
          - slug: next-steps-in-go
            title: Where to go next
            summary: Idiomatic Go, the tooling ecosystem, the community, and a short project ladder to take you from this path to shipping your own Go programs.
            minutes: 8
            level: beginner
            status: full
    glossary:
      slug: glossary
      title: Glossary of Go terms
      summary: Plain-language definitions for every Go term in the path — goroutine, channel, interface, slice, struct, method, package, module, and more — cross-linked to the lessons.
      minutes: 10
      level: beginner
      status: full

  - id: dsp
    label: "Digital Signal Processing"
    title: "Learn DSP — from samples to decoded bits"
    tagline: "The math and code that turn a stream of radio samples into data — filters, FFTs, mixing, and clock recovery, the way an SDR really works."
    start_slug: what-is-dsp
    workload: "PT9H"
    intro: >
      Software-defined radio is digital signal processing wearing an antenna. This
      path takes the ideas the RF & SDR module introduces and shows how they become
      code — sampling, the Fourier transform, filters, downconversion, demodulation,
      and clock recovery — then maps every one of them onto the pipeline GopherTrunk
      runs to decode digital trunked voice.
    units:
      - id: signals-as-numbers
        label: "Unit 1 — Signals as Numbers"
        blurb: "How a continuous wave becomes an array your code can work on."
        lessons:
          - slug: what-is-dsp
            title: What is DSP?
            summary: Why we process signals with numbers instead of analog circuits, what a digital signal processor does, and where DSP sits in a software radio.
            minutes: 8
            level: beginner
            status: full
          - slug: what-is-a-signal
            title: What is a signal?
            summary: Amplitude, phase, and the sine wave that underlies everything — the vocabulary of signals before we start turning them into numbers.
            minutes: 8
            level: beginner
            status: full
          - slug: sampling-and-quantization
            title: Sampling & quantization
            summary: Turning a wave into samples — sample rate, the Nyquist limit, bit depth, and the aliasing and quantization noise that come with digitizing.
            minutes: 10
            level: beginner
            status: full
          - slug: complex-signals-and-iq
            title: Complex signals & I/Q
            summary: Why SDRs carry signals as complex I/Q pairs, what the imaginary part really means, and how negative frequency becomes a useful, everyday idea.
            minutes: 10
            level: intermediate
            status: full
          - slug: the-decibel-in-dsp
            title: Decibels & dynamic range
            summary: Why signal levels are measured in decibels, how dB math turns multiplication into addition, and what dynamic range means for a sampled signal.
            minutes: 9
            level: beginner
            status: full
      - id: frequency-domain
        label: "Unit 2 — The Frequency Domain"
        blurb: "Seeing a signal as its component frequencies — the Fourier view."
        lessons:
          - slug: the-fourier-transform
            title: The Fourier transform
            summary: The single idea that any signal is a sum of sine waves — what the transform computes, and why the frequency domain makes filtering and detection easy.
            minutes: 10
            level: intermediate
            status: full
          - slug: the-fft
            title: The FFT in practice
            summary: How the Fast Fourier Transform makes the DFT computable in real time, bin resolution, the time-vs-frequency tradeoff, and what a waterfall really shows.
            minutes: 10
            level: intermediate
            status: full
          - slug: windows-and-leakage
            title: Windows & spectral leakage
            summary: Why chopping a signal into blocks smears energy across bins, and how window functions trade resolution for cleaner spectra.
            minutes: 9
            level: advanced
            status: full
          - slug: spectrograms-and-stft
            title: Spectrograms & the STFT
            summary: The short-time Fourier transform — sliding the FFT along a signal to see how its spectrum changes over time, the math behind a waterfall.
            minutes: 9
            level: intermediate
            status: full
          - slug: the-analytic-signal
            title: The analytic signal & Hilbert transform
            summary: How a real signal becomes complex I/Q in the first place — the Hilbert transform, the analytic signal, and why it removes the negative-frequency mirror.
            minutes: 10
            level: advanced
            status: full
      - id: filters
        label: "Unit 3 — Filters"
        blurb: "Selecting the signal you want and throwing away the rest."
        lessons:
          - slug: convolution-and-impulse-response
            title: Convolution & impulse response
            summary: The operation at the heart of every filter — what an impulse response is, and how sliding-and-summing in time equals multiplying in frequency.
            minutes: 10
            level: advanced
            status: full
          - slug: filter-design-basics
            title: Filter design basics
            summary: Passband, stopband, transition width, and ripple — the specification you hand a filter designer, and how those choices trade off against each other.
            minutes: 9
            level: intermediate
            status: full
          - slug: fir-filters
            title: FIR filters
            summary: Finite impulse response filters — taps, linear phase, and how to design a low-pass filter to isolate one channel from a wideband capture.
            minutes: 10
            level: intermediate
            status: full
          - slug: iir-filters
            title: IIR filters
            summary: Infinite impulse response filters — feedback, poles and zeros, far fewer taps, and the stability and phase tradeoffs that come with them.
            minutes: 9
            level: advanced
            status: full
          - slug: decimation-and-resampling
            title: Decimation & resampling
            summary: Changing sample rate without aliasing — decimation, interpolation, and rational resampling — how an SDR narrows 2.4 MS/s down to a 48 kHz channel.
            minutes: 10
            level: intermediate
            status: full
          - slug: matched-filters-and-pulse-shaping
            title: Matched filters & pulse shaping
            summary: Root-raised-cosine filters, the Nyquist no-ISI criterion, and why a matched filter at the receiver maximizes SNR right where symbols are decided.
            minutes: 10
            level: advanced
            status: full
      - id: signal-to-bits
        label: "Unit 4 — From Signal to Bits"
        blurb: "Tuning, demodulating, and recovering the data hidden in the wave."
        lessons:
          - slug: mixing-and-downconversion
            title: Mixing & downconversion
            summary: Multiplying by a local oscillator to shift a signal to baseband — the digital downconverter (DDC) that centres a channel before it is decoded.
            minutes: 10
            level: intermediate
            status: full
          - slug: demodulation
            title: Demodulation in code
            summary: Recovering the message from a carrier — AM, FM, and phase demodulation as arithmetic on I/Q samples, and how C4FM voice starts to appear.
            minutes: 10
            level: intermediate
            status: full
          - slug: clock-and-symbol-recovery
            title: Clock & symbol recovery
            summary: Finding where each symbol begins when you have no shared clock — timing error detectors, interpolation, and the loop that locks onto the data rate.
            minutes: 11
            level: advanced
            status: full
          - slug: carrier-and-frequency-recovery
            title: Carrier & frequency recovery
            summary: Correcting the frequency and phase offset between transmitter and receiver — the PLL and Costas loop that lock a carrier before symbols can be read.
            minutes: 10
            level: advanced
            status: full
          - slug: gain-and-agc
            title: Gain & automatic gain control
            summary: Keeping a signal at a usable amplitude as it fades — how an AGC loop works and why the demodulator needs stable levels to decide symbols correctly.
            minutes: 9
            level: intermediate
            status: full
          - slug: constellations-and-symbol-mapping
            title: Constellations & symbol mapping
            summary: Reading digital modulation as points on the I/Q plane — how PSK and QAM map bits to symbols, and what a constellation diagram tells you.
            minutes: 10
            level: intermediate
            status: full
          - slug: equalization
            title: Equalization & multipath
            summary: Why reflections smear symbols together and how an equalizer undoes a channel's distortion — the filter that adapts to clean up inter-symbol interference.
            minutes: 10
            level: advanced
            status: full
      - id: quality-and-coding
        label: "Unit 5 — Signal Quality & Coding"
        blurb: "Measuring how well a decode is working, and the coding that protects the bits."
        lessons:
          - slug: snr-evm-and-ber
            title: SNR, EVM & BER
            summary: The three numbers that measure a digital link's health — signal-to-noise ratio, error-vector magnitude, and bit error rate — and how they relate.
            minutes: 9
            level: intermediate
            status: full
          - slug: the-eye-diagram
            title: The eye diagram
            summary: Overlaying symbol periods into an "eye" — how to read timing margin, noise, and inter-symbol interference at a glance from one picture.
            minutes: 8
            level: intermediate
            status: full
          - slug: error-correction-and-framing
            title: Error correction & framing
            summary: How raw symbols become trustworthy data — sync words, framing, interleaving, and forward error correction that fix bit errors before decoding.
            minutes: 10
            level: advanced
            status: full
          - slug: real-time-and-buffering
            title: Real-time processing & buffering
            summary: Block processing, ring buffers, latency, and keeping up with the sample stream — the engineering that makes DSP run live instead of offline.
            minutes: 9
            level: advanced
            status: full
      - id: dsp-in-practice
        label: "Unit 6 — DSP in Practice"
        blurb: "Put the whole chain together the way a real decoder does."
        lessons:
          - slug: dsp-in-gophertrunk
            title: DSP in GopherTrunk
            summary: A walkthrough of GopherTrunk's real signal path — capture, downconvert, filter, demodulate, recover symbols — mapping each stage to the lessons you just learned.
            minutes: 11
            level: advanced
            status: full
          - slug: testing-and-debugging-dsp
            title: Testing & debugging DSP
            summary: Golden vectors, offline replay of captures, and the invariants that catch a broken signal path — how you prove a decoder actually works.
            minutes: 10
            level: advanced
            status: full
          - slug: fixed-vs-floating-point
            title: Fixed vs floating point & performance
            summary: Why real-time DSP cares about how numbers are stored, the tradeoffs of fixed vs floating point, and simple ways to keep a sample pipeline fast.
            minutes: 9
            level: advanced
            status: full
    glossary:
      slug: glossary
      title: Glossary of DSP terms
      summary: Plain-language definitions for every DSP term in the path — sample rate, Nyquist, I/Q, FFT, FIR, IIR, decimation, mixing, AGC, symbol recovery, and more — cross-linked to the lessons.
      minutes: 11
      level: beginner
      status: full

  - id: deployment
    label: "Containers & Deployment"
    title: "Learn deployment — from your machine to production"
    tagline: "How software actually ships and runs — containers, Docker, systemd, CI/CD, and the cloud — using GopherTrunk's own deployment as the worked example."
    start_slug: what-is-deployment
    workload: "PT9H"
    intro: >
      Writing software is only half the job; getting it running reliably somewhere
      other than your laptop is the other half. This path covers the modern
      deployment toolkit — build artifacts, containers and Docker, running services
      with systemd, secrets and configuration, CI/CD pipelines, and cloud hosting —
      and finishes by deploying a real application, GopherTrunk, end to end.
    units:
      - id: foundations
        label: "Unit 1 — Foundations"
        blurb: "What deployment means, its lifecycle, and the artifacts and config it depends on."
        lessons:
          - slug: what-is-deployment
            title: What is deployment?
            summary: The journey from source code to a running service, what "it works on my machine" really costs, and the moving parts every deployment has to handle.
            minutes: 8
            level: beginner
            status: full
          - slug: the-deployment-lifecycle
            title: The deployment lifecycle
            summary: Build, test, release, deploy, operate — the repeating cycle every change moves through, and how the rest of this module maps onto its stages.
            minutes: 8
            level: beginner
            status: full
          - slug: environments-and-config
            title: Environments & configuration
            summary: Dev, staging, and production, why the same build must run in all of them, and how environment variables and config files keep settings out of code.
            minutes: 9
            level: beginner
            status: full
          - slug: build-artifacts-and-versioning
            title: Build artifacts & versioning
            summary: What a build produces, why a single reproducible artifact beats rebuilding everywhere, and how version tags let you ship and roll back with confidence.
            minutes: 9
            level: beginner
            status: full
          - slug: release-strategies
            title: Release strategies
            summary: Rolling, blue-green, and canary releases — the patterns for pushing a new version to users without downtime or a risky big-bang cutover.
            minutes: 9
            level: intermediate
            status: full
      - id: containers
        label: "Unit 2 — Containers"
        blurb: "Package an app with everything it needs to run, anywhere — safely."
        lessons:
          - slug: what-is-a-container
            title: What is a container?
            summary: Containers vs virtual machines, the isolation the kernel provides, and why "ship the whole environment" solves the works-on-my-machine problem.
            minutes: 9
            level: beginner
            status: full
          - slug: writing-a-dockerfile
            title: Writing a Dockerfile
            summary: Build an image step by step — base images, layers, and multi-stage builds — and how GopherTrunk's own Dockerfile turns Go source into a small runtime image.
            minutes: 11
            level: intermediate
            status: full
          - slug: container-image-optimization
            title: Optimizing container images
            summary: Small, fast, secure images — multi-stage builds, minimal and distroless bases, layer-cache ordering, and .dockerignore — and why GopherTrunk's image is tiny.
            minutes: 9
            level: intermediate
            status: full
          - slug: images-and-registries
            title: Images & registries
            summary: How images are named, tagged, stored, and shared through registries, and how a pull-and-run makes deploying somewhere new a one-line operation.
            minutes: 9
            level: intermediate
            status: full
          - slug: docker-compose
            title: Multi-container apps with Compose
            summary: Describe an app and its dependencies as one file — services, networks, and volumes — and bring the whole stack up with a single command.
            minutes: 10
            level: intermediate
            status: full
          - slug: container-networking-and-volumes
            title: Container networking & volumes
            summary: How containers get an IP, talk to each other, publish ports, and persist data — the networking and storage model beneath a Compose file.
            minutes: 9
            level: intermediate
            status: full
          - slug: container-security
            title: Container security
            summary: Running as non-root, dropping capabilities, read-only filesystems, and scanning images — giving a container exactly the access it needs and no more.
            minutes: 10
            level: advanced
            status: full
      - id: running-in-production
        label: "Unit 3 — Running in Production"
        blurb: "Keep a service alive, reachable, observable, and configured safely."
        lessons:
          - slug: services-and-systemd
            title: Services & systemd
            summary: Turn a program into a managed service that starts on boot and restarts on failure, using the systemd unit GopherTrunk ships as the example.
            minutes: 10
            level: intermediate
            status: full
          - slug: reverse-proxies-and-tls
            title: Reverse proxies & TLS
            summary: Putting a service behind nginx or Caddy — terminating HTTPS, routing by host, and why the proxy, not the app, usually handles certificates.
            minutes: 10
            level: intermediate
            status: full
          - slug: logging-and-health-checks
            title: Logging & health checks
            summary: How a running service tells you it's healthy — structured logs, health endpoints, and the signals an orchestrator uses to restart what is broken.
            minutes: 9
            level: intermediate
            status: full
          - slug: secrets-and-configuration
            title: Secrets & configuration management
            summary: Keeping API keys and passwords out of images and repos — environment injection, secret stores, and the difference between config and secrets.
            minutes: 9
            level: intermediate
            status: full
          - slug: backups-and-data
            title: Backups & persistent data
            summary: Where a service's data lives, how to back it up and restore it, and why stateful data needs a plan that stateless containers don't.
            minutes: 9
            level: intermediate
            status: full
          - slug: production-hardening
            title: Production hardening
            summary: Least privilege, firewalls, updates, and the systemd sandboxing GopherTrunk ships — locking a deployment down against the threats a real host faces.
            minutes: 10
            level: advanced
            status: full
      - id: automate-and-scale
        label: "Unit 4 — Automate & Scale"
        blurb: "Ship automatically, describe infrastructure as code, and grow to meet load."
        lessons:
          - slug: ci-cd-pipelines
            title: CI/CD pipelines
            summary: Automating build, test, and release so every commit is shippable — what a pipeline does, and how GopherTrunk uses GitHub Actions to build and publish.
            minutes: 10
            level: intermediate
            status: full
          - slug: infrastructure-as-code
            title: Infrastructure as code
            summary: Describing servers and services declaratively so environments are reproducible — the idea behind tools like Terraform and Ansible, versioned like code.
            minutes: 9
            level: intermediate
            status: full
          - slug: deploying-to-cloud-and-vps
            title: Deploying to the cloud & VPS
            summary: The hosting spectrum — a VPS you manage, managed platforms, and container services — and how to choose based on control, cost, and effort.
            minutes: 10
            level: intermediate
            status: full
          - slug: container-orchestration
            title: Container orchestration
            summary: What Kubernetes and its cousins actually do — scheduling, self-healing, and scaling many containers — and how to tell when you truly need one.
            minutes: 10
            level: advanced
            status: full
          - slug: scaling-and-load-balancing
            title: Scaling & load balancing
            summary: Scaling up vs out, stateless vs stateful services, and how a load balancer spreads traffic across instances — the mechanics of handling more users.
            minutes: 10
            level: advanced
            status: full
          - slug: zero-downtime-deploys
            title: Zero-downtime deploys
            summary: Health-gated rollouts, draining connections, and rollback — how to replace a running version without dropping a single request.
            minutes: 9
            level: advanced
            status: full
      - id: operate
        label: "Unit 5 — Operate"
        blurb: "Keep a live system healthy: monitor it, get alerted, respond, and control cost."
        lessons:
          - slug: monitoring-and-updates
            title: Monitoring & updates
            summary: Keeping a deployment healthy over time — metrics and alerts, rolling out new versions safely, and rolling back when a release goes wrong.
            minutes: 9
            level: intermediate
            status: full
          - slug: observability
            title: Observability — metrics, logs & traces
            summary: The three pillars that let you understand a running system — metrics, logs, and traces — and how they answer "is it up?", "what happened?", and "why is it slow?".
            minutes: 10
            level: intermediate
            status: full
          - slug: alerting-and-oncall
            title: Alerting & on-call
            summary: Turning metrics into pages that matter — good alert thresholds, avoiding alert fatigue, and what being on-call for a service actually means.
            minutes: 9
            level: intermediate
            status: full
          - slug: incident-response
            title: Incident response & runbooks
            summary: What to do when production breaks — detecting, mitigating, and communicating during an incident, and the runbooks and postmortems that prevent the next one.
            minutes: 9
            level: intermediate
            status: full
          - slug: cost-and-resources
            title: Cost & resource management
            summary: Right-sizing CPU and memory, understanding what cloud resources cost, and keeping a deployment affordable without starving it.
            minutes: 9
            level: intermediate
            status: full
      - id: deployment-applied
        label: "Unit 6 — Applied"
        blurb: "Deploy a real application from start to finish."
        lessons:
          - slug: deploying-gophertrunk
            title: Deploying GopherTrunk end to end
            summary: A complete worked example — container image, docker-compose stack, and a systemd service — taking GopherTrunk from a repo to a running scanner on a server.
            minutes: 12
            level: advanced
            status: full
    glossary:
      slug: glossary
      title: Glossary of deployment terms
      summary: Plain-language definitions for every deployment term in the path — container, image, registry, Dockerfile, Compose, systemd, CI/CD, artifact, secret, and more — cross-linked to the lessons.
      minutes: 10
      level: beginner
      status: full

  - id: databases
    label: "Databases & Data"
    title: "Databases & Data — where your application's data lives, from a first table to production"
    tagline: "Every app needs somewhere to keep its data — tables, SQL, keys and joins, the relational and NoSQL and vector stores, and how to query, model, and run a database from your own code."
    start_slug: what-is-a-database
    workload: "PT7H"
    intro: >
      Almost every program you build eventually needs to remember something — a
      user, a setting, a log of decoded calls. A database is where that data lives:
      structured so you can store it reliably and get it back fast. This module
      starts from why plain files aren't enough, builds up the relational model and
      SQL — the language nearly every database speaks — then teaches you to design
      data well, reach beyond relational to key-value, document, time-series, and
      vector stores, and finally talk to a database from your own code and run one
      in production. Examples lean on real software, including how a project like
      GopherTrunk stores the calls and systems it decodes. Pairs with the Software
      Engineering and AI Software Development paths; no prior database experience
      assumed.
    units:
      - id: why-data-needs-structure
        label: "Unit 1 — Why Data Needs Structure"
        blurb: "What a database is and the ideas underneath it: persistence, the relational model, schemas and types, and the keys that tie data together."
        lessons:
          - slug: what-is-a-database
            title: What a database is (and why not just files)
            summary: The problem databases solve — storing data so many readers and writers can query it reliably, safely, and fast, instead of hand-rolling files.
            minutes: 8
            level: beginner
            status: full
          - slug: data-and-persistence
            title: Data, state & persistence
            summary: The difference between data your program holds in memory and data that outlives it — persistence, durability, and why "save it somewhere" is harder than it looks.
            minutes: 8
            level: beginner
            status: full
          - slug: the-relational-model
            title: The relational model — tables, rows & columns
            summary: The idea that has run the data world for fifty years — organising data into tables of rows and columns, and why that simple shape is so powerful.
            minutes: 9
            level: beginner
            status: full
          - slug: schemas-and-types
            title: Schemas, columns & data types
            summary: A schema is the shape of your data — the columns, their types, and the rules — and why deciding it up front saves you from a mess later.
            minutes: 8
            level: beginner
            status: full
          - slug: keys-and-relationships
            title: Keys & relationships
            summary: Primary keys that name each row and foreign keys that link tables — how a database models the relationships between your things.
            minutes: 9
            level: beginner
            status: full

      - id: sql
        label: "Unit 2 — SQL, the Language of Data"
        blurb: "The query language almost every database understands: selecting, filtering, joining, aggregating, changing data, and making it all fast with indexes."
        lessons:
          - slug: what-is-sql
            title: What SQL is
            summary: The declarative language for talking to a relational database — you describe the data you want, not how to fetch it, and the database works out the rest.
            minutes: 8
            level: beginner
            status: full
          - slug: querying-with-select
            title: Querying with SELECT
            summary: The single most-used statement in all of software — SELECT — and how to ask a database for exactly the columns and rows you need.
            minutes: 9
            level: beginner
            status: full
          - slug: filtering-and-sorting
            title: Filtering, sorting & limiting
            summary: WHERE, ORDER BY, and LIMIT — narrowing a result set to the rows that matter, in the order you want, without dragging back the whole table.
            minutes: 9
            level: beginner
            status: full
          - slug: joins
            title: Joining tables
            summary: The heart of relational power — combining rows from two tables on a shared key, and the difference between inner and outer joins.
            minutes: 10
            level: intermediate
            status: full
          - slug: aggregation-and-grouping
            title: Aggregation & GROUP BY
            summary: Turning many rows into a summary — counts, sums, and averages — with GROUP BY and HAVING, the tools behind every dashboard number.
            minutes: 9
            level: intermediate
            status: full
          - slug: inserting-updating-deleting
            title: Inserting, updating & deleting
            summary: The write side of SQL — INSERT, UPDATE, and DELETE — and the WHERE clause you forget at your peril.
            minutes: 8
            level: beginner
            status: full
          - slug: indexes
            title: Indexes & how queries get fast
            summary: Why the same query can take a millisecond or a minute — indexes, what they cost, and the mental model of a book's index that explains them.
            minutes: 10
            level: intermediate
            status: full

      - id: designing-data-well
        label: "Unit 3 — Designing Data Well"
        blurb: "Turning a pile of columns into a sound design: normalization, modeling a real app, constraints, transactions, and evolving the schema safely over time."
        lessons:
          - slug: normalization
            title: Normalization & avoiding duplication
            summary: Why storing the same fact in two places will eventually betray you — normalization, and the handful of normal forms worth actually knowing.
            minutes: 10
            level: intermediate
            status: full
          - slug: data-modeling
            title: Data modeling for a real app
            summary: Going from "what does my app do" to a set of tables and relationships — the practical craft of modeling data before you write a line of code.
            minutes: 10
            level: intermediate
            status: full
          - slug: constraints-and-integrity
            title: Constraints & data integrity
            summary: Letting the database enforce the rules — NOT NULL, UNIQUE, CHECK, and foreign-key constraints that keep bad data out no matter what the app does.
            minutes: 9
            level: intermediate
            status: full
          - slug: transactions-and-acid
            title: Transactions & ACID
            summary: All-or-nothing changes — transactions, the ACID guarantees behind them, and why moving money (or updating two tables) needs them.
            minutes: 10
            level: intermediate
            status: full
          - slug: migrations
            title: Schema migrations & evolving a database
            summary: Your schema is never finished — migrations are how you change a live database's shape safely, in version control, without losing data.
            minutes: 9
            level: intermediate
            status: full

      - id: beyond-relational
        label: "Unit 4 — Beyond Relational"
        blurb: "The other database families and when they beat a table: key-value and document stores, time-series and analytics, vector search, and caching layers."
        lessons:
          - slug: sql-vs-nosql
            title: SQL vs. NoSQL
            summary: What "NoSQL" actually means, the tradeoff it makes, and how to tell when a non-relational store fits a problem better than tables do.
            minutes: 9
            level: intermediate
            status: full
          - slug: key-value-and-document
            title: Key-value & document stores
            summary: Two of the most common NoSQL shapes — the dictionary-like key-value store and the JSON-document store — and the jobs each is built for.
            minutes: 9
            level: intermediate
            status: full
          - slug: time-series-and-analytics
            title: Time-series & analytical stores
            summary: Databases tuned for when-it-happened data and for crunching huge tables — time-series and column stores, and why your metrics live in one.
            minutes: 9
            level: intermediate
            status: full
          - slug: vector-databases
            title: Vector databases & similarity search
            summary: The store behind AI retrieval — embeddings as vectors, searching by meaning instead of keywords, and how RAG features lean on it.
            minutes: 10
            level: intermediate
            status: full
          - slug: caching-layers
            title: Caching layers
            summary: Keeping hot data in fast memory in front of the database — caches like Redis, what they buy you, and the classic hard problem of keeping them fresh.
            minutes: 9
            level: intermediate
            status: full

      - id: using-a-database-from-code
        label: "Unit 5 — Using a Database From Code"
        blurb: "Wiring a database into a program: connecting, pooling connections, ORMs versus raw SQL, defending against injection, and doing it all in Go."
        lessons:
          - slug: connecting-from-code
            title: Connecting from your program
            summary: Drivers, connection strings, and credentials — how a running program actually opens a link to a database and sends it queries.
            minutes: 9
            level: intermediate
            status: full
          - slug: connection-pooling
            title: Connection pools
            summary: Opening a connection is expensive, so real apps reuse a pool of them — what a pool is, why you need one, and how to size it.
            minutes: 8
            level: intermediate
            status: full
          - slug: orms-vs-raw-sql
            title: ORMs vs. raw SQL
            summary: The perennial choice — let a library map objects to rows, or write SQL by hand — what each buys you and what each costs.
            minutes: 9
            level: intermediate
            status: full
          - slug: sql-injection
            title: SQL injection & querying safely
            summary: The classic, still-common vulnerability where user input becomes SQL — how it happens and why parameterised queries end it.
            minutes: 9
            level: intermediate
            status: full
          - slug: databases-in-go
            title: Talking to a database from Go
            summary: The Go way — database/sql, drivers, prepared statements, and querying safely — with the patterns GopherTrunk-style services use.
            minutes: 10
            level: advanced
            status: full

      - id: databases-in-production
        label: "Unit 6 — Running a Database in Production"
        blurb: "Everything applied: keeping data safe with backups, scaling with replication, watching performance, choosing the right database, and the data behind GopherTrunk."
        lessons:
          - slug: backups-and-recovery
            title: Backups & recovery
            summary: The single most important operational habit — backups you have actually restored, point-in-time recovery, and testing them before you need them.
            minutes: 9
            level: intermediate
            status: full
          - slug: replication-and-scaling
            title: Replication, sharding & scaling
            summary: When one server isn't enough — read replicas, sharding, and the CAP tradeoffs that shape how a database scales out.
            minutes: 10
            level: advanced
            status: full
          - slug: performance-and-monitoring
            title: Performance tuning & monitoring
            summary: Finding the slow query before your users do — EXPLAIN, query plans, the metrics that matter, and the usual suspects behind a sluggish database.
            minutes: 10
            level: advanced
            status: full
          - slug: choosing-a-database
            title: Choosing a database
            summary: SQLite, Postgres, MySQL, a document store, a managed service like Supabase — a practical framework for picking the right one for a project.
            minutes: 9
            level: intermediate
            status: full
          - slug: data-in-gophertrunk
            title: Data in GopherTrunk
            summary: A worked example — how a scanner like GopherTrunk models systems, talkgroups, and decoded calls, and stores them for search and playback.
            minutes: 10
            level: advanced
            status: full

    # Standalone reference, not part of the sequential path (no prev/next slot).
    glossary:
      slug: glossary
