title: GopherTrunk
description: Pure-Go digital-trunking RTL-SDR scanner engine. P25, DMR, TETRA, NXDN, Motorola, EDACS, LTR, MPT 1327, dPMR, D-STAR, YSF — single static binary.
url: https://gophertrunk.org
lang: en
markdown: kramdown

# Blog scheduling. A post whose date is in the future is excluded from the
# build until a build runs on or after that date. Paired with the weekday
# `schedule:` cron in .github/workflows/pages.yml, this drips a series that is
# committed all at once out one post per weekday. `future: false` is Jekyll's
# default — stated explicitly so the mechanism is self-documenting and immune to
# any builder default change. `timezone` makes a date-only post (midnight) flip
# at local midnight instead of UTC, so "dated 2026-07-01 → live July 1" holds.
future: false
timezone: America/Chicago
logo: /assets/gophertrunk-logo.png

# jekyll-seo-tag picks these up automatically. `image` becomes the
# default og:image / twitter:image when a page doesn't set its own.
author:
  name: Matt Cheramie
  url: https://github.com/MattCheramie
image: /assets/gophertrunk-logo.png

# Schema.org SoftwareApplication metadata consumed by
# _includes/head.html.
software:
  application_category: DeveloperApplication
  operating_systems: "Linux, macOS, Windows"
  programming_language: Go
  license: https://github.com/MattCheramie/GopherTrunk/blob/main/LICENSE
  download_url: https://gophertrunk.org/downloads.html
  repository: https://github.com/MattCheramie/GopherTrunk

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: true

# Atom feed at /feed.xml, generated by jekyll-feed.
feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Learning-module lessons under each module get the lesson layout, nav group,
  # and their `learn_module` id automatically, so individual lessons only declare
  # slug/title/description. Each module's hub (learn/<id>/index.md) overrides
  # layout to `learn-hub`; the chooser (learn/index.md) overrides to
  # `learn-index`; the Learning Path guides (learn/paths/<id>/index.md) use
  # `learn-path`. `learn_module` is a custom key — never `page.path`, which is a
  # Jekyll built-in used for the "Edit on GitHub" links.
  - scope:
      path: "learn/paths"
      type: pages
    values:
      nav_group: Learn
  - scope:
      path: "learn/rf-sdr"
      type: pages
    values:
      layout: lesson
      learn_module: rf-sdr
      nav_group: Learn
      permalink: /learn/rf-sdr/:basename/
  - scope:
      path: "learn/git"
      type: pages
    values:
      layout: lesson
      learn_module: git
      nav_group: Learn
      permalink: /learn/git/:basename/
  - scope:
      path: "learn/linux-cli"
      type: pages
    values:
      layout: lesson
      learn_module: linux-cli
      nav_group: Learn
      permalink: /learn/linux-cli/:basename/
  - scope:
      path: "learn/networking"
      type: pages
    values:
      layout: lesson
      learn_module: networking
      nav_group: Learn
      permalink: /learn/networking/:basename/
  - scope:
      path: "learn/cybersecurity"
      type: pages
    values:
      layout: lesson
      learn_module: cybersecurity
      nav_group: Learn
      permalink: /learn/cybersecurity/:basename/
  - scope:
      path: "learn/intro-software-dev"
      type: pages
    values:
      layout: lesson
      learn_module: intro-software-dev
      nav_group: Learn
      permalink: /learn/intro-software-dev/:basename/
  - scope:
      path: "learn/digital-trunking"
      type: pages
    values:
      layout: lesson
      learn_module: digital-trunking
      nav_group: Learn
      permalink: /learn/digital-trunking/:basename/
  - scope:
      path: "learn/intro-hardware"
      type: pages
    values:
      layout: lesson
      learn_module: intro-hardware
      nav_group: Learn
      permalink: /learn/intro-hardware/:basename/
  - scope:
      path: "learn/ai-software-dev"
      type: pages
    values:
      layout: lesson
      learn_module: ai-software-dev
      nav_group: Learn
      permalink: /learn/ai-software-dev/:basename/
  - scope:
      path: "learn/building-ai"
      type: pages
    values:
      layout: lesson
      learn_module: building-ai
      nav_group: Learn
      permalink: /learn/building-ai/:basename/
  - scope:
      path: "learn/software-licensing"
      type: pages
    values:
      layout: lesson
      learn_module: software-licensing
      nav_group: Learn
      permalink: /learn/software-licensing/:basename/
  - scope:
      path: "learn/programming-go"
      type: pages
    values:
      layout: lesson
      learn_module: programming-go
      nav_group: Learn
      permalink: /learn/programming-go/:basename/
  - scope:
      path: "learn/dsp"
      type: pages
    values:
      layout: lesson
      learn_module: dsp
      nav_group: Learn
      permalink: /learn/dsp/:basename/
  - scope:
      path: "learn/deployment"
      type: pages
    values:
      layout: lesson
      learn_module: deployment
      nav_group: Learn
      permalink: /learn/deployment/:basename/
  # Field Guide articles under /reference/ get the reference layout and nav
  # group automatically. The hub (reference/index.md) overrides to reference-hub.
  - scope:
      path: "reference"
      type: pages
    values:
      layout: reference
      nav_group: Field Guide
      permalink: /reference/:basename/
  # Per-category post URLs scoped to posts only — a global `permalink`
  # in _config.yml would also rewrite every existing /foo.html page to
  # /foo/ and break the data-driven nav.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_group: Blog
      permalink: /blog/:categories/:title/

include:
  - README.md

exclude:
  - specs/
  - supabase/          # SQL schema + setup notes; repo docs, not published pages
  - Gemfile
  - Gemfile.lock
  - vendor/
