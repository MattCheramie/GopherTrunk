name: Docs site check

# Builds the docs/ Jekyll site on every PR that touches it and verifies the
# site map stays complete — every rendered page is in sitemap.xml and linked
# from the human-readable /sitemap/ page. This runs on pull_request (the Pages
# deploy in pages.yml only runs on push to main), so an orphaned or
# un-listed new page is caught before it merges.

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-check.yml"
      - ".github/scripts/check_site_pages.py"
      - ".github/scripts/check_internal_links.py"
      - ".github/scripts/synthesize_home.sh"

permissions:
  contents: read

jobs:
  sitemap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the exact same synthesis pages.yml deploys with, so the built site
      # matches production (the homepage is synthesized from README.md, so /
      # exists and lands in sitemap.xml). Sharing the script keeps the two
      # pipelines from drifting — a PR must build the homepage prod serves.
      - name: Synthesize landing page from README.md
        run: .github/scripts/synthesize_home.sh README.md docs/index.md

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Verify every page is in the site map
        run: python3 .github/scripts/check_site_pages.py _site

      - name: Verify every internal link resolves
        run: python3 .github/scripts/check_internal_links.py _site
