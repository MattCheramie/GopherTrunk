name: Pages

# Builds the docs/ folder as a Jekyll site and publishes it to GitHub Pages.
# The landing page is synthesized from README.md at build time so the file
# isn't duplicated in the repo.
#
# One-time setup required: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Without that, deploy-pages fails with
# "Pages site not found".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  schedule:
    # Daily rebuild so future-dated posts publish on their date. A series can be
    # committed all at once with `future: false` (docs/_config.yml) and
    # consecutive dates; each run reveals the posts that have come due. Runs
    # every day including weekends. 16:00 UTC = 11:00 America/Chicago (CDT) —
    # well past local midnight, so a post dated "today" is already in the past at
    # build time. GitHub cron is UTC (does not follow DST) and best-effort (may
    # be delayed under load, which is fine for a daily drip). Note: GitHub
    # disables scheduled workflows after 60 days with no repo commits — not a
    # concern for an active repo.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synthesize landing page from README.md
        run: |
          {
            # No `title:` front-matter — jekyll-seo-tag falls back to
            # site.title for the homepage <title>, which gives us the
            # SEO-optimal "GopherTrunk · <site.description>" string
            # instead of "Home | GopherTrunk".
            printf -- '---\nlayout: home\n---\n\n'
            # Five transforms:
            # 1. docs/assets/foo -> /assets/foo (docs/ is the Jekyll
            #    source root, so the asset publishes at /assets/foo).
            # 2. ](docs/foo.md) -> ](/foo.html) so README cross-links
            #    resolve on the Pages site.
            # 3/4. Remaining repo-relative links (CHANGELOG.md, LICENSE,
            #    CONTRIBUTING.md, samples/…, etc.) point at files that
            #    live in the repo but NOT on the Pages site, so on the
            #    homepage they'd 404. Rewrite them to absolute GitHub
            #    URLs — tree/main for directories (trailing slash),
            #    blob/main for files. These run AFTER rule 2, so the
            #    already-rewritten /foo.html links (leading `/`) and any
            #    http(s):// links (the `[^):#]` class stops at the `:`)
            #    are left untouched.
            # 5. Strip everything from the start of the README through
            #    the first `---` horizontal-rule separator. That cuts
            #    the README hero (logo + H1 + tagline + badges) which
            #    is already rendered by the home.html layout's own
            #    hero block — without this, the homepage double-H1s
            #    and Google penalizes multi-H1 documents.
            sed -E \
              -e 's|docs/assets/|/assets/|g' \
              -e 's|\]\(docs/([a-z0-9_-]+)\.md(#[^)]*)?\)|](/\1.html\2)|g' \
              -e 's|\]\(([A-Za-z][^):#]*/)\)|](https://github.com/MattCheramie/GopherTrunk/tree/main/\1)|g' \
              -e 's|\]\(([A-Za-z][^):#]*)(#[^)]*)?\)|](https://github.com/MattCheramie/GopherTrunk/blob/main/\1\2)|g' \
              README.md \
              | sed '0,/^---$/d'
          } > docs/index.md

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # Block the deploy if a page fell out of the site map (missing from
      # sitemap.xml or not linked from /sitemap/). Same check runs on PRs.
      - name: Verify every page is in the site map
        run: python3 .github/scripts/check_site_pages.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
