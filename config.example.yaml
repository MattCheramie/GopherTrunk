# Example GopherTrunk daemon configuration. Copy to ./config.yaml (or
# whatever path you pass to `gophertrunk run -config`) and adjust to
# match your hardware + systems.
#
# PATHS: every filesystem path below (storage, recordings, IQ, logs,
# talkgroup/RID files, …) is resolved by the daemon RELATIVE TO THE
# FOLDER CONTAINING THIS FILE. The Windows installer drops this file at
# <DataRoot>\config\config.yaml, so the "../recordings", "../data",
# "../iq", "../logs" defaults land in sibling folders under one data
# root. You can still use an absolute path (/var/lib/gophertrunk/...,
# C:\Data\..., \\server\share\...) or an environment variable
# (${GOPHERTRUNK_HOME}/recordings, %USERPROFILE%\GopherTrunk\...) — those
# are taken as-is.
#
# See internal/config/config.go for the authoritative list of accepted
# keys and their defaults.

log:
  level: info       # debug | info | warn | error
  # At `debug`, each completed voice call logs a "recorder: voice audio
  # quality" line (pitch, harmonic count, AGC gain, output peak/RMS/crest,
  # clip%) for diagnosing robotic/over-driven audio. Output clipping is
  # surfaced as a WARN even at `info`.
  format: text      # text | json
  # Decoded-message log: a human-readable text log of every trunking
  # event (grants, CC lock/loss, affiliations, patches, locations).
  # message_log:
  #   enabled: true
  #   path: "../logs/messages.log"
  #   max_size_mb: 16          # rotates to messages.log.1 past this
  # Power log: a per-channel IQ-power log for the wideband engine, gated on
  # decode activity so only channels actually carrying traffic appear. By
  # default it records only low-power (weak-signal) windows — the "decoding
  # but the signal is marginal" diagnostic. Set all_windows to log every
  # decode-active window for a full power time-series.
  # power_log:
  #   enabled: true
  #   path: "../logs/power.log"
  #   max_size_mb: 16          # rotates to power.log.1 past this
  #   all_windows: false       # true ⇒ log every active window, not just low-power
  # Event log: every bus event written as one JSON line (JSONL/NDJSON), in the
  # same envelope the web UI / SSE / WS streams consume. Unlike message_log it
  # captures ALL event kinds, so it records a whole session for offline
  # inspection (hand it to support when a decode looks wrong but there's no
  # raw IQ to replay).
  # event_log:
  #   enabled: true
  #   path: "../logs/events.jsonl"
  #   max_size_mb: 16          # rotates to events.jsonl.1 past this

# display — how the daemon renders timestamps for humans (the decoded-message
# log, the power log, and the TUI). This does NOT touch the JSON/gRPC API,
# webhooks or rdioscanner uploads, which stay UTC RFC3339 for interoperability.
# display:
#   # "Local" (default) → the host's local timezone; "UTC" → the historical
#   # GMT+0 behaviour; or any IANA name, e.g. "America/New_York", "Europe/Paris".
#   timezone: "Local"

# diagnostics — error-reporting verbosity. Every error is prefixed with
# a diagnostics banner (version, OS, system specs, detected dongles).
diagnostics:
  # When true, errors print the full wrapped chain + a goroutine stack
  # dump (no interactive prompt), and HTTP/gRPC error responses include
  # the banner + trace. That exposes host + dongle info (hostname,
  # kernel, serials) to API clients, so only enable it on trusted
  # networks. When false (default), the CLI instead offers the full
  # trace interactively on a terminal. Override at runtime with
  # -verbose-errors or GOPHERTRUNK_VERBOSE_ERRORS=1.
  verbose_errors: false

  # Soft heap limit (MiB) so the GC keeps the resident footprint bounded
  # instead of letting it balloon under sustained high-allocation load — the
  # guard against the daemon being SIGKILLed by the OS memory-pressure killer
  # (Linux OOM-killer / macOS jetsam) after minutes with no log line. 0
  # (default) auto-derives ~70% of physical RAM when known, else stays
  # unbounded. The GOMEMLIMIT env var, if set, always wins.
  memory_limit_mb: 0

  # Period (seconds) of the runtime health log: uptime, goroutine count, and
  # heap/sys bytes. Turns a silent stop into a timeline (a climbing curve =
  # leak, a frozen line on a live process = hang, the last line before a cut =
  # pre-kill footprint). 0 uses the 60 s default; negative disables it.
  heartbeat_seconds: 0

# radioreference — read-only credentials for RadioReference.com's SOAP web
# service, used by `gophertrunk hunt` to check whether a discovered system
# already exists in RadioReference before you submit it. RadioReference has
# NO public write API — new systems go through a manual web Submit form
# reviewed by administrators — so nothing is ever posted; this is purely a
# read-only duplicate check. All fields are optional: with no api_key the
# check is simply skipped and the hunt still exports its files. The values
# are also overridable by GOPHERTRUNK_RR_KEY / GOPHERTRUNK_RR_USER /
# GOPHERTRUNK_RR_PASS and the `hunt -rr-key` flag, so the secret need not
# live in this file. Request an API key at https://www.radioreference.com/account/api
# radioreference:
#   api_key: ""
#   username: ""
#   password: ""

api:
  http_addr: "127.0.0.1:8080"   # HTTP REST + SSE + WebSocket
  grpc_addr: "127.0.0.1:50051"  # gRPC

  # Bearer-token authentication on the mutation endpoints (end call,
  # talkgroup priority/lockout, retention sweep, tone-out detector
  # reset, scanner cockpit, audio cockpit).
  #
  # mode:
  #   auto      — (default) require a token on non-loopback binds;
  #               bypass the check when bound to 127.0.0.1 / ::1
  #               (peer-cred via kernel-enforced reachability is a
  #               reasonable trust proxy on a single-host operator
  #               box). Recommended for most deployments.
  #   required  — require a token on every mutation, even from
  #               loopback. Recommended when the daemon shares a
  #               host with untrusted users.
  #   disabled  — wide-open mutations, no auth. Equivalent to the
  #               legacy `allow_mutations: true` behaviour. The
  #               daemon logs a warning at startup.
  #
  # token_file is preferred over inline token so the secret doesn't
  # live in config.yaml. The daemon re-reads it on every request so
  # operators can rotate without a restart.
  #
  # trusted_networks is a CIDR allowlist that bypasses the token
  # check under `auto` mode. Loopback (127.0.0.1/32, ::1/128) is
  # implicitly trusted under `auto` and doesn't need to be listed.
  auth:
    mode: "auto"
    # token: "inline-token-here"   # discouraged; use token_file
    # token_file: "../config/api-token"
    # trusted_networks:
    #   - "10.0.0.0/8"
    #   - "192.168.0.0/16"

  # Legacy gate. Setting this to true logs a deprecation warning and
  # maps to `auth.mode: disabled` (mutations wide open). Prefer
  # `auth.mode` for new deployments.
  allow_mutations: false

  # Cross-origin browser access. Off by default — the daemon emits
  # no Access-Control-* headers and rejects WebSocket upgrades whose
  # Origin header isn't on the allow-list. Enable when serving the
  # standalone web UI (the web\ folder under your data root) from a
  # different origin than the daemon. Common values:
  #
  #   - "null"                          allow web UI opened via file://
  #   - "http://laptop.local:8000"      allow a specific static host
  #   - "*"                             allow any origin
  #
  # Browsers send the literal string "null" as the Origin for file://
  # loads, so listing "null" is what enables the easiest LAN
  # deployment (daemon on a Raspberry Pi, web UI as a folder copied
  # to a laptop and opened with a double-click).
  cors:
    allowed_origins: []
    # allowed_origins:
    #   - "null"
    #   - "http://laptop.local:8000"

  # rigctld TCP server. When set, the daemon exposes the control
  # SDR's tuning over the Hamlib rigctld wire protocol on this
  # address — external amateur-radio tooling (Cloudlog, GridTracker,
  # logging programs, satellite trackers) can read and set the
  # daemon's frequency without learning the GopherTrunk REST API.
  # Defaults to off (empty); typical value is "127.0.0.1:4532"
  # (the standard rigctld port). RX-only backend — set_ptt 1 is
  # rejected. Bind to loopback unless the network is trusted; the
  # protocol has no authentication.
  rigctld: ""
  # rigctld: "127.0.0.1:4532"

metrics:
  enabled: true     # mounts /metrics on the HTTP API

storage:
  path: "../data/calls.db"
  cc_cache_file: "../data/cc-cache.json"

recordings:
  dir: "../recordings"
  sample_rate: 8000
  # format: flac             # wav (default, 16-bit mono PCM) | flac (lossless,
  #                          #   ~half the size for speech; web playback, loudness
  #                          #   normalization and MP3 uploads all read it the same)
  # Recording name + folder layout. Both are optional {token} templates.
  # filename_template builds the basename (no extension); empty uses the default
  # "{date}_{time}_{tg}" — e.g. 20260810_230041_1005479 — which drops the
  # timezone offset, source, and timeslot (all still in the .json sidecar).
  # path_template builds the per-call folder tree under `dir`; empty keeps
  # <system>/<talkgroup>/ (and <system>/individual/<id>/ for private calls).
  # Tokens: {date} {time} {datetime} {year} {month} {day} {tg} {alpha} {freq}
  # {src} {ts} {proto} {system} {callid}. Concurrent same-second, same-talkgroup
  # calls get a -2 suffix automatically, so no disambiguator token is required.
  # filename_template: "{date}_{time}_{tg}_{freq}"   # P25-friendly, adds the freq
  # path_template: "{system}/{year}/{month}/{day}"    # trunk-recorder-style date tree
  # Opt-in "sound-good" voice enhancement. When enabled, decoded digital
  # voice is band-limited to the telephone band, warmed, run to a louder
  # AGC target, and (optionally) compressed — shaping BOTH recordings and
  # live monitoring. It trades a little faithfulness for the cleaner/louder
  # sound OP25 / Trunk Recorder / DSDPlus produce. Off by default (faithful,
  # byte-identical output). Toggling enabled also live-applies via
  # PATCH /api/v1/settings (takes effect on the next call). Subsumes the
  # warm_dmr_audio shelf for all protocols when on.
  enhance:
    enabled: false       # master switch for the chain
    hpf_hz: 250          # rumble high-pass corner (default 250; <0 disables)
    lpf_hz: 3400         # band-limit low-pass corner (default 3400, like OP25; <0 disables)
    shelf_hz: 1500       # warmth high-shelf corner (default 1500)
    shelf_db: 2.0        # high-shelf cut above the corner (default 2; 0 disables shelf)
    agc_target: 22000    # louder AGC peak target, int16 units (default 22000; faithful is 18000)
    compress:
      enabled: false     # optional gentle compression for intelligibility
      threshold_db: -18  # gain reduction begins above this level (default -18)
      ratio: 2           # compression ratio (default 2 = 2:1; <=1 disables)
      attack_ms: 5       # envelope attack (default 5)
      release_ms: 80     # envelope release (default 80)
      makeup_db: 0       # fixed post-compression gain (default 0)
  write_raw: true   # also append a .raw sidecar with the vocoder frames
  mbe_files: false  # also write a dsd-fme-playable sidecar per call (.imb for
                    # P25 Phase 1, .amb for DMR/NXDN/P25p2) so recordings can be
                    # decoded offline with `dsd-fme -r <file>`; TETRA/ProVoice/
                    # analog have no dsd-fme playback mode and produce none
  skip_encrypted: false  # don't write files for calls flagged encrypted.
                         # NOTE: true also suppresses the completed-call
                         # broadcast backends (webhook/rdioscanner) for
                         # encrypted calls — keep false to deliver them.
  warm_dmr_audio: false  # opt-in: warmer DMR vocoder (gentle high-shelf, softens the bright software-AMBE+2 timbre; superseded by enhance, DMR only)
  equalizer:
    enabled: false  # CMA blind equalizer in the FM voice chain (simulcast mitigation)
    taps: 8         # default 8 when enabled
    step_size: 0.0001  # default 1e-4 when enabled
  normalize:
    enabled: false       # EBU R128 loudness-normalize each finished recording
    apply_to: recording  # recording (rewrite WAV) | distributed (MP3 only) | both
    target_lufs: -16.0   # integrated-loudness target (default -16 when enabled)
    true_peak_dbtp: -1.5 # true-peak ceiling in dBTP (default -1.5 when enabled)
    max_boost_db: 12.0   # cap on applied gain so quiet calls don't amplify hiss

retention:
  call_log_days: 30   # 0 disables call-log row sweep
  log_days: 30        # 0 disables decoder-log sweep (pager / aprs /
                      #  vessel / dsc / aircraft / mdc1200 / m17 /
                      #  location logs, aged by received_at)
  files_days: 14      # 0 disables filesystem sweep
  interval: "1h"      # how often the sweeper runs

sdr:
  # 200000–20000000 Hz. 2_400_000 is the RTL-SDR sweet spot; RTL dongles
  # enforce their own ~225 kHz floor and cap at 3.2 MHz. Rates outside
  # that window (e.g. a narrow 200_000 capture, or 10_000_000 wideband)
  # are only usable with a source like soapy_remote (USRP, LimeSDR, …).
  sample_rate: 2_400_000
  # watchdog_interval_ms: periodic USB-disconnect watchdog cadence
  # (default 30000 = 30 s). Catches dongles that vanish from the bus
  # while idle and re-acquires them by serial on reappear so the next
  # consumer touches a live handle. Set to -1 to disable entirely on
  # hosts where USB enumeration is intentionally slow. In-stream
  # IQ-death recovery (ccdecoder retry loop, voice Bind reacquire) is
  # unaffected by this knob. See docs/hardware.md.
  watchdog_interval_ms: 30000
  # autotune: track each dongle's carrier-frequency error on locked P25
  # Phase-1 control + voice channels, keep a running average (per device
  # serial), and shift the digital down-converter so the demod's AFC starts
  # near lock. Never touches the hardware ppm — it just logs a suggested
  # ppm/error value you can paste into the device block. Off by default;
  # safe to leave on (the correction stays near zero on a good crystal).
  autotune: false
  devices:
    - serial: "00000001"   # match `gophertrunk sdr list`; first-found wins when blank
      role: control        # control | voice | auto
      ppm: 0               # 0 is fine for TCXO-equipped units like the NESDR Smart v5
      gain: "auto"         # TENTHS of a dB — NOT dB. "496" = 49.6 dB. SDRTrunk/
                           # OP25/gqrx users: multiply your dB figure by 10
                           # (32 dB → "320"). "auto" (AGC) is the safe default.
                           # Run `gophertrunk sdr list --probe` to print each
                           # device's supported gain ladder (tenths of dB).
                           # Typical ranges: RTL-SDR R820T 0–496; Airspy R2/Mini
                           # 0–500 (~0–50 dB, spread across LNA/mixer/VGA);
                           # HackRF One 0–560 (~0–56 dB). HackRF has no true AGC,
                           # so "auto" maps to a fixed LNA 16 / VGA 20 dB split.
      bias_tee: false      # enable the 5V bias-tee output for an external LNA
      # rf_amp: true       # engage the front-end RF amplifier on the "auto"
                           # gain preset (the HackRF's ~14 dB amp). Lowers the
                           # noise figure for weak signals but can overload a
                           # front end near a strong transmitter, so it is off
                           # by default. Manual (positive) gain is unaffected;
                           # ignored, with a warning, on devices without an amp.
      # narrowband_filter: true  # HackRF Pro only: engage the Pro's switchable
                           # narrowband anti-alias filter for tighter adjacent-
                           # channel rejection on narrowband voice (e.g. P25),
                           # trading usable bandwidth. Ignored, with a warning,
                           # on a HackRF One or any board without the filter.
      # fpga_dc_block: true # HackRF Pro only: strip the zero-IF DC-offset spike
                           # in the FPGA before samples leave the device — a
                           # hardware alternative to the P25 voice path's
                           # software DC-block that also cleans the control
                           # channel. Ignored, with a warning, on other boards.
      # dc_avoid: true     # control OR voice role: tune the LO off-channel and
                           # mix the channel back to baseband, off the front-end
                           # DC spur, 1/f noise and the I/Q image (the offset
                           # tuning SDRTrunk/OP25 use). On control it moves the
                           # control channel; on voice each granted call is
                           # offset-tuned and mixed back per-call. Off by
                           # default. Confirm the tsbk-crc/nid-bch error rates
                           # drop (control) or voice grants decode LDUs (voice)
                           # while the channel stays locked (issue #402).
      # dc_avoid_offset_hz: 0  # LO offset in Hz for dc_avoid; 0 auto-selects
                           # sample_rate/4. Must be < sample_rate/2; ignored when
                           # dc_avoid is false or the delivered rate is at/below
                           # the channel rate.
      # blog_v4: true      # force RTL-SDR Blog V4 mode (28.8 MHz xtal + input
                           # routing) if the V4's USB strings don't auto-identify
                           # it and every frequency mistunes by ~1.8× (issue #264).
                           # Add `blog_v4_lite: true` instead on a V4L.
    - serial: "00000002"
      role: voice
      ppm: 0
      gain: "auto"
      bias_tee: false

    # role: wideband pins one dongle to a centre frequency and lets a
    # single SDR cover several carriers that all live inside its
    # IQ bandwidth (typically a 2.4 MHz cluster of carriers in the
    # same band). The list of channel frequencies is set per-dongle,
    # alongside the trunking.systems entry they decode against. The
    # daemon uses internal/dsp/tuner to extract a separate narrow-
    # band stream per channel - no extra hardware needed.
    #
    # Each channel references a trunking.systems entry whose protocol
    # determines the state machine:
    #   protocol: dmr-tier2   → Tier II conventional carrier
    #   protocol: dmr         → DMR Tier III trunked control channel
    #                           (frequency_hz must be in the system's
    #                           control_channels list)
    #   protocol: p25         → P25 Phase 1 trunked control channel
    #                           (frequency_hz must be in
    #                           control_channels; respects the
    #                           system's p25_phase1_demod_mode for
    #                           C4FM vs CQPSK/LSM, or a per-channel
    #                           p25_phase1_demod_mode override when
    #                           sites of one system differ in
    #                           modulation — see below, issue #935)
    #   protocol: p25-phase2  → P25 Phase 2 trunked control channel
    #                           (frequency_hz must be in
    #                           control_channels; respects the
    #                           per-system p25_phase2_* mode keys)
    #   protocol: nxdn        → NXDN trunked control channel (RCCH)
    #                           (frequency_hz must be in
    #                           control_channels; respects the
    #                           per-system nxdn_* keys)
    #
    # Channels of any supported protocol can mix on the same dongle.
    # Trunked CC channels (dmr / p25 / p25-phase2) decode the control
    # channel only; voice grants still route to the daemon's physical
    # voice pool (a role: voice SDR alongside the wideband dongle).
    #
    # MULTI-SITE P25: to monitor several SITES of one P25 system at once,
    # list each site's control channel as its own channels: entry (all
    # pointing at the same system). Every tap decodes in parallel out of
    # the one capture — they are NOT hunted one-at-a-time. Per-site names
    # come from the system's sites: mapping (RFSS/Site → name) further down.
    #
    # PER-SITE MODULATION (issue #935): sites of one P25 system can use
    # different modulation — a site that genuinely transmits linear/CQPSK
    # (Linear Simulcast Modulation, LSM) alongside sites on C4FM. Set the
    # system's p25_phase1_demod_mode to the modulation MOST sites use,
    # then add a per-channel `p25_phase1_demod_mode:` on the exceptions.
    # A blank / absent per-channel value inherits the system default. The
    # override drives both the control-channel decode AND the voice grants
    # that tap issues, so a granted call on a CQPSK site is decoded on the
    # linear path too (a C4FM demod can't recover a linearly-modulated
    # signal — the CC would show control_channel_decode_quality: poor and
    # voice grants would time out without an LDU).
    #
    # IMPORTANT — do NOT set cqpsk just because a site is SIMULCAST.
    # Simulcast is a transmitter-coordination technique, not a modulation:
    # most simulcast systems transmit plain C4FM (Victoria's MMR, every
    # site including its multi-tower CBD simulcast, is C4FM — forcing
    # CQPSK there kills the decode). You cannot infer the modulation from
    # the fact a site is simulcast, nor from emission-designator/licensing
    # data (e.g. "10K1D7W" covers both C4FM and CQPSK). Determine it
    # empirically: leave it at C4FM, and switch a channel to cqpsk only if
    # a strong, clean signal will not lock in C4FM.
    #
    # SHARED FRONT END (issue #749): every tap on a dongle shares one
    # antenna, one centre frequency and one gain. The channelizer is
    # gain-flat across taps, so if one site decodes and its siblings sit at
    # the noise floor, that is real RF — a weak/distant site at this centre
    # and gain, or (just as common) a STRONG site overloading the shared
    # ADC and raising the noise floor for everything else. Symptoms and fix:
    #   - Watch each tap's level on gophertrunk_sdr_iq_power_dbfs (labelled
    #     "<system> @ <freq> MHz") and the whole capture on
    #     gophertrunk_sdr_wideband_input_iq_power_dbfs /
    #     gophertrunk_sdr_wideband_input_clip_ratio. A tap far below the input
    #     power, or a non-zero input clip ratio, is logged as a throttled WARN too.
    #   - If the input clip ratio is non-zero, LOWER the gain or add
    #     attenuation (do NOT raise gain) — a hot site is desensitising the
    #     receiver. Set gain in TENTHS of a dB ("gain: 600" = 60 dB, which
    #     is very high for a wideband capture; try a lower value first).
    #   - PREFER `gain: "auto"` (AGC) when one dongle hosts more than one
    #     site of differing strength. A single FIXED gain can't serve them
    #     all: a value chosen so the strongest site doesn't clip leaves the
    #     weaker co-tenants under-amplified, dead and flat at the ADC floor
    #     (the receiver's own AGC can't recover SNR lost at the converter).
    #     AGC lets the front end run the band hot enough for weak sites to
    #     clear the floor — the single biggest lever for a multi-site
    #     wideband cluster (issue #749). The daemon logs a startup WARN when
    #     a multi-tap wideband dongle is pinned to a fixed gain.
    #   - A genuinely weak distant site may simply not survive a shared
    #     capture optimised for a stronger one even under AGC — give it a
    #     dedicated dongle (role: control or its own role: wideband) if it
    #     matters.
    #
    # Constraints (validated at load time):
    #   - serial must match a discovered dongle
    #   - every channel frequency_hz must be within
    #     center_freq_hz ± sample_rate/2 with a 5% guard at each edge
    #   - each referenced system must be declared in trunking.systems
    #     below with one of the supported protocols listed above
    #
    # tuner_strategy:
    #   auto       (default) - ddc for ≤ 6 channels, polyphase above
    #   ddc        - one NCO mixer + rational resampler per channel
    #   polyphase  - shared polyphase channelizer + fine-tune DDC
    #
    # - serial: "00000003"
    #   role: wideband
    #   gain: "auto"
    #   center_freq_hz: 453_500_000
    #   tuner_strategy: auto
    #   channels:
    #     - frequency_hz: 453_125_000
    #       system: "regional-dmr-t2"
    #     - frequency_hz: 453_275_000
    #       system: "regional-dmr-t2"
    #     - frequency_hz: 453_775_000
    #       system: "regional-dmr-t2"
    #     - frequency_hz: 454_100_000
    #       system: "regional-dmr-t2"
    #
    # And a T3 CC tap on the same (or another) wideband dongle:
    # - serial: "00000004"
    #   role: wideband
    #   center_freq_hz: 851_500_000
    #   channels:
    #     - frequency_hz: 851_037_500
    #       system: "regional-dmr-t3"
    #
    # P25 Phase 1 control channel on a wideband dongle. The
    # referenced system carries `protocol: p25` and the
    # channel's frequency_hz must appear in its control_channels.
    # Honours `p25_phase1_demod_mode` (c4fm vs cqpsk/LSM) on the
    # system entry just like a dedicated CC dongle.
    #
    # MULTIPLE SITES IN PARALLEL (issue #749): a P25 system with
    # several sites — each broadcasting its own control channel —
    # decodes all of them SIMULTANEOUSLY when you list each site's
    # control channel as a separate `channels:` entry on a wideband
    # dongle (on the same dongle if they fit one IQ window, or split
    # across dongles otherwise). Each channel gets its own tap +
    # Phase 1 state machine, so every site locks and grants
    # independently — no taking turns. Any control-channel frequency
    # hosted this way is automatically excluded from the sequential,
    # single-tuner cc-hunt below, so a wideband site is never starved
    # by the round-robin hunter. Example: all four sites of "MMR"
    # decoded at once from one Airspy. System "MMR" is C4FM on every
    # site (including its multi-tower CBD simulcast), so it just uses the
    # system default and needs no per-channel override:
    # - serial: "AIRSPY SN:637862DC2E8449D7"
    #   role: wideband
    #   center_freq_hz: 420_900_000
    #   voice_taps: 4
    #   channels:
    #     - frequency_hz: 420_012_500   # Melbourne / CBD (C4FM simulcast)
    #       system: "MMR"
    #     - frequency_hz: 420_037_500   # 120 Collins Street (C4FM simulcast)
    #       system: "MMR"
    #     - frequency_hz: 420_087_500   # Mt Anakie (C4FM)
    #       system: "MMR"
    #     - frequency_hz: 421_837_500   # Mt Blackwood (C4FM)
    #       system: "MMR"
    #
    # The per-channel cqpsk override (issue #935) is for a DIFFERENT case:
    # a system that actually mixes modulations — most sites C4FM, but one
    # or two proven (empirically — C4FM won't lock a strong signal) to
    # transmit linear/CQPSK. Then, and only then:
    #   channels:
    #     - frequency_hz: 460_100_000   # C4FM site — inherits system default
    #       system: "mixed-p25"
    #     - frequency_hz: 460_350_000   # confirmed-CQPSK site — override
    #       system: "mixed-p25"
    #       p25_phase1_demod_mode: cqpsk
    # (List every one of these frequencies in the system's
    # control_channels too — see the systems section below — and add a
    # `sites:` mapping there to give each RFSS/Site a human name.)
    #
    # `voice_taps: N` (0 disables; no hard upper bound) lets the
    # same SDR host N concurrent voice grants without a separate
    # `role: voice` dongle: each grant whose frequency falls inside
    # the wideband IQ window gets its own per-call DDC tap on this
    # dongle's IQ stream. CPU scales ~linearly per tap, so the daemon
    # logs a warning above 16 to catch an accidental large value.
    # Out-of-window grants spill over to a physical voice SDR
    # when one is configured, or drop with the standard
    # "no voice device available" log otherwise. This works for
    # P25 Phase 1/2 and DMR Tier III alike — but a DMR Tier III
    # system needs a `dmr_band_plan` (see the systems section) so
    # the decoder can turn each grant's LCN into a frequency.
    #
    # `signalling_taps: N` (0 disables) is the P25 Phase 2 talker-alias
    # harvester: it allocates N signalling-only DDC taps that decode the
    # FACCH-S MAC signalling on granted traffic channels and publish the
    # talker alias, independent of the voice pool. On a busy multi-site
    # Phase 2 system most grants never get a voice tap (and encrypted
    # calls are torn down before hangtime), so the alias decode wired
    # into the voice chain almost never runs — these taps harvest it off
    # the signalling stream instead, the way SDRTrunk does (#376). Set
    # 2-4 on such a system; CPU scales ~linearly per tap (warns above 16),
    # and out-of-window grants are skipped.
    # - serial: "00000005"
    #   role: wideband
    #   center_freq_hz: 851_500_000
    #   voice_taps: 4
    #   signalling_taps: 4   # P25 Phase 2 talker-alias harvest (#376)
    #   channels:
    #     - frequency_hz: 851_037_500
    #       system: "regional-p25"
    #
    # DMR Tier III voice on a wideband dongle: identical wiring,
    # just point the channel at a `protocol: dmr` system that
    # carries a `dmr_band_plan`. The CC tap decodes the CSBK chain
    # and each voice grant lands on a voice_taps DDC tap.
    # - serial: "00000007"
    #   role: wideband
    #   center_freq_hz: 851_500_000
    #   voice_taps: 4
    #   channels:
    #     - frequency_hz: 851_037_500
    #       system: "regional-dmr-t3"
    #
    # P25 Phase 2 control channel on a wideband dongle. The
    # referenced system carries `protocol: p25-phase2`; the
    # `p25_phase2_*` mode knobs (trellis / RS / interleave /
    # scrambler / clock) on the system apply transparently.
    # - serial: "00000006"
    #   role: wideband
    #   center_freq_hz: 851_500_000
    #   channels:
    #     - frequency_hz: 851_006_250
    #       system: "regional-p25-p2"

  # rtl_tcp remote SDRs. Each entry mounts a host:port rtl_tcp server
  # as a virtual tuner alongside any local USB dongles. Use when the
  # SDR hardware lives on a different host from the daemon (e.g. a
  # Raspberry Pi at the antenna + a beefier box for decode). rtl_tcp
  # is plaintext — keep it on trusted networks or behind an SSH /
  # WireGuard tunnel.
  #
  # rtl_tcp:
  #   - addr: "192.168.1.50:1234"
  #     serial: "antenna-pi"   # generator fills this from addr if blank
  #     role: control           # control | voice | auto
  #     ppm: 0
  #     gain: "auto"            # "auto" or tenths-of-dB ("496" = 49.6 dB)
  #     bias_tee: false
  #     connect_timeout_ms: 3000

  # SoapySDRServer remote SDRs. Each entry mounts a host:port
  # SoapySDRServer (from pothosware/SoapyRemote) as a virtual tuner.
  # Unlike rtl_tcp's hardcoded 8-bit stream, SoapyRemote carries the
  # full dynamic range of high-end hardware — USRP, LimeSDR, bladeRF,
  # HackRF, Airspy, RTL-SDR, SDRplay — as 16-bit (CS16) or 32-bit
  # float (CF32) IQ, with native frequency / sample-rate / gain
  # control. Run `SoapySDRServer --bind` on the host with the radio.
  # Plaintext like rtl_tcp — keep it on trusted networks or behind a
  # tunnel.
  #
  # soapy_remote:
  #   - addr: "192.168.1.60:55132"  # bare host gets :55132 appended
  #     driver: "uhd"               # SoapySDR device key: uhd | lime |
  #                                 #  bladerf | hackrf | airspy | rtlsdr
  #                                 #  (blank = server's first device)
  #     args: ""                    # extra make() kwargs, "k=v,k=v" (merged
  #                                 #  with driver); e.g. for a USRP TwinRX:
  #                                 #  "rx_subdev_spec=A:0,antenna=RX1"
  #     master_clock_rate: 0        # USRP master/reference clock in Hz. A USRP
  #                                 #  only streams integer decimations of this
  #                                 #  clock, so set it to make your sample_rate
  #                                 #  an exact divisor and avoid UHD coercing
  #                                 #  to a nearby rate. B210: 61_440_000 makes
  #                                 #  sample_rate 6_144_000 exact (÷10). X310's
  #                                 #  default 200 MHz already divides 6_250_000
  #                                 #  (÷32) cleanly, so leave it 0. Shorthand
  #                                 #  for master_clock_rate=… in args.
  #     serial: "usrp-roof"         # generator fills this from addr if blank
  #     role: control               # control | voice | auto
  #     format: "CS16"              # CS16 (16-bit, default) or CF32 (float)
  #     stream_protocol: "tcp"      # tcp (default/only for now)
  #     stream_mtu: 0               # stream endpoint MTU in bytes, sent as the
  #                                 #  remote:mtu stream arg (NOT a make() arg,
  #                                 #  so it can't go in args). 0 = SoapyRemote
  #                                 #  default 1500; raise (e.g. 8192) on
  #                                 #  jumbo-frame / high-throughput links.
  #     stream_window: 0            # stream flow-control window in bytes, sent
  #                                 #  as the remote:window stream arg (also not
  #                                 #  a make() arg). 0 = client default 8 MiB;
  #                                 #  raise on high-latency / high-bandwidth
  #                                 #  links. Must be >= stream_mtu.
  #     ppm: 0                      # best-effort (driver-dependent)
  #     gain: "auto"                # "auto" or tenths-of-dB ("300" = 30.0 dB)
  #     bias_tee: false             # best-effort (driver-dependent)
  #     connect_timeout_ms: 3000
  #     diversity: ""               # "" (single channel) or "mrc" — opens RX0+RX1
  #                                 #  and phase-coherently combines them into one
  #                                 #  maximised-SNR stream, re-estimating the
  #                                 #  branch gain from the stream so it suits a
  #                                 #  shared-LO front end (B210) and separate
  #                                 #  daughterboards with independent PLLs (X310
  #                                 #  + 2x TwinRX) alike. "mrc-static" freezes
  #                                 #  the gain after one estimate (the
  #                                 #  pre-tracking behaviour), for A/B.
  #                                 #  Whether it is doing anything shows up as
  #                                 #  "coherence" in the periodic MRC log line —
  #                                 #  that figure is independent of RF gain, so
  #                                 #  raising gain to make diversity engage is
  #                                 #  never the answer. Experimental.
  #     antenna: []                 # RX antenna port per channel, in order.
  #                                 #  antenna: [RX1] pins a single (non-diversity)
  #                                 #  receiver's port; antenna: [RX1, RX2] assigns
  #                                 #  RX1->channel 0, RX2->channel 1 for a USRP
  #                                 #  X310 under diversity: mrc. Port names are
  #                                 #  device-specific (a B210 has TX/RX and RX2; a
  #                                 #  TwinRX has RX1 and RX2) and are checked
  #                                 #  against the device. Use this, NOT antenna= in
  #                                 #  args: an antenna= there only reaches make()
  #                                 #  and never selects the per-channel port (it is
  #                                 #  rejected). "antennas:" is the legacy alias.
  #                                 #  Empty = device default.
  #     diversity_capture: ""       # path PREFIX for a one-shot dump of the
  #                                 #  PRE-combine per-branch IQ: <prefix>.br0.cs16,
  #                                 #  <prefix>.br1.cs16, <prefix>.diversity.json.
  #                                 #  Every other IQ tap is post-combine, so this
  #                                 #  is the only capture that can be replayed
  #                                 #  through a different combiner. Needs mrc.
  #     diversity_capture_seconds: 0 # length of that dump, 1..120 (0 = 5 s). Two
  #                                 #  CS16 branches run to tens of MB/s at high
  #                                 #  rates; a 1 GiB/branch cap always applies.
  #     verbose_debug: false        # log every control-channel RPC to this
  #                                 #  server — decoded call name and arguments
  #                                 #  plus a hex dump of the frame — at DEBUG.
  #                                 #  The SoapyRemote wire carries no schema, so
  #                                 #  a server-side "~SoapyRPCUnpacker:
  #                                 #  Unconsumed payload bytes N" never says
  #                                 #  WHICH call was mis-shaped; this is the
  #                                 #  other half of that conversation. Needs
  #                                 #  log.level: debug. Diagnostic only.

  # Sidecar endpoints: an external process that owns a radio and streams raw
  # IQ to GopherTrunk. Anything can be a sidecar — a UHD/RFNoC program, a GNU
  # Radio flowgraph, a vendor tool with no SoapySDR support — which is the
  # point: hardware and DSP that would need CGO stay out of GopherTrunk's
  # process while it still sees a real tuner. The stream is bare interleaved
  # IQ (exactly what `gophertrunk replay -format cs16` reads), and tuning goes
  # the other way as 5-byte UDP commands whose opcodes are rtl_tcp's, so a
  # tool that already speaks rtl_tcp works unmodified. See
  # docs/reference/sdr-sidecar.md for the wire format.
  #
  # sidecar:
  #   - transport: "tcp"            # unix_pipe | tcp | udp (default tcp).
  #                                 #  unix_pipe is POSIX-only.
  #     data_addr: "127.0.0.1:5001" # FIFO path for unix_pipe, host:port
  #                                 #  for tcp/udp. Required.
  #     control_addr: "127.0.0.1:4001" # the sidecar's UDP command socket.
  #                                 #  Empty = the sidecar owns tuning and
  #                                 #  GopherTrunk's setters do nothing, so a
  #                                 #  trunked system cannot follow grants.
  #     format: "cs16"              # cs16 (default) | complex64
  #     sample_rate_hz: 2400000     # REQUIRED — the stream carries no
  #                                 #  metadata, so a wrong value mis-sizes
  #                                 #  every filter and mis-tunes every channel.
  #     freq_min_hz: 70000000       # tuning range, for the hunt sweep.
  #     freq_max_hz: 6000000000     #  Both 0 = unknown.
  #     serial: "uhd-b210-sidecar"  # virtual serial; empty derives one.
  #     role: "auto"                # control | voice | auto
  #     gain: "auto"                # "auto" or tenths-of-dB ("300" = 30.0 dB)
  #     connect_timeout_ms: 3000    # TCP dial / FIFO open bound. A FIFO open
  #                                 #  blocks until a writer attaches, so this
  #                                 #  is what stops a sidecar that never
  #                                 #  starts from hanging the daemon.

  # ka9q-radio channels. radiod (https://github.com/ka9q/ka9q-radio)
  # runs fast-convolution downconverters on a front end (RX888, Airspy,
  # RTL-SDR, …) and multicasts each channel as RTP/IP. A channel in raw
  # "linear" IQ mode (output_channels = 2) streams interleaved complex
  # samples GopherTrunk can demodulate directly, so one well-sited radiod
  # can feed many decoders across a LAN. Each entry mounts one channel,
  # addressed by its RTP SSRC. The driver polls radiod's status multicast
  # group (port 5006) to discover the channel's IQ multicast group,
  # sample rate and encoding, and resolves `.local` instance names via
  # mDNS. Pre-configure the channel in radiod@.conf; this consumes (and
  # retunes) an existing channel. Plaintext multicast — trusted LANs only.
  #
  # ka9q_radio:
  #   - addr: "hf.local"            # status+command group: mDNS name or
  #                                 #  literal "239.x.x.x:5006" (default :5006)
  #     ssrc: 162550                # channel's RTP SSRC (required, non-zero)
  #     serial: "ka9q-wx"           # generator fills this from addr+ssrc if blank
  #     role: control               # control | voice | auto
  #     # The fields below are optional overrides that skip the status poll.
  #     # Leave them blank to auto-discover everything from radiod.
  #     data: ""                    # pin IQ group "239.x.x.x:5004" (default :5004)
  #     sample_rate: 0              # pin channel IQ rate in Hz
  #     encoding: ""                # pin wire encoding: s16be|s16le|f32le|f32be
  #     channels: 0                 # pin output channels (2 for raw IQ)
  #     connect_timeout_ms: 3000

# Paging decoders. The pocsag / flex lists each dedicate one SDR to a
# single paging frequency: the SDR is tuned directly to FrequencyHz
# (full sample-rate IQ, no DDC). The wideband list groups several
# paging channels (any mix of POCSAG / FLEX) onto ONE SDR — the daemon
# tunes the dongle to a center frequency and a digital down-converter
# splits out each channel, so two pagers a few hundred kHz apart fit on
# one stick. All three share the pager_log table / panel; rows are
# tagged protocol=pocsag or protocol=flex.
#
# NOTE: paging (and the other message decoders: aprs, ais, dsc,
# mdc1200, m17) surface decoded messages only through the SQLite
# log. You must set a `storage:` section (see the storage example
# above) — without it the decoder runs but /api/v1/pager/messages
# returns 503 and the web panel stays empty.
#
# paging:
#   pocsag:
#     - serial: "antenna-pi"       # SDR serial (must be in sdr.devices
#                                  #  or sdr.rtl_tcp)
#       frequency_hz: 152_007_500  # local commercial paging / fire
#                                  #  dispatch / DAPNET / etc.
#       baud_hz: 1200              # 512 / 1200 / 2400; default 1200
#   flex:                          # Motorola FLEX (1600 bps / 2-level)
#     - serial: "antenna-pi2"      # SDR serial; shares the pager_log
#                                  #  table / panel, tagged protocol=flex
#       frequency_hz: 929_612_500  # local FLEX paging channel
#   wideband:                      # two pagers on one dongle via DDC
#     - serial: "pager-sdr"        # single SDR for the whole group
#       center_freq_hz: 153_187_500 # optional; auto = midpoint of the
#                                  #  channel freqs when omitted / 0
#       channels:                  # each freq must sit within the
#                                  #  dongle's IQ window (center ±
#                                  #  sample_rate/2, minus a 5% guard)
#         - protocol: flex
#           frequency_hz: 153_025_000
#         - protocol: pocsag
#           frequency_hz: 153_350_000
#           baud_hz: 1200

# APRS / AX.25 Bell-202 AFSK receiver. Each entry pins one SDR to
# an APRS frequency and runs the full DSP pipeline (FM demod →
# FFSK tone discriminator → symbol-time recovery → NRZI decode →
# HDLC framer → AX.25 + APRS info-field parser). Decoded packets
# publish on events.KindAPRSPacket; storage.APRSLog persists them
# to the aprs_log SQLite table, the REST endpoint at
# /api/v1/aprs/packets returns the most recent N, and the /aprs
# web panel renders them live with the FCS state highlighted.
#
# aprs:
#   channels:
#     - serial: "antenna-pi"          # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp)
#       frequency_hz: 144_390_000     # NA primary; EU R1 144.575,
#                                     #  ISS digipeater 145.825
#       drop_bad_fcs: false           # true to silently drop CRC-failed
#                                     #  frames instead of publishing
#                                     #  them with FCSOK=false
#       drop_non_ui: false            # true to silently drop non-UI
#                                     #  AX.25 frames

# AIS / marine-vessel GMSK receiver. Each entry pins one SDR to
# an AIS channel (87B = 161.975 MHz or 88B = 162.025 MHz; Class A
# vessels alternate between them every second, so pinning one SDR
# to each captures both halves). Pipeline: FM demod → GFSK matched
# filter (BT = 0.4) → symbol-timing recovery → NRZI decode →
# HDLC framer → CRC validation → ITU-R M.1371-5 message parser.
# Decoded messages publish on events.KindAISMessage;
# storage.VesselLog persists them to the vessel_log SQLite table,
# the REST endpoint at /api/v1/ais/vessels returns the most
# recent N, and the /ais web panel renders them live.
#
# ais:
#   channels:
#     - serial: "marine-antenna"      # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp)
#       frequency_hz: 161_975_000     # AIS channel 87B (or 162_025_000 = 88B)
#       drop_bad_fcs: false           # true to silently drop CRC-failed
#                                     #  messages instead of publishing
#                                     #  them with FCSOK=false
#       drop_non_position: false      # true to drop static-data / base-
#                                     #  station / channel-management
#                                     #  messages and keep only vessel
#                                     #  position reports

# MDC1200 Motorola FFSK signaling. Each entry pins one SDR to a
# conventional analog VHF / UHF voice channel and decodes the
# in-band data bursts Motorola radios key at the head (and tail) of
# a transmission. Pipeline: FM demod → FFSK discriminator (CCIR
# tones, mark 1200 Hz / space 1800 Hz, 1200 baud) → symbol-timing
# recovery → NRZ slicer → 40-bit sync framer → op/arg/unit-ID
# parser with CRC check. Decoded bursts publish on
# events.KindMDC1200Message; storage.MDC1200Log persists them to the
# mdc1200_log SQLite table, the REST endpoint at
# /api/v1/mdc1200/messages returns the most recent N, and the
# /mdc1200 web panel renders them live (unit IDs, PTT ANI, emergency
# / status / radio-check signaling).
#
# mdc1200:
#   channels:
#     - serial: "vhf-antenna"         # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp)
#       frequency_hz: 154_000_000     # conventional analog voice channel
#                                     #  carrying Motorola signaling
#       drop_bad_crc: false           # true to silently drop CRC-failed
#                                     #  bursts instead of publishing them
#                                     #  with crc_ok=false

# DSC marine distress / safety / routine calls. Each entry pins one
# SDR to a DSC channel and decodes the calls. Pipeline: FM demod →
# FFSK discriminator (DSC tones, mark 1300 Hz / space 2100 Hz,
# 1200 baud) → symbol-timing recovery → direct-FSK slicer →
# BCH(10,7) character sync → ITU-R M.493 sequence parser. Decoded
# sequences publish on events.KindDSCMessage; storage.DSCLog
# persists them to the dsc_log SQLite table, the REST endpoint at
# /api/v1/dsc/messages returns the most recent N, and the /dsc web
# panel renders them live (distress alerts, MMSIs, positions).
#
# dsc:
#   channels:
#     - serial: "marine-antenna"      # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp)
#       frequency_hz: 156_525_000     # marine VHF channel 70 (or one of
#                                     #  the HF DSC channels: 2_187_500,
#                                     #  8_414_500, 12_577_000, 16_804_500)
#       drop_bad_fcs: false           # true to silently drop sequences
#                                     #  with a BCH-failed character instead
#                                     #  of publishing them flagged

# ADS-B / aviation. Two ways to feed the aircraft panel; mix freely,
# their frames merge into one stream.
#
#  1. beast_upstreams — consume a separately-running dump1090 / readsb /
#     BeastSplitter / commercial hub over the BEAST TCP protocol. Most
#     existing 1090 MHz chains already run one against a dedicated
#     RTL-SDR (with a 1090 MHz filter + LNA).
#  2. channels — native PPM demod: pin one of GopherTrunk's own SDRs to
#     1090 MHz and decode Mode-S straight off the air, no external
#     decoder. A 1090 MHz SAW filter + LNA ahead of the SDR is strongly
#     recommended, and the SDR must sample at >= 2 Msps (the receiver
#     resamples to 2 Msps internally).
#
# adsb:
#   beast_upstreams:
#     - addr: "127.0.0.1:30005"       # dump1090 / readsb default BEAST port
#       name: "local-dump1090"        # logged on every reconnect
#     - addr: "antenna-pi.lan:30005"  # remote pi-at-the-antenna setup
#       name: "rooftop"
#   channels:
#     - serial: "1090-antenna"        # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp), sampling >= 2 Msps
#       frequency_hz: 1_090_000_000   # 1090 MHz (the default when omitted)

# M17 digital voice (link-layer metadata). Each entry pins one SDR to
# an M17 frequency and decodes the link setup — source / destination
# callsigns and mode — via the stream-frame LICH path. Publishes on
# events.KindM17LinkSetup; storage.M17Log persists to the m17_log
# table, GET /api/v1/m17/linksetups returns recent rows. Codec2 voice
# decode is a planned follow-up.
#
# m17:
#   channels:
#     - serial: "vhf-antenna"         # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp)
#       frequency_hz: 144_975_000     # 2 m M17 simplex calling
#                                     #  (region-dependent; 433_475_000 on 70 cm)

# LoRa wide-band decoder. Each entry pins one SDR to an ISM centre
# frequency and splits its IQ band into parallel LoRa sub-channels, each
# running a dechirp/FFT demodulator with spreading-factor auto-detection.
# Publishes on events.KindLoRaFrame; storage.LoRaLog persists to the
# lora_log table, GET /api/v1/lora/frames returns recent rows, and the
# /lora web panel renders them live. A sub-channel with sync_word 0x34
# is treated as LoRaWAN — the MAC layer is parsed and, when matching
# session keys are supplied below, the MIC is verified and the payload
# decrypted (GopherTrunk performs no key recovery).
#
# lora:
#   channels:
#     - serial: "915-antenna"         # SDR serial (must be in sdr.devices
#                                     #  or sdr.rtl_tcp), sampling >= 2 Msps
#       center_hz: 915_000_000        # US ISM (868_000_000 in EU)
#       bandwidth: 125_000            # 125k | 250k | 500k (per BW class)
#       oversample: 2                 # samples per chip (default 2)
#       sub_channels:
#         - offset_hz: -200_000       # carrier offset from center_hz
#           spreading_factor: 0       # 0 = auto-detect SF7..12; or pin 7..12
#           sync_word: 0x12           # 0x12 private, 0x34 LoRaWAN
#           low_data_rate_optimize: auto  # auto (Ts>=16ms: SF11/12@125k,
#                                     #  SF12@250k) | on | off
#           label: "LoRa 914.8"
#         - offset_hz: 300_000
#           spreading_factor: 7
#           sync_word: 0x34           # LoRaWAN public network
#           label: "LoRaWAN 915.3"
#       lorawan_keys:                 # optional — enables MIC + decrypt
#         - dev_addr: "26011BDA"
#           nwk_skey: "0102030405060708090A0B0C0D0E0F10"
#           app_skey: "A0A1A2A3A4A5A6A7A8A9AAABACADAEAF"

trunking:
  # call_timeout_ms: inactivity window after which the engine's
  # watchdog ends a call (publishes CallEnd with EndReasonTimeout
  # and releases the bound voice SDR). The watchdog only fires
  # when no voice frames have been decoded for this long. Default
  # 30000 (30 s) when omitted or zero. Lower it on clean systems
  # for snappier teardown; raise it on chatty systems with long
  # transmission pauses. Issue #356.
  call_timeout_ms: 30000

  # voice_hangtime_ms: universal "end of transmission" window applied to
  # EVERY voice protocol (FM, DMR, P25 Phase 1 / 2). Once a call has
  # decoded voice, the recording is ended this long after the last voice
  # frame — keeping recordings tightly bounded to the actual
  # transmission instead of waiting out call_timeout_ms. Default 3500
  # (3.5 s) when omitted or zero.
  voice_hangtime_ms: 3500

  # voice_call_grouping: how voice recordings are split, for every
  # protocol.
  #   "transmission" (default) — one file per over/PTT; the recording
  #     rolls to a fresh file at each end-of-transmission boundary
  #     (e.g. a P25 terminator). Best when voice frequencies are shared
  #     between talkgroups.
  #   "conversation" — keep consecutive overs of the same talkgroup in
  #     one file; split only when a different talkgroup takes the
  #     frequency or the channel goes idle past voice_hangtime_ms.
  # In both modes, audio from a different talkgroup on a shared voice
  # frequency is never appended to the wrong recording.
  voice_call_grouping: "transmission"

  systems:
    - name: "Example-P25"
      protocol: p25
      # control_channels lists every candidate control channel for the
      # system. How they are used depends on the SDR topology:
      #   * Single-tuner deployment (a `role: control` dongle): the
      #     cc-hunt supervisor treats them as ALTERNATES — it hunts them
      #     in turn and locks the first that works, staying sticky to the
      #     last lock (persisted in cc-cache.json). Only one is decoded at
      #     a time, which is correct when the entries are standby CCs for
      #     ONE site.
      #   * Multi-site / wideband deployment: if a system spans several
      #     SITES (each with its own control channel) and you want them
      #     decoded SIMULTANEOUSLY, list each site's control channel here
      #     AND as a `channels:` entry on a `role: wideband` dongle (see
      #     the SDR section). The wideband path decodes them all in
      #     parallel and those frequencies are dropped from the sequential
      #     cc-hunt, so no site is starved (issue #749). Pair this with the
      #     `sites:` mapping below to label each RFSS/Site.
      control_channels:
        - 851_000_000
        - 852_000_000
      talkgroup_file: "../config/talkgroups-p25.csv"
      # Optional per-system radio-ID alias catalogue — the per-RID
      # equivalent of talkgroup_file. CSV (Decimal/DEC/ID column +
      # optional Alias/Description/Tag/Group/Owner/Priority/Lockout/
      # Watch/Icon) or JSON (array of {id, alias, ...} objects) is
      # accepted, dispatched by file extension. Leave commented out
      # to let the affiliation tracker surface RIDs live without any
      # operator-configured aliases.
      # rid_alias_file: "../config/rids-p25.csv"
      # Optional human-readable names for the P25 sites of this system,
      # keyed by their RFSS and Site IDs (issue #698). GT discovers a
      # site's RFSS/Site from the control channel; these names are pure
      # presentation metadata merged into GET /api/v1/sites so a site
      # reads as a place rather than a pair of integers. Grants on the
      # SSE stream also carry rfss_id/site_id so consumers can label
      # metrics by site. Omit to surface discovered sites without names.
      # sites:
      #   - rfss: 1
      #     site: 1
      #     name: "Mt Anakie"
      #   - rfss: 2
      #     site: 9
      #     name: "Murradoc Hill"
      #
      # encrypted_calls: how scarce voice SDRs are allocated to encrypted
      # calls on THIS system, so encrypted traffic can't monopolize a small
      # tuner pool and starve clear calls (issue #711). Per-system, so you
      # can run "metadata" on one system and "follow"/"ignore" on another.
      # Encryption is detected from the grant (P25 Phase 2) or mid-call on
      # the traffic channel (P25 Phase 1 LDU2, Phase 2 MAC PDUs).
      #   mode:
      #     follow   (default) — hold a voice SDR for the full encrypted
      #                call, exactly like a clear call.
      #     metadata — follow the call briefly so traffic-channel metadata
      #                (talker alias, source RID, encryption sync) is
      #                captured, then release the voice SDR. The release
      #                fires as soon as the talker alias completes, or after
      #                metadata_follow_ms, whichever comes first.
      #     ignore   — never tie up a voice SDR on an encrypted call.
      #   metadata_follow_ms: metadata mode only — how long (ms) to follow an
      #     encrypted call after it is known encrypted before releasing the
      #     voice SDR. 0 uses the engine default (1500 ms). On P25 Phase 2 the
      #     talker alias arrives during call hangtime, so allow 1500-2000 ms
      #     to catch the full alias block sequence.
      # A call whose key_id matches a configured encryption_keys entry below
      # is exempt and always followed (you intend to capture / decode it).
      # Note GopherTrunk does not decrypt P25 in-process; only DMR rc4
      # (Enhanced Privacy) keys are accepted, and only for out-of-band
      # capture.
      # encrypted_calls:
      #   mode: metadata
      #   metadata_follow_ms: 1500

    # DMR Tier III trunked system. A T3 voice-grant CSBK references its
    # traffic channel by a 12-bit Logical Channel Number (LCN), never an
    # absolute frequency, so the decoder needs a `dmr_band_plan` to map
    # LCN → downlink Hz. Provide exactly one of `linear` or `table`.
    #
    # AUTOCONFIGURATION: if you OMIT `dmr_band_plan` on a `protocol: dmr`
    # system that is monitored by a `role: wideband` dongle, GopherTrunk
    # learns the plan automatically — it watches the LCNs the control
    # channel grants, detects which RF carriers key up in response across
    # the dongle's IQ band, confirms each is a live DMR burst, and fits
    # the base frequency + channel spacing for the whole LCN enumeration.
    # The learned plan is applied live (previously-dropped grants start
    # following voice) and, when the daemon was started with a -config
    # file, written back here so it survives a restart. A configured
    # `dmr_band_plan` disables learning (your plan is authoritative).
    # Without either a plan or a wideband dongle, T3 voice grants are
    # dropped with decode.error stage=no-bandplan (CC monitoring still
    # works).
    - name: "Example-DMR-T3"
      protocol: dmr
      control_channels:
        - 851_037_500
      talkgroup_file: "../config/talkgroups-dmr.csv"
      dmr_band_plan:
        # Linear grid: freq = base_hz + (lcn - offset) * spacing_hz.
        # offset: 1 matches the common case of sites that number LCNs
        # from 1 (so LCN 1 == base_hz). Use offset: 0 for 0-indexed sites.
        linear:
          base_hz: 851_012_500
          spacing_hz: 25_000
          offset: 1
        # --- OR, for sites whose channels aren't on a regular grid,
        # an explicit LCN → frequency table (omit `linear` if used): ---
        # table:
        #   - { lcn: 1, freq_hz: 851_012_500 }
        #   - { lcn: 2, freq_hz: 851_037_500 }
        #   - { lcn: 9, freq_hz: 851_225_000 }
      # Override the 2-slot interleaved voice decoder. A DMR carrier runs
      # two calls at once (TS1 + TS2); the interleaved decoder pulls each
      # voice grant's own timeslot out of the carrier's interleaved burst
      # stream (auto-detecting the on-air cadence, with or without an
      # inter-burst CACH) and routes it to its call by the embedded Link
      # Control's talkgroup — where the single-slot decoder would splice
      # the two slots into garbled audio (issue #644). Leave UNSET to use
      # the per-protocol default: on for DMR Tier III, single-slot for
      # everything else. Set true/false only to force it for this system.
      # dmr_interleaved_voice: false

  # Per-protocol FEC is on by default — every protocol the daemon
  # supports (TETRA, LTR, P25 Phase 2, NXDN, EDACS, MPT 1327,
  # Motorola Type II, D-STAR) ships its spec-correct on-air decoder
  # chain enabled without needing per-system YAML keys. Operators
  # feeding pre-stripped capture files (DSD-FME `-r` dumps, OP25
  # fixtures, MMDVMHost / DSDcc test data) opt out per-system with
  # the keys below. TETRA additionally requires a non-zero
  # `tetra_colour_code` for non-BSCH channels; descrambling produces
  # garbage without it.
  #
  # The full key reference + on / off semantics lives in the README's
  # "FEC opt-outs" section: https://github.com/MattCheramie/GopherTrunk#fec-opt-outs
  #
  # Example opt-outs for operators using pre-stripped captures.
  # Copy any block, uncomment, and tune to your system:
  #
  #   - name: "Legacy-Motorola"
  #     protocol: motorola
  #     control_channels: [851_012_500]
  #     motorola_bch_mode: "off"        # pre-stripped 32-bit raw OSWs
  #
  #   - name: "Legacy-LTR"
  #     protocol: ltr
  #     control_channels: [935_012_500]
  #     ltr_fcs_mode: "off"             # skip CRC-7 FCS (synth fixture)
  #     ltr_manchester_mode: "off"      # raw NRZ stream
  #
  #   - name: "Legacy-NXDN"
  #     protocol: nxdn
  #     control_channels: [462_212_500]
  #     nxdn_viterbi_mode: "off"        # legacy 44-dibit raw CAC
  #     # nxdn_soft_decision: "on"      # per-bit soft Viterbi on the spec
  #     #                               # CAC decode (marginal-signal gain)
  #     # nxdn_afc: "on"                # post-clock coarse carrier AFC for
  #     #                               # a rig with a real tuner ppm error
  #     #                               # (off by default: NXDN's unwhitened
  #     #                               # CAC runs drift the coarse tracker)
  #     # nxdn_deviation_hz: 2400       # override 1800 Hz spec default
  #                                     # for non-spec transmitters (see
  #                                     # samples/nxdn/README.md sweep recipe)
  #
  #   - name: "Linear-CQPSK-P25"
  #     protocol: p25
  #     control_channels: [420_087_500]
  #     p25_phase1_demod_mode: "cqpsk"  # linear-CQPSK / LSM path — for a
  #                                     # system that actually transmits
  #                                     # Linear Simulcast Modulation
  #                                     # rather than C4FM (issue #275).
  #                                     # NOT triggered by a site being
  #                                     # simulcast — most simulcast
  #                                     # systems are C4FM; set this only
  #                                     # when C4FM won't lock a strong,
  #                                     # clean signal (issue #935). Also
  #                                     # routes the per-call voice chain
  #                                     # through the linear path; without
  #                                     # it voice grants on a CQPSK site
  #                                     # time out with no audio (#356).
  #     # p25_phase1_soft_decision: "on"  # per-bit soft Viterbi on the
  #     #                               # C4FM TSBK trellis (marginal-
  #     #                               # signal gain; C4FM sites only)
  #     # p25_quiet_noncontrol_duid: true # silence the per-frame
  #     #                               # "non-control DUID" debug line
  #     #                               # (TDU spam on a busy CC); decode
  #     #                               # behaviour unchanged
  #
  #   - name: "Legacy-P25-Phase2"
  #     protocol: p25
  #     control_channels: [851_006_250]
  #     p25_phase2_trellis_mode: "off"  # legacy 72-dibit raw MAC PDU
  #     # p25_phase2_rs_mode: "correct" # RS(24,16,9): "on"=syndrome drop,
  #     #                              # "correct"=fix up to 4 symbol errors
  #     #                              # (weak-frame source-RID recovery, #915)
  #     # p25_phase2_interleave_mode: "on"    # per-burst block deinterleave
  #     # p25_phase2_scrambler_mode: "probe"  # blind PN44 slot probe
  #     #                              # (degrades to off without rs on/correct)
  #     # p25_phase2_soft_decision: "on"      # soft-decision MAC trellis
  #     #                              # (~1.5-2 dB; recovers weak-signal RIDs)
  #     # p25_phase2_equalizer: "on"          # blind CMA equalizer: removes
  #     #                              # residual ISI (multipath/timing/RRC)
  #     #                              # ahead of the differential decode (#915)
  #     # p25_phase2_dc_block: "on"           # strip a zero-IF front end's DC
  #     #                              # spur on the voice channel (the P1/
  #     #                              # TETRA voice-receiver stage)
  #     # p25_phase2_clock_mode: "naive"      # decimate; default Gardner
  #
  #   - name: "Legacy-TETRA"
  #     protocol: tetra
  #     control_channels: [410_000_000]
  #     tetra_colour_code: 53           # required for non-BSCH (low 30 bits)
  #     tetra_channel: "sch/hd"         # sch/hd | sch/f | sch/hu | bsch | aach
  #     tetra_channel_coding: "off"     # legacy 48-dibit raw PDU
  #     # tetra_clock_mode: "naive"     # decimate; default Gardner
  #     # tetra_traffic_lms: "on"       # midamble-trained LMS on the
  #     #                               # traffic soft path (opt-in until
  #     #                               # the GT_TETRA_LMS capture A/B)
  #
  #   - name: "Legacy-EDACS"
  #     protocol: edacs
  #     control_channels: [856_012_500]
  #     edacs_bch_mode: "off"           # legacy pre-stripped 40-bit CCW
  #
  #   - name: "Legacy-MPT1327"
  #     protocol: mpt1327
  #     control_channels: [165_787_500]
  #     mpt1327_bch_mode: "off"         # legacy 38-bit pre-stripped codeword
  #     # mpt1327_cwsc_tolerance: 0     # exact CWSC match (default: 2 bits)
  #
  #   - name: "Legacy-DStar"
  #     protocol: dstar
  #     control_channels: [144_000_000]
  #     dstar_fec_mode: "on"            # default off — flip on for raw 660-bit
  #                                     # on-wire D-STAR JARL DV-mode headers
  #
  # Encrypted DMR systems (ARC4 / RC4 "Enhanced Privacy"). If you are
  # authorized to monitor a DMR system that encrypts voice with ARC4
  # and you hold the key, list it under `encryption_keys`. GopherTrunk
  # decrypts only with operator-supplied keys — it performs no key
  # recovery. `key_id` matches the key identifier the radios carry in
  # the privacy header (a system may rotate between several keys).
  # `key` is hex; whitespace and an optional "0x" prefix are ignored.
  #
  #   - name: "Example-DMR-Encrypted"
  #     protocol: dmr
  #     control_channels: [451_000_000]
  #     talkgroup_file: "../config/talkgroups-dmr.csv"
  #     encryption_keys:
  #       - key_id: 1
  #         algorithm: rc4              # only "rc4" is supported today
  #         key: "0123456789"           # hex-encoded key

# Police-scanner subsystems:
#   - scan_mode controls the engine's per-grant gate. "all" follows every
#     non-locked-out grant (the original behavior). "list" only follows
#     grants whose talkgroup carries Scan=true; Emergency grants bypass.
#   - cc_hunt is the multi-system control-channel scanner. Operator can
#     hold/resume/force-retune any system from the TUI Scanner panel.
#   - conventional is the fixed-frequency analog FM scan list. Requires
#     a dedicated Voice SDR (the last voice device in the pool is used).
scanner:
  scan_mode: all       # all | list
  cc_hunt:
    enabled: true
    dwell_ms: 3000
    backoff_ms: 5000
    max_backoff_ms: 60000
  # manual_tune_enabled forces construction of the conventional
  # scanner so the TUI's `f` key (or POST /api/v1/scanner/manual_tune)
  # can VFO-tune at runtime even when no static channels are
  # configured. With this set the scanner steals one Voice SDR
  # from the trunking pool regardless of how many Voice SDRs
  # exist.
  #
  # Default false; the daemon auto-detects when >= 2 Voice SDRs
  # are present and constructs the scanner from the spare without
  # needing this flag. To keep all Voice SDRs reserved for
  # trunking even with a spare, set manual_tune_disabled: true to
  # opt out of the auto-detect.
  manual_tune_enabled: false
  # manual_tune_disabled vetoes the auto-detect rule.
  manual_tune_disabled: false
  conventional: []
  # Example conventional channels:
  # conventional:
  #   - label: "Sheriff Repeater"
  #     frequency_hz: 155895000
  #     mode: fm
  #     squelch_dbfs: -48
  #     hangtime_ms: 1500
  #     priority: 4
  #     # Optional fixed talkgroup ID for the API / call log / scan-type
  #     # upload consumers (Rdio Scanner, OpenMHz, Broadcastify Calls).
  #     # Unset = a positional synthetic ID (0x80000000 | list index) that
  #     # SHIFTS when channels are reordered/inserted/removed — pin an
  #     # explicit ID to keep talkgroup_file roster rows durable (#1105).
  #     # talkgroup_id: 2147500000
  #     # Optional CTCSS / DCS sub-audible squelch gate. With tone
  #     # gating set the scanner only opens when both the carrier is
  #     # present AND the configured tone is detected, so adjacent-
  #     # system traffic on the same frequency doesn't trigger a
  #     # false dwell. Omit / set mode: none to disable.
  #     tone:
  #       mode: ctcss        # ctcss | dcs | none
  #       ctcss_hz: 100.0    # required for ctcss
  #       # dcs_code: "023"  # required for dcs (3-digit octal)

# audio routes decoded PCM to the host's speakers. Disabled by default;
# WAV recording is unaffected and continues whether audio is on or off.
# Backend init failure (no audio device, no PulseAudio/ALSA) falls back
# to a silent player automatically so the daemon stays running.
audio:
  enabled: false       # set true to play decoded calls live
  device: ""           # empty = system default sink; "null" forces no-op;
                       # on Linux, "ioctl" or "ioctl:hw:C,D" bypasses
                       # libasound2 entirely (direct kernel ioctl on
                       # /dev/snd/pcmC*D*p — useful for distroless /
                       # Alpine containers without libasound2.so.2)
  sample_rate: 8000    # must match recordings.sample_rate
  buffer_ms: 80        # playback queue depth; higher = more jitter-tolerant
  volume: 0.8          # 0..1 software gain
  muted: false
  live_loudness: false # real-time AGC on the live network stream (WebUI /
                       # gRPC) so its loudness tracks the normalized
                       # recordings instead of arriving raw/quieter. Only
                       # touches digital decoded audio on the live path; the
                       # on-disk WAV keeps its own recordings.normalize and is
                       # never double-processed. Default off.

# tone_out fires events.KindToneAlert when the configured paging tones
# are detected on a Voice device's PCM stream. An empty `profiles`
# list disables the detector (the daemon default).
#
# Two-tone sequential (Motorola Quick Call II) is the most common US
# fire/EMS pattern: an A-tone followed by a B-tone, each with a
# typical Quick Call II frequency from the Motorola 1000-1400 Hz
# group. Operators verify tone pairs against their agency's
# dispatch console — the example below is illustrative only.
#
# Per-profile schema (see internal/voice/toneout/profile.go for the
# Validate() rules):
#   name                 — required, unique within profiles list
#   alpha_tag            — human-readable label (UI / webhook / log)
#   tones                — ordered tone list, ≥ 1 entry
#     frequency_hz       — target tone (Hz)
#     min_duration       — required dwell before counting
#     max_duration       — caps the on-time; 0 = no upper bound
#   tolerance_hz         — frequency drift tolerance (default 15 Hz)
#   magnitude_threshold  — Goertzel-magnitude floor (default 0.05)
#   max_gap              — silence allowed between tones (default 200ms)
#   cooldown             — re-fire suppression window (default 30s)
#   system               — restrict to one trunked system (empty = all)
#   group_id             — restrict to one talkgroup (0 = all)
tone_out:
  profiles:
    # Quick Call II two-tone sequential — the canonical US fire/EMS
    # paging pattern. Replace the frequencies with your agency's
    # actual A/B tones.
    - name: "station-1-engine"
      alpha_tag: "Station 1 Engine"
      cooldown: "30s"
      tones:
        - frequency_hz: 1042.2
          min_duration: "250ms"
          max_duration: "1500ms"
        - frequency_hz: 1297.4
          min_duration: "2.5s"
          max_duration: "5s"

    # ---------------------------------------------------------------
    # Additional example profiles (commented out — uncomment and
    # adjust per your agency). Multiple profiles can coexist; the
    # detector fires the first one whose tone sequence matches.
    # ---------------------------------------------------------------
    #
    # # Single-tone supervisory page (older simplex pattern). Useful
    # # when an agency still uses a one-shot dispatcher tone instead
    # # of a sequential A/B pair.
    # - name: "supervisor-recall"
    #   alpha_tag: "Supervisor Recall"
    #   cooldown: "60s"
    #   tones:
    #     - frequency_hz: 1500.0
    #       min_duration: "500ms"
    #       max_duration: "3s"
    #
    # # Two-tone with system + talkgroup scoping. Use when the same
    # # tone pair appears on multiple systems and you only want the
    # # alert to fire for one talkgroup on one named system.
    # - name: "metro-fire-dispatch"
    #   alpha_tag: "Metro Fire Dispatch"
    #   system: "Example-P25"     # matches trunking.systems[].name
    #   group_id: 42              # talkgroup ID
    #   cooldown: "45s"
    #   tones:
    #     - frequency_hz: 853.8
    #       min_duration: "250ms"
    #       max_duration: "1500ms"
    #     - frequency_hz: 960.9
    #       min_duration: "2.5s"
    #       max_duration: "5s"
    #
    # # Tightened tolerances for an agency with very stable
    # # frequency reference. Drops the default 15 Hz tolerance to
    # # 5 Hz and raises the magnitude floor to filter weak co-channel
    # # bleed-over.
    # - name: "county-ems-tac"
    #   alpha_tag: "County EMS Tac"
    #   tolerance_hz: 5.0
    #   magnitude_threshold: 0.10
    #   max_gap: "100ms"
    #   cooldown: "30s"
    #   tones:
    #     - frequency_hz: 1122.5
    #       min_duration: "300ms"
    #       max_duration: "1500ms"
    #     - frequency_hz: 1465.3
    #       min_duration: "2.5s"
    #       max_duration: "5s"

# Outbound call streaming. Completed calls are encoded to MP3 and
# uploaded to call aggregators, or pushed to a live Icecast/ShoutCast
# mountpoint. Empty == disabled. Each backend takes a list of feeds;
# a feed with `enabled: false` is parsed but skipped. The optional
# per-feed `systems:` list restricts a feed to those trunking-system
# names (omit to stream every system). A talkgroup with `stream: false`
# in its CSV/JSON is excluded from all feeds.
broadcast:
  # Drop calls shorter than this from every feed (squelch crackle,
  # failed decodes). 0 streams calls of any length.
  min_duration_ms: 0
  # Concurrent upload workers. 0 uses the built-in default.
  workers: 0

  # broadcastify:
  #   - enabled: true
  #     name: "metro-p25"
  #     api_key: "YOUR_BROADCASTIFY_CALLS_API_KEY"
  #     system_id: 12345
  #     systems: ["Metro P25"]

  # rdioscanner:
  #   - enabled: true
  #     name: "local-rdio"
  #     url: "https://scanner.example.org"
  #     api_key: "YOUR_RDIOSCANNER_API_KEY"
  #     system_id: 1

  # openmhz:
  #   - enabled: true
  #     name: "openmhz-metro"
  #     api_key: "YOUR_OPENMHZ_API_KEY"
  #     short_name: "metro911"

  # icecast:
  #   - enabled: true
  #     name: "live-feed"
  #     host: "stream.example.org"
  #     port: 8000
  #     mount: "/gophertrunk"
  #     username: "source"
  #     password: "YOUR_ICECAST_SOURCE_PASSWORD"
  #     stream_name: "GopherTrunk Live"

  # Generic JSON webhook: POST one JSON object per completed call to your
  # own endpoint (analytics DB, Grafana pipeline, Discord/Slack relay,
  # custom uploader). The payload carries the call metadata — system,
  # talkgroup, source RID, call_type (group/unit/data), frequency, P25 site
  # identity (rfss_id/site_id/nac/channel_id), encryption + emergency flags
  # (with algorithm_id/key_id on encrypted calls), patched groups, and
  # start/stop timestamps. Set include_audio to also embed the base64 MP3.
  # NOTE: recordings.skip_encrypted: true suppresses the webhook for
  # encrypted calls (the call ends before the recorder lifecycle completes);
  # keep skip_encrypted: false to receive them. See issue #897.
  # webhook:
  #   - enabled: true
  #     name: "analytics"
  #     url: "https://example.org/gophertrunk/calls"
  #     auth_header: "Bearer YOUR_TOKEN"   # sent verbatim as Authorization; omit to disable
  #     include_audio: false               # true embeds the base64 MP3 in each POST
  #     systems: ["Metro P25"]             # empty = every system

  # Push grant webhook: POST one JSON object per control-channel grant the
  # moment it is decoded — the push form of GET /api/v1/grants (issue #915).
  # The payload is the same grant schema the REST snapshot and the KindGrant
  # SSE stream use (system, protocol, group_id, source_id, frequency_hz, P25
  # site identity, timeslot, encryption + algorithm_id/key_id, plus an `at`
  # decode timestamp). Grants are surfaced exactly as decoded: a grant whose
  # TSBK carried source_id=0 is POSTed with source_id=0, never backfilled — the
  # source RID rides the grant at call-setup time the way SDRtrunk's grant log
  # reads it, letting a consumer retire a separate grant-log dependency. Unlike
  # the per-call webhook this carries no audio (a grant is a control-channel
  # event, not a recording), and it is independent of recordings.skip_encrypted.
  # grant_webhook:
  #   - enabled: true
  #     name: "grant-log"
  #     url: "https://example.org/gophertrunk/grants"
  #     auth_header: "Bearer YOUR_TOKEN"   # sent verbatim as Authorization; omit to disable
  #     systems: ["Metro P25"]             # empty = every system

# Baseband (IQ) recording and offline replay. `record` taps a tuner and
# writes IQ to a two-channel 16-bit WAV (the same layout SDRtrunk/SDR++ use);
# `replay` mounts recorded WAVs as virtual tuners so a capture can be decoded
# with no radio attached.
#
# Each record entry chooses what it taps with `tap`:
#   tap: wideband (default) — the full-rate raw SDR IQ. Large files; record at
#     the same rate as sdr.sample_rate for real-time-correct playback.
#   tap: ddc — the narrowband digital-down-converter output: the channelized
#     stream the control-channel decoder actually sees, at the pipeline rate
#     (144 kHz for TETRA, ~48 kHz for the C4FM family). Orders of magnitude
#     smaller than wideband, and directly decodable offline with
#     `gophertrunk replay -in rec.wav -format wav -protocol <p>`. Use this to
#     capture a hard-to-decode control channel for sharing/analysis instead of
#     a fat 2.5/10 MS/s capture.
# baseband:
#   record:
#     - serial: "00000001"
#       dir: "../iq/"
#       tap: wideband            # or: ddc (small narrowband channel recording)
#       format: wav              # wav (default, SDRtrunk-compatible RIFF/WAVE)
#                                # | flac (lossless, ~30–50% smaller; replays
#                                #   and mounts back as a tuner identically)
#   replay:
#     - file: "../iq/00000001_20260521T120000Z.wav"
#       serial: "replay-01"
#       role: "control"
#       loop: true
#   # Event-driven raw-IQ capture of the control SDR. When a classified event
#   # fires, a short slice of raw IQ is written to `dir` with a self-describing
#   # filename (<system>_<UTC>_<reason>_<freqHz>_<rateHz>hz.<ext>) plus a
#   # .metadata.json sidecar, so the file drops straight into `replay`/siglab.
#   # A manual trigger is also exposed at POST /api/v1/siglab/autorecord/trigger.
#   auto_record:
#     enabled: true
#     dir: "../iq/auto/"
#     format: cs16               # cs16 (default) | f32 (GNU Radio cfile) | u8
#                                # | wav (RIFF/WAVE wrapper — opens directly in
#                                #   Audacity / analysis tools) | flac (lossless,
#                                #   ~30–50% smaller). wav/flac wrap the same
#                                #   16-bit body, so both stay replayable.
#     tap: wideband              # wideband (default, full-rate SDR — large files)
#                                # | ddc (narrowband channelised stream at the
#                                #   pipeline rate, e.g. 144 kHz for TETRA — far
#                                #   smaller and directly replayable). For a
#                                #   same-carrier TETRA site the ddc tap holds all
#                                #   four voice timeslots of the control carrier.
#     decimate: 5                # wideband tap only: anti-alias decimate the
#                                #   capture to sdr.sample_rate / N (0/1 = full
#                                #   rate). The fix for a radio (e.g. USRP B210)
#                                #   whose hardware rate floor (~1 MS/s) is far
#                                #   above the bandwidth a channel needs — record
#                                #   at the floor, decimate to a small long file.
#     seconds: 8                 # capture length per trigger
#     cooldown: 10s              # min gap between automatic triggers
#     on_concurrent_calls: 2     # fire at N+ concurrent calls (0 = off)
#     on_no_voice_device: true   # fire when a grant found no free voice tuner
#     on_encrypted: true         # fire on an encrypted grant
#     on_emergency: true         # fire on an emergency grant
#     on_cc_sync_loss: true      # fire when a locked control channel suddenly
#                                #   loses sync — captures the re-acquisition IQ,
#                                #   ideal for debugging sync-loss / slow warm-up
#                                #   lock (pair with tap: ddc for small files)
#     on_voice_grant: true       # fire a CC-context capture on every voice grant
#                                #   (rate-limited by cooldown) — the control-
#                                #   channel half of the per-call diagnostic
#                                #   container; pair with voice_iq_debug below
#
#   # Per-call voice-channel IQ debug captures — the voice half of the
#   # "diagnostic container" workflow. Every voice call writes the exact
#   # channelised IQ stream its decode chain consumed to
#   # <dir>/<UTC>_<system>_tg<group>_<freq>_<rate>_voice.cs16 plus a
#   # .metadata.json sidecar (system/talkgroup/source/frequency/rate), so a
#   # hopped voice channel's raw samples are on disk the moment a decode
#   # sounds wrong — replayable directly via `gophertrunk replay` / siglab.
#   # Concurrent calls each get their own files. Heavy on disk when the
#   # voice taps run at a full SDR rate (physical voice tuner) rather than
#   # the channelised 48 kHz of a wideband-derived virtual tap.
#   voice_iq_debug:
#     enabled: true
#     dir: "../iq/voice-debug/"
#     format: cs16               # cs16 (default) | wav (Audacity-ready) | flac
#                                #   (lossless, ~30–50% smaller). All wrap the
#                                #   same 16-bit body and stay replayable.
#     max_mb: 512                # per-call size cap (0 = default 512 MB);
#                                #   the sidecar notes truncation when hit

# User-interface tabs. Every navigation tab shows by default in both the
# web UI and the terminal TUI. If you run GopherTrunk for one main task
# (just trunking, just pagers, …) you can declutter the nav by switching
# the tabs you don't use off here. Setting a tab to false removes it from
# the nav strip only — the panel is still reachable directly by URL. Omit
# this section (or leave it empty) to show everything.
#
# Valid tab keys: dashboard, active, scanner, settings, systems,
# talkgroups, rids, history, events, cc, tones, pagers, aprs, ais, dsc,
# adsb, mdc1200, spectrum, constellation, bookmarks, metrics, devices,
# import. (The feature tabs pagers/aprs/ais/dsc/adsb/mdc1200 are web-only,
# so hiding them is a no-op in the TUI.)
# web:
#   tabs:
#     aprs: false
#     ais: false
#     dsc: false
#     adsb: false
#     mdc1200: false
#
#   # How identity numbers (WACN, System ID, NAC, RFSS, Site) are rendered in
#   # the web UI: "hex" (default — the P25 field convention, shown with the
#   # decimal in parentheses) or "dec" for plain decimal. The JSON API and
#   # event payloads always carry the raw decimal values plus *_hex strings
#   # regardless of this setting; it only changes the bundled web SPA's display.
#   id_base: hex

